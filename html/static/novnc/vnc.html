<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>noVNC - 主機桌面</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
        #screen { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #status { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); 
                  background: rgba(0,0,0,0.7); color: #fff; padding: 6px 20px; border-radius: 20px; 
                  font-size: 13px; z-index: 999; }
    </style>
</head>
<body>
    <div id="status">🟡 連線中...</div>
    <div id="screen"></div>
    <script type="module">
        import RFB from 'https://cdn.jsdelivr.net/npm/@novnc/novnc@1.7.0/core/rfb.js';
        const params = new URLSearchParams(window.location.search);
        const wsPath = params.get('path') || '/novnc-ws';
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}${wsPath}`;
        
        const rfb = new RFB(document.getElementById('screen'), wsUrl, {
            credentials: { password: '' },
            wsProtocols: ['binary']
        });
        
        rfb.addEventListener('connect', () => {
            document.getElementById('status').innerHTML = '🟢 已連線';
        });
        rfb.addEventListener('disconnect', (e) => {
            document.getElementById('status').innerHTML = '🔴 已斷線 - 5秒後重新連線...';
            setTimeout(() => window.location.reload(), 5000);
        });
    </script>
</body>
</html>
