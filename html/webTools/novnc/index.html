<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主機桌面</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
        body { display: flex; flex-direction: column; }

        #statusBar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 6px 14px; background: #16213e; color: #e0e0e0;
            font-size: 12px; border-bottom: 1px solid #0f3460; height: 32px;
            flex-shrink: 0;
        }
        #statusBar .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .dot.connected { background: #4ec9b0; }
        .dot.disconnected { background: #e74c3c; animation: blink 1s infinite; }
        .dot.connecting { background: #f39c12; animation: blink 0.5s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
        #statusText { flex: 1; margin-left: 6px; }
        #statusBar .btns { display: flex; gap: 6px; }
        #statusBar button {
            padding: 3px 10px; font-size: 11px; border: 1px solid #0f3460;
            background: #0f3460; color: #ccc; border-radius: 4px; cursor: pointer;
            transition: all 0.2s;
        }
        #statusBar button:hover { background: #1a5276; color: #fff; }
        #statusBar button.active { background: #4ec9b0; color: #000; border-color: #4ec9b0; }

        #screenWrapper {
            flex: 1; min-height: 0; min-width: 0;
            display: flex;
            background: #0a0a1a; position: relative; overflow: auto;
        }
        #screenWrapper > * { margin: auto; }
        #screenWrapper.panMode { cursor: grab; }
        #screenWrapper.panMode.panning, #screenWrapper.panning { cursor: grabbing; user-select: none; }

        #connectOverlay {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(10,10,26,0.92); z-index: 10;
        }
        #connectOverlay.hidden { display: none; }
        #connectOverlay h2 { color: #e0e0e0; font-size: 18px; margin-bottom: 12px; }
        #connectOverlay .spinner {
            width: 32px; height: 32px; border: 3px solid #0f3460;
            border-top: 3px solid #4ec9b0; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-bottom: 10px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #connectOverlay p { color: #888; font-size: 12px; }

        /* ===== 旋轉（直版顯示） ===== */
        #screenWrapper.rotated .noVNC_screen,
        #screenWrapper.rotated canvas {
            transform: rotate(90deg) !important;
            transform-origin: center center !important;
        }

        /* ===== 剪貼簿面板 ===== */
        #clipPanel {
            position: absolute; right: 8px; bottom: 48px; z-index: 30;
            width: min(320px, calc(100% - 16px));
            background: #16213e; border: 1px solid #0f3460; border-radius: 10px;
            padding: 10px; color: #e0e0e0; font-size: 12px;
            display: none; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        #clipPanel.show { display: block; }
        #clipPanel h4 { margin: 0 0 8px; font-size: 13px; color: #4ec9b0; }
        #clipPanel textarea {
            width: 100%; height: 70px; resize: vertical;
            background: #0a0a1a; color: #e0e0e0; border: 1px solid #0f3460;
            border-radius: 6px; padding: 6px; font-size: 12px; box-sizing: border-box;
            font-family: monospace;
        }
        #clipPanel .row { display: flex; gap: 6px; margin-top: 8px; }
        #clipPanel .row button {
            flex: 1; padding: 6px 4px; font-size: 11px; cursor: pointer;
            background: #0f3460; color: #e0e0e0; border: 1px solid #0f3460;
            border-radius: 6px;
        }
        #clipPanel .row button:hover { background: #4ec9b0; color: #000; }
        #clipPanel .hint { margin-top: 6px; font-size: 10px; color: #888; }

        /* ===== 手機直版優化 ===== */
        @media (max-width: 600px) {
            #statusBar { flex-wrap: wrap; height: auto; padding: 6px 8px; gap: 4px; }
            #statusBar .btns { display: flex; flex-wrap: wrap; gap: 4px; }
            #statusBar button { padding: 4px 6px; font-size: 11px; }
            #statusText { font-size: 11px; }
        }
        #connectOverlay .error-msg { color: #e74c3c; margin-top: 8px; font-size: 11px; max-width: 80%; text-align: center; }
    </style>
</head>
<body>

    <div id="statusBar">
        <span class="dot disconnected" id="statusDot"></span>
        <span id="statusText">未連接</span>
        <div class="btns">
            <button id="btnFit" class="active" title="適應視窗">🔲 適應</button>
            <button id="btnPan" title="拖曳平移：畫面超出時按住拖動捲動">🖐️ 拖曳</button>
            <button id="btnFull" title="原始大小">📐 1:1</button>
            <button id="btnViewOnly" title="切換唯讀/控制">🖱️ 控制</button>
            <button id="btnReconnect" title="重新連線">🔄 重連</button>
            <button id="btnRotate" title="旋轉 90°（直版/橫版切換）">↻ 直版</button>
            <button id="btnClipboard" title="貼上剪貼簿">📋 貼上</button>
            <button id="btnClipPanel" title="剪貼簿面板">📋 剪貼簿</button>
        </div>
    </div>

    <div id="screenWrapper">
        <div id="connectOverlay">
            <div class="spinner"></div>
            <h2>正在連接主機桌面...</h2>
            <p id="connectDetail"></p>
            <p class="error-msg" id="errorMsg"></p>
        </div>

        <div id="clipPanel">
            <h4>📋 剪貼簿</h4>
            <textarea id="clipText" placeholder="桌面剪貼簿內容（可編輯後貼回桌面）"></textarea>
            <div class="row">
                <button id="btnClipCopy">⬇️ 複製到手機</button>
                <button id="btnClipPaste">⬆️ 貼上到桌面</button>
            </div>
            <div class="hint" id="clipHint">桌面剪貼簿變更會自動同步到這裡；編輯後按「貼上到桌面」寫入</div>
        </div>
    </div>

    <script type="module">
        // ===== noVNC ES Module import (from jsDelivr CDN) =====
        import RFB from 'https://cdn.jsdelivr.net/npm/@novnc/novnc@1.7.0/core/rfb.js';

        // ===== DOM =====
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const overlay = document.getElementById('connectOverlay');
        const connectDetail = document.getElementById('connectDetail');
        const errorMsg = document.getElementById('errorMsg');
        const btnFit = document.getElementById('btnFit');
        const btnFull = document.getElementById('btnFull');
        const btnViewOnly = document.getElementById('btnViewOnly');
        const btnReconnect = document.getElementById('btnReconnect');
        const btnPan = document.getElementById('btnPan');
        const btnClipboard = document.getElementById('btnClipboard');
        const screenWrapper = document.getElementById('screenWrapper');
        const btnRotate = document.getElementById('btnRotate');
        const btnClipPanel = document.getElementById('btnClipPanel');
        const clipPanel = document.getElementById('clipPanel');
        const clipText = document.getElementById('clipText');
        const clipHint = document.getElementById('clipHint');

        let rfb = null;
        let viewOnly = false;
        let fitMode = true;
        let autoReconnectTimer = null;
        let reconnectAttempts = 0;
        let rotated = false;

        function getWSURL() {
            const params = new URLSearchParams(window.location.search);
            const wsPath = params.get('path') || '/novnc-ws';
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            return `${protocol}//${window.location.host}${wsPath}`;
        }

        function setStatus(state, text) {
            statusDot.className = 'dot ' + state;
            statusText.textContent = text;
        }

        function scheduleReconnect() {
            if (autoReconnectTimer) return;
            reconnectAttempts++;
            const delay = Math.min(3000 * reconnectAttempts, 30000);
            setStatus("connecting", "自動重連中...");
            connectDetail.textContent = "將在 " + (delay * 0.001) + " 秒後自動重連（第 " + reconnectAttempts + " 次）";
            autoReconnectTimer = setTimeout(() => {
                autoReconnectTimer = null;
                connect();
            }, delay);
        }

        function connect() {
            if (autoReconnectTimer) { clearTimeout(autoReconnectTimer); autoReconnectTimer = null; }
            if (rfb) {
                try { rfb.disconnect(); } catch(e) {}
                rfb = null;
            }

            const wsUrl = getWSURL();
            setStatus('connecting', '連線中...');
            overlay.classList.remove('hidden');
            connectDetail.textContent = 'WebSocket: ' + wsUrl;
            errorMsg.textContent = '';

            try {
                rfb = new RFB(screenWrapper, wsUrl, {
                    credentials: { password: '' },
                    shared: true,
                    repeaterID: '',
                });

                rfb.addEventListener('connect', () => {
                    setStatus('connected', '已連接 ✅');
                    overlay.classList.add('hidden');
                    reconnectAttempts = 0;
                    applyFitMode();
                    ensureOrientation();
                });

                rfb.addEventListener('disconnect', (e) => {
                    const reason = e.detail.clean ? '正常斷線' : (e.detail.reason || '連線中斷');
                    setStatus('disconnected', '斷線');
                    overlay.classList.remove('hidden');
                    connectDetail.textContent = reason;
                    if (!e.detail.clean) {
                        scheduleReconnect();
                        errorMsg.textContent = '💡 提示：確認主機端 VNC 服務是否已啟動（bash ~/.mok/setup_desktop.sh）';
                    }
                });

                rfb.addEventListener('credentialsrequired', () => {
                    rfb.sendCredentials({ password: '' });
                });

                rfb.addEventListener('clipboard', (e) => {
                    if (e.detail.text) {
                        navigator.clipboard.writeText(e.detail.text).catch(()=>{});
                        clipText.value = e.detail.text;
                        clipHint.textContent = '📥 已同步桌面剪貼簿內容';
                        setTimeout(() => { clipHint.textContent = '桌面剪貼簿變更會自動同步到這裡；編輯後按「貼上到桌面」寫入'; }, 3000);
                    }
                });

                rfb.viewOnly = viewOnly;
                rfb.scaleViewport = true;
                rfb.resizeSession = false;

            } catch (err) {
                setStatus('disconnected', '初始化失敗');
                overlay.classList.remove('hidden');
                errorMsg.textContent = '❌ ' + err.message;
            }
        }

        function applyFitMode() {
            if (!rfb) return;
            if (fitMode) {
                rfb.scaleViewport = true;
                rfb.resizeSession = false;
                btnFit.classList.add('active');
                btnFull.classList.remove('active');
            } else {
                rfb.scaleViewport = false;
                rfb.resizeSession = false;
                btnFit.classList.remove('active');
                btnFull.classList.add('active');
            }
        }

        function disconnect() {
            if (rfb) {
                rfb.disconnect();
                rfb = null;
            }
            setStatus('disconnected', '未連接');
            overlay.classList.remove('hidden');
            connectDetail.textContent = '點擊 🔄 重連';
            errorMsg.textContent = '';
        }

        // ===== 拖曳平移（畫面超出可視範圍時使用） =====
        let panMode = false;
        let panning = false;
        let panStartX = 0, panStartY = 0, panStartL = 0, panStartT = 0;

        function getScreenEl() {
            return screenWrapper.querySelector('.noVNC_screen') || screenWrapper;
        }
        function hasOverflow() {
            const el = getScreenEl();
            return el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1;
        }

        screenWrapper.addEventListener('pointerdown', (e) => {
            // 只處理滑鼠：觸控交由瀏覽器原生捲動（單指滑動平移、點擊仍可操作桌面）
            if (e.pointerType !== 'mouse') return;
            if (!hasOverflow()) return;                       // 畫面完整可見時不攔截，維持正常操作
            if (!(panMode || e.button === 1)) return;         // 拖曳模式 或 中鍵拖曳
            panning = true;
            const el = getScreenEl();
            panStartX = e.clientX; panStartY = e.clientY;
            panStartL = el.scrollLeft; panStartT = el.scrollTop;
            screenWrapper.classList.add('panning');
            try { screenWrapper.setPointerCapture(e.pointerId); } catch (err) {}
            e.preventDefault();
            e.stopImmediatePropagation();
        }, true);

        screenWrapper.addEventListener('pointermove', (e) => {
            if (!panning) return;
            const el = getScreenEl();
            el.scrollLeft = panStartL - (e.clientX - panStartX);
            el.scrollTop  = panStartT - (e.clientY - panStartY);
            e.preventDefault();
            e.stopImmediatePropagation();
        }, true);

        const endPan = (e) => {
            if (!panning) return;
            panning = false;
            screenWrapper.classList.remove('panning');
            if (e) { e.preventDefault(); e.stopImmediatePropagation(); }
        };
        screenWrapper.addEventListener('pointerup', endPan, true);
        screenWrapper.addEventListener('pointercancel', endPan, true);

        // ===== 按鈕事件 =====
        btnPan.addEventListener('click', () => {
            panMode = !panMode;
            btnPan.classList.toggle('active', panMode);
            screenWrapper.classList.toggle('panMode', panMode);
            btnPan.title = panMode ? '拖曳模式：按住左鍵拖動捲動畫面（再按一次關閉）' : '拖曳平移：畫面超出時按住拖動捲動';
        });
        btnFit.addEventListener('click', () => { fitMode = true; applyFitMode(); });
        btnFull.addEventListener('click', () => { fitMode = false; applyFitMode(); });
        btnViewOnly.addEventListener('click', () => {
            viewOnly = !viewOnly;
            if (rfb) rfb.viewOnly = viewOnly;
            btnViewOnly.textContent = viewOnly ? '👁️ 唯讀' : '🖱️ 控制';
            btnViewOnly.classList.toggle('active', viewOnly);
        });
        btnReconnect.addEventListener('click', () => { disconnect(); setTimeout(connect, 300); });
        btnClipboard.addEventListener('click', async () => {
            if (!rfb || viewOnly) return;
            try {
                const text = await navigator.clipboard.readText();
                if (text) rfb.clipboardPasteFrom(text);
            } catch(e) {
                errorMsg.textContent = '⚠️ 無法讀取剪貼簿（需要 HTTPS 且授權）';
                setTimeout(() => { errorMsg.textContent = ''; }, 3000);
            }
        });


        // ===== 自動對齊方向 =====
        function ensureOrientation() {
            if (!rfb) return;
            let w = 0, h = 0;
            try {
                const d = rfb.get_display();
                w = d.get_width();
                h = d.get_height();
            } catch (e) { return; }
            const pv = window.innerHeight > window.innerWidth;
            if ((pv && w > h) || (!pv && w < h)) {
                fetch("/novnc-rotate?mode=" + (pv ? "portrait" : "landscape"), { cache: "no-store" }).then(r => r.json()).then(d => {
                    if (d.ok) {
                        btnRotate.textContent = d.mode === "portrait" ? "📱 直版" : "↻ 橫版";
                        if (rfb) { rfb.disconnect(); rfb = null; }
                        setTimeout(() => connect(), 600);
                    }
                }).catch(() => {});
            }
        }
        // ===== 直版旋轉 =====
        btnRotate.addEventListener('click', () => {
            rotated = !rotated;
            btnRotate.classList.toggle('active', rotated);
            // 優先嘗試伺服器端旋轉（xrandr）：座標完全正確
            fetch('/novnc-rotate', { cache: 'no-store' })
                .then(r => r.json())
                .then(data => {
                    if (data.ok) {
                        rotated = false;
                        screenWrapper.classList.remove('rotated');
                        btnRotate.textContent = data.mode === 'portrait' ? '📱 直版' : '↻ 橫版';
                        // 重新連線以取得新解析度畫面
                        if (rfb) { rfb.disconnect(); rfb = null; }
                        setTimeout(() => connect(), 600);
                        return;
                    }
                    applyCssRotate();
                })
                .catch(() => applyCssRotate());
        });

        function applyCssRotate() {
            rotated = false;
            screenWrapper.classList.remove('rotated');
            btnRotate.textContent = '↻ 橫版';
            errorMsg.textContent = '⚠️ 伺服器端缺少 xrandr，無法切換直版解析度（畫面保持直立）';
            setTimeout(() => { errorMsg.textContent = ''; }, 4000);
            if (rfb) {
                const sv = rfb.scaleViewport;
                rfb.scaleViewport = false;
                rfb.scaleViewport = sv;
            }
        }

        // 旋轉模式下修正觸控/滑鼠座標（順時針 90°）
        let synthPointer = false;
        ['pointerdown','pointermove','pointerup','pointercancel'].forEach(evt => {
            screenWrapper.addEventListener(evt, (e) => {
                if (!rotated || synthPointer) return;
                const rect = screenWrapper.getBoundingClientRect();
                const W = rect.width, H = rect.height;
                const relX = e.clientX - rect.left;
                const relY = e.clientY - rect.top;
                const px = relY;
                const py = W - relX;
                synthPointer = true;
                e.stopImmediatePropagation();
                const proxy = new MouseEvent(e.type, {
                    clientX: rect.left + px,
                    clientY: rect.top + py,
                    button: e.button, buttons: e.buttons,
                    bubbles: true, cancelable: true
                });
                screenWrapper.dispatchEvent(proxy);
                synthPointer = false;
            }, true);
        });

        // ===== 剪貼簿面板 =====
        btnClipPanel.addEventListener('click', () => {
            clipPanel.classList.toggle('show');
        });
        document.addEventListener('click', (e) => {
            if (clipPanel.classList.contains('show') &&
                !clipPanel.contains(e.target) &&
                e.target !== btnClipPanel) {
                clipPanel.classList.remove('show');
            }
        });
        btnClipCopy.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(clipText.value);
                clipHint.textContent = '✅ 已複製到手機剪貼簿';
            } catch(e) {
                clipHint.textContent = '⚠️ 複製失敗（需要 HTTPS）';
            }
            setTimeout(() => { clipHint.textContent = '桌面剪貼簿變更會自動同步到這裡；編輯後按「貼上到桌面」寫入'; }, 2500);
        });
        btnClipPaste.addEventListener('click', () => {
            if (!rfb) { clipHint.textContent = '⚠️ 尚未連線'; return; }
            const text = clipText.value;
            if (text) {
                rfb.clipboardPasteFrom(text);
                clipHint.textContent = '✅ 已貼上到桌面剪貼簿';
                setTimeout(() => { clipHint.textContent = '桌面剪貼簿變更會自動同步到這裡；編輯後按「貼上到桌面」寫入'; }, 2500);
            }
        });

        // ===== 啟動 =====
        const params = new URLSearchParams(window.location.search);
        if (params.get('autoconnect') !== 'false') {
            connect();
        } else {
            setStatus('disconnected', '未連接');
            overlay.classList.remove('hidden');
            connectDetail.textContent = '點擊 🔄 重連 開始';
        }
    </script>
</body>
</html>
