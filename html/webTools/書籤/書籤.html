<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📑 書籤</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background:#1e1e1e; color:#d4d4d4; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
.header { padding:10px 12px; border-bottom:1px solid #3e3e42; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
.header h2 { color:#4ec9b0; font-size:1rem; }
.header button { background:#4ec9b0; color:#1e1e1e; border:none; border-radius:6px; padding:5px 12px; cursor:pointer; font-size:0.8rem; font-weight:bold; }
.list { flex:1; overflow-y:auto; padding:8px; }
.card { margin-bottom:10px; padding:10px; background:#252526; border-radius:8px; border-left:3px solid #4ec9b0; }
.card-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.card-top .id { font-size:0.75rem; color:#4ec9b0; }
.card-top .time { font-size:0.7rem; color:#888; }
.card-snippet { font-size:0.8rem; color:#ccc; margin-bottom:8px; max-height:68px; overflow:hidden; }
.bm-title-line { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
.bm-title-line .bm-title { flex:1; color:#4ec9b0; font-weight:bold; font-size:0.85rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.btn-title-edit { background:#333; border:1px solid #4ec9b0; border-radius:4px; color:#4ec9b0; cursor:pointer; font-size:0.7rem; padding:1px 8px; flex-shrink:0; }
.btn-title-edit:hover { background:#4ec9b0; color:#1e1e1e; }
.card-actions { display:flex; gap:6px; }
.card-actions button { background:#333; border:1px solid #555; border-radius:4px; cursor:pointer; font-size:0.7rem; padding:3px 10px; color:#ccc; }
.card-actions .btn-view { border-color:#4ec9b0; color:#4ec9b0; }
.card-actions .btn-copy { border-color:#dcdcaa; color:#dcdcaa; }
.card-actions .btn-del { border-color:#f44747; color:#f44747; }
.empty { color:#888; text-align:center; margin-top:40px; }
.loading { color:#888; text-align:center; margin-top:40px; }
.modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; display:flex; align-items:center; justify-content:center; }
.modal-box { background:#1e1e1e; border:1px solid #4ec9b0; border-radius:12px; width:90vw; max-width:750px; max-height:85vh; display:flex; flex-direction:column; }
.modal-header { padding:12px; border-bottom:1px solid #3e3e42; display:flex; justify-content:space-between; align-items:center; }
.modal-header span { color:#4ec9b0; font-weight:bold; }
.modal-header button { background:none; border:none; color:#ccc; font-size:1.2rem; cursor:pointer; }
.modal-body { flex:1; overflow-y:auto; padding:12px; font-size:0.85rem; color:#d4d4d4; white-space:pre-wrap; font-family: 'Cascadia Code', monospace; max-height:65vh; }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#4ec9b0; color:#1e1e1e; padding:8px 20px; border-radius:20px; font-size:0.85rem; z-index:2000; opacity:0; transition:opacity 0.3s; pointer-events:none; }
.toast.show { opacity:1; }
</style>
</head>
<body>

<div class="header">
<h2>📑 書籤列表</h2>
<button onclick="loadBookmarks()">🔄 刷新</button>
</div>
<div class="list" id="bookmarkList">
<div class="loading">⏳ 載入中...</div>
</div>
<div class="toast" id="toast"></div>

<script>
let toastTimer;
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

function loadBookmarks() {
    const listDiv = document.getElementById('bookmarkList');
    listDiv.innerHTML = '<div class="loading">⏳ 載入中...</div>';

    fetch('/api/bookmark/list')
        .then(r => r.json())
        .then(data => {
            if (!data.bookmarks || data.bookmarks.length === 0) {
                listDiv.innerHTML = '<div class="empty">📭 尚無書籤<br><small>點擊對話旁的 🔖 按鈕加入</small></div>';
                return;
            }
            let html = '';
            data.bookmarks.forEach(function(bm, idx) {
                const ts = bm.timestamp ? new Date(bm.timestamp * 1000).toLocaleString('zh-TW') : '未知時間';
                const roleIcon = bm.role === 'user' ? '👤' : '🤖';
                const convId = bm.conv_id || '?';
                html += '<div class="card">' +
                    '<div class="card-top">' +
                        '<span class="id">' + roleIcon + ' 📑 ID:' + convId + ' @' + (bm.agent || '-') + '</span>' +
                        '<span class="time">' + ts + '</span>' +
                    '</div>' +
                    '<div class="card-snippet">' +
                        '<div class="bm-title-line"><span class="bm-title">📌 ' + (bm.title || '（未命名）') + '</span>' +
                        '<button class="btn-title-edit" onclick="editBmTitle(\'' + convId + '\', this)">✏️ 編輯標題</button></div>' +
                        (bm.snippet || '(無內容)') +
                    '</div>' +
                    '<div class="card-actions">' +
                        '<button class="btn-view" onclick="viewConv(\'' + convId + '\')">👁 查看完整對話</button>' +
                        '<button class="btn-copy" onclick="copyConv(\'' + convId + '\')">📋 一鍵複製</button>' +
                        '<button class="btn-del" onclick="deleteBm(' + idx + ')">🗑 刪除</button>' +
                    '</div>' +
                '</div>';
            });
            listDiv.innerHTML = html;
        })
        .catch(function(err) {
            listDiv.innerHTML = '<div class="empty" style="color:#f44747;">❌ 載入失敗：' + err.message + '</div>';
        });
}

function viewConv(convId) {
    fetch('/api/bookmark/conversation?conv_id=' + encodeURIComponent(convId))
        .then(r => r.json())
        .then(data => {
            if (data.error) { showToast('⚠️ ' + data.error); return; }
            const msgs = data.messages || [];
            let text = '📑 對話 ID:' + convId + '\n' + '='.repeat(40) + '\n';
            msgs.forEach(function(m) {
                const role = m.role === 'user' ? '👤 使用者' : '🤖 助手';
                text += '\n【' + role + '】' + (m.timestamp ? ' ' + new Date(m.timestamp * 1000).toLocaleString('zh-TW') : '') + '\n';
                text += (m.content || '(無內容)') + '\n';
                if (m.think_content) text += '💭 思考: ' + m.think_content + '\n';
            });
            showModal(text);
        })
        .catch(function(err) { showToast('❌ ' + err.message); });
}

function copyConv(convId) {
    fetch('/api/bookmark/conversation?conv_id=' + encodeURIComponent(convId))
        .then(r => r.json())
        .then(data => {
            if (data.error) { showToast('⚠️ ' + data.error); return; }
            const msgs = data.messages || [];
            let text = '📑 對話 ID:' + convId + '\n' + '='.repeat(40) + '\n';
            msgs.forEach(function(m) {
                const role = m.role === 'user' ? '👤 使用者' : '🤖 助手';
                text += '\n【' + role + '】' + (m.timestamp ? ' ' + new Date(m.timestamp * 1000).toLocaleString('zh-TW') : '') + '\n';
                text += (m.content || '(無內容)') + '\n';
                if (m.think_content) text += '💭 思考: ' + m.think_content + '\n';
            });
            navigator.clipboard.writeText(text).then(function() {
                showToast('✅ 已複製完整對話！');
            }).catch(function() { showToast('複製失敗'); });
        })
        .catch(function(err) { showToast('❌ ' + err.message); });
}

function deleteBm(idx) {
    if (!confirm('確定要刪除此書籤嗎？')) return;
    fetch('/api/bookmark/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ index: idx })
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            showToast('🗑 書籤已刪除');
            loadBookmarks();
        } else {
            showToast('⚠️ ' + (data.error || '刪除失敗'));
        }
    })
    .catch(function(err) { showToast('❌ ' + err.message); });
}

function editBmTitle(convId, btn) {
    if (!convId) return;
    const card = btn ? btn.closest('.card') : null;
    const titleEl = card ? card.querySelector('.bm-title') : null;
    const oldTitle = titleEl ? titleEl.textContent.replace(/^📌\s*/, '').trim() : '';
    const def = (oldTitle === '（未命名）' || oldTitle === '未命名') ? '' : oldTitle;
    const newTitle = prompt('📌 編輯書籤標題：', def);
    if (newTitle === null) return;
    fetch('/api/bookmark/rename', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ conv_id: convId, title: newTitle.trim() })
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) { showToast('✅ 書籤標題已更新'); loadBookmarks(); }
        else { showToast('⚠️ ' + (data.error || '更新失敗')); }
    })
    .catch(function(err) { showToast('❌ ' + err.message); });
}

function showModal(text) {
    let modal = document.getElementById('convModal');
    if (!modal) {
        modal = document.createElement('div');
        modal.id = 'convModal';
        modal.className = 'modal-overlay';
        modal.innerHTML = '<div class="modal-box">' +
            '<div class="modal-header">' +
                '<span>📑 對話內容</span>' +
                '<button onclick="closeModal()">✕</button>' +
            '</div>' +
            '<div class="modal-body" id="modalBody"></div>' +
        '</div>';
        document.body.appendChild(modal);
        modal.addEventListener('click', function(e) { if (e.target === modal) closeModal(); });
    }
    document.getElementById('modalBody').textContent = text;
    modal.style.display = 'flex';
}

function closeModal() {
    const modal = document.getElementById('convModal');
    if (modal) modal.remove();
}

loadBookmarks();
</script>
</body>
</html>
