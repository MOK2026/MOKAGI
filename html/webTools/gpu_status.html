<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>侍女 GPU 用量帳單</title>
<style>
    :root {
        --bg:#1e1e2e; --card:#252536; --card2:#2a2a3d; --accent:#4ec9b0; --accent2:#569cd6;
        --gold:#f0c060; --text:#d4d4d4; --text2:#a0a0b0; --text3:#707088; --border:#3e3e52;
        --danger:#f44747; --ok:#6fcf97; --radius:12px; --shadow:0 2px 8px rgba(0,0,0,.3);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        font-family:-apple-system,'Segoe UI','Noto Sans TC',sans-serif;
        background:var(--bg); color:var(--text); padding:16px; min-height:100vh;
    }
    .main { max-width:1100px; margin:0 auto; }
    .header { margin-bottom:18px; }
    .header h1 { font-size:24px; color:#fff; display:flex; align-items:center; gap:8px; }
    .header .icon { font-size:26px; }
    .header .sub { color:var(--text3); font-size:13px; margin-top:6px; line-height:1.6; }
    .topbar { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .btn {
        background:var(--card2); color:var(--text); border:1px solid var(--border);
        border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer; transition:.15s;
    }
    .btn:hover { background:#33334a; color:#fff; border-color:var(--accent); }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:18px; }
    .card {
        background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
        padding:14px 16px; box-shadow:var(--shadow);
    }
    .card .k { color:var(--text3); font-size:12px; margin-bottom:6px; }
    .card .v { color:#fff; font-size:22px; font-weight:600; }
    .card .v.small { font-size:16px; }
    .card .u { color:var(--text2); font-size:12px; margin-left:3px; font-weight:400; }
    .card.hl .v { color:var(--gold); }
    .card.run .v { color:var(--ok); }
    .tabs { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
    .tab {
        background:var(--card); color:var(--text2); border:1px solid var(--border);
        border-radius:8px 8px 0 0; padding:8px 16px; font-size:14px; cursor:pointer;
    }
    .tab.active { background:var(--card2); color:var(--accent); border-bottom-color:var(--card2); }
    .panel { display:none; }
    .panel.active { display:block; }
    .maid {
        background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
        margin-bottom:12px; overflow:hidden;
    }
    .maid-head {
        display:flex; align-items:center; justify-content:space-between; gap:10px;
        padding:12px 16px; background:var(--card2); border-bottom:1px solid var(--border); flex-wrap:wrap;
    }
    .maid-name { font-size:16px; color:#fff; font-weight:600; }
    .maid-stats { color:var(--text2); font-size:13px; display:flex; gap:14px; flex-wrap:wrap; }
    .maid-stats b { color:var(--gold); font-weight:600; }
    .badge { font-size:12px; padding:2px 9px; border-radius:20px; border:1px solid; }
    .badge.running { color:var(--ok); border-color:var(--ok); background:rgba(111,207,151,.1); }
    .badge.stopped { color:var(--text3); border-color:var(--border); background:rgba(112,112,136,.1); }
    .badge.unknown { color:var(--gold); border-color:var(--gold); background:rgba(240,192,96,.1); }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
    th { color:var(--text3); font-weight:500; font-size:12px; }
    td { color:var(--text); }
    .num { text-align:right; font-variant-numeric:tabular-nums; }
    .mono { font-family:ui-monospace,'SF Mono',Consolas,monospace; }
    .muted { color:var(--text3); }
    .cost { color:var(--gold); }
    .wrap-scroll { overflow-x:auto; }
    .empty { color:var(--text3); padding:24px; text-align:center; font-size:14px; }
    .footer { margin-top:18px; color:var(--text3); font-size:12px; text-align:center; line-height:1.8; }
    .note { background:rgba(240,192,96,.08); border:1px solid rgba(240,192,96,.3); color:var(--gold);
            border-radius:8px; padding:8px 12px; font-size:12.5px; margin-bottom:14px; }
</style>
</head>
<body>
<div class="main">
    <div class="header">
        <h1><span class="icon">💻</span> 侍女 GPU 用量帳單</h1>
        <div class="sub">
            vast.ai 租機 · <b>每位侍女一個獨立 SQLite 資料庫</b> · 記錄每次開機 / 預計關機 / 實際關機 / 費用明細
        </div>
        <div class="topbar">
            <button class="btn" id="refreshBtn">🔄 重新整理（同步 vast.ai）</button>
            <button class="btn" id="autoBtn">⏱ 自動更新：開</button>
        </div>
    </div>

    <div id="rateNote" class="note" style="display:none;"></div>
    <div class="cards" id="summaryCards"></div>

    <div class="tabs">
        <button class="tab active" data-tab="overview">👧 各侍女</button>
        <button class="tab" data-tab="detail">🧾 費用明細</button>
    </div>

    <div class="panel active" id="panel-overview"><div class="empty">載入中…</div></div>
    <div class="panel" id="panel-detail"><div class="empty">載入中…</div></div>

    <div class="footer">
        <span id="footerInfo">數據載入中…</span><br>
        資料來源：vast.ai API + 各侍女 jobs/vastai/instance.json ｜ 資料庫：agent/&lt;侍女&gt;/jobs/vastai/gpu_billing.db
    </div>
</div>

<script>
(function () {
    var DATA = null;
    var autoOn = true;
    var timer = null;

    function esc(s) {
        if (s === null || s === undefined) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function ts(v) {
        if (!v) return '<span class="muted">—</span>';
        var d = new Date(v * 1000);
        var p = function (n) { return (n < 10 ? '0' : '') + n; };
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
               p(d.getHours()) + ':' + p(d.getMinutes());
    }
    function hrs(v) {
        if (v === null || v === undefined) return '—';
        return (Math.round(v * 100) / 100).toFixed(2) + ' h';
    }
    function usd(v, d) {
        if (v === null || v === undefined) return '—';
        var n = Number(v);
        return 'US$' + n.toFixed(d === undefined ? 2 : d);
    }
    function badge(st) {
        if (st === 'running') return '<span class="badge running">● 運行中</span>';
        if (st === 'stopped') return '<span class="badge stopped">○ 已關機</span>';
        return '<span class="badge unknown">? 未知</span>';
    }

    function renderSummary(s) {
        var t = s.totals || {};
        var v = s.vast_account || {};
        var html = '';
        html += '<div class="card run"><div class="k">🟢 運行中實例</div><div class="v">' + (t.running || 0) + '<span class="u">台</span></div></div>';
        html += '<div class="card"><div class="k">🧾 累計租用場次</div><div class="v">' + (t.sessions || 0) + '<span class="u">次</span></div></div>';
        html += '<div class="card"><div class="k">⏱ 累計租用時數</div><div class="v">' + (Math.round((t.hours || 0) * 100) / 100).toFixed(2) + '<span class="u">h</span></div></div>';
        html += '<div class="card hl"><div class="k">💰 累計成本（真實）</div><div class="v">' + usd(t.cost_usd || 0) + '</div></div>';
        if (v && (v.balance !== undefined && v.balance !== null)) {
            html += '<div class="card"><div class="k">🪙 vast 帳戶餘額</div><div class="v small">' + usd(v.balance || 0) + ' <span class="u">+ credit ' + usd(v.credit || 0) + '</span></div></div>';
        }
        if (v && v.total_spend !== undefined && v.total_spend !== null) {
            html += '<div class="card"><div class="k">📉 vast 累計消費</div><div class="v small">' + usd(Math.abs(v.total_spend || 0)) + '</div></div>';
        }
        document.getElementById('summaryCards').innerHTML = html;
    }

    function renderOverview(s) {
        var maids = s.maids || [];
        if (!maids.length) {
            document.getElementById('panel-overview').innerHTML =
                '<div class="empty">尚無 GPU 侍女。偵測方式：agent/&lt;侍女&gt;/jobs/vastai/ 目錄。</div>';
            return;
        }
        var html = '';
        maids.forEach(function (m) {
            html += '<div class="maid"><div class="maid-head">';
            html += '<div class="maid-name">👧 ' + esc(m.maid) + ' ' + (m.running ? badge('running') : badge('stopped')) + '</div>';
            html += '<div class="maid-stats">';
            html += '<span>場次 <b>' + (m.total_sessions || 0) + '</b></span>';
            html += '<span>時數 <b>' + (Math.round((m.total_hours || 0) * 100) / 100).toFixed(2) + ' h</b></span>';
            html += '<span>成本 <b>' + usd(m.total_cost_usd || 0) + '</b></span>';
            html += '</div></div>';

            if (!m.sessions || !m.sessions.length) {
                html += '<div class="empty">尚無租機紀錄（此侍女還沒開過 GPU）</div></div>';
                return;
            }
            html += '<div class="wrap-scroll"><table><thead><tr>' +
                    '<th>實例 ID</th><th>GPU</th><th>開機時間</th><th>預計關機</th><th>實際關機</th>' +
                    '<th class="num">單價/hr</th><th class="num">時長</th><th class="num">費用</th><th>狀態</th>' +
                    '</tr></thead><tbody>';
            m.sessions.forEach(function (x) {
                html += '<tr>';
                html += '<td class="mono">' + esc(x.instance_id) + '</td>';
                html += '<td>' + esc(x.gpu || '—') + (x.num_gpus > 1 ? ' ×' + x.num_gpus : '') + '</td>';
                html += '<td class="mono">' + ts(x.boot_ts) + '</td>';
                html += '<td class="mono">' + ts(x.planned_shutdown_ts) + '</td>';
                html += '<td class="mono">' + ts(x.shutdown_ts) + '</td>';
                html += '<td class="num">' + usd(x.price_per_hour, 4) + '</td>';
                html += '<td class="num">' + hrs(x.hours) + '</td>';
                html += '<td class="num cost">' + usd(x.cost_usd, 4) + '</td>';
                html += '<td>' + badge(x.status) + '</td>';
                html += '</tr>';
            });
            html += '</tbody></table></div></div>';
        });
        document.getElementById('panel-overview').innerHTML = html;
    }

    function renderDetail(s) {
        var all = [];
        (s.maids || []).forEach(function (m) {
            (m.sessions || []).forEach(function (x) { x._maid = m.maid; all.push(x); });
        });
        if (!all.length) {
            document.getElementById('panel-detail').innerHTML = '<div class="empty">尚無費用明細。</div>';
            return;
        }
        all.sort(function (a, b) { return (b.boot_ts || 0) - (a.boot_ts || 0); });
        var html = '<div class="maid"><div class="wrap-scroll"><table><thead><tr>' +
            '<th>侍女</th><th>實例 ID</th><th>GPU</th><th>開機時間</th><th>預計關機</th><th>實際關機</th>' +
            '<th class="num">單價/hr</th><th class="num">時長</th><th class="num">費用</th><th>狀態</th><th>備註</th>' +
            '</tr></thead><tbody>';
        all.forEach(function (x) {
            html += '<tr>';
            html += '<td>' + esc(x._maid) + '</td>';
            html += '<td class="mono">' + esc(x.instance_id) + '</td>';
            html += '<td>' + esc(x.gpu || '—') + '</td>';
            html += '<td class="mono">' + ts(x.boot_ts) + '</td>';
            html += '<td class="mono">' + ts(x.planned_shutdown_ts) + '</td>';
            html += '<td class="mono">' + ts(x.shutdown_ts) + '</td>';
            html += '<td class="num">' + usd(x.price_per_hour, 4) + '</td>';
            html += '<td class="num">' + hrs(x.hours) + '</td>';
            html += '<td class="num cost">' + usd(x.cost_usd, 4) + '</td>';
            html += '<td>' + badge(x.status) + '</td>';
            html += '<td class="muted">' + esc(x.note || '') + '</td>';
            html += '</tr>';
        });
        html += '</tbody></table></div></div>';
        document.getElementById('panel-detail').innerHTML = html;
    }

    function renderRate(s) {
        var p = s.price || {};
        var el = document.getElementById('rateNote');
        el.style.display = 'block';
        if (p.markup) {
            el.innerHTML = '💡 用戶費率：' + esc(p.display || '') + '（可於 core/mok_price.py 調整 MOKAGI_GPU_MARKUP）';
        } else {
            el.innerHTML = '💡 用戶費率<b>尚未定案</b>：本頁顯示的是 vast.ai 真實成本（US$）。定價公式可於 ' +
                           '<span class="mono">core/mok_price.py</span> 設定 <span class="mono">MOKAGI_GPU_MARKUP</span> 後自動生效。';
        }
    }

    function apply(data) {
        DATA = data;
        renderRate(data);
        renderSummary(data);
        renderOverview(data);
        renderDetail(data);
        var d = new Date((data.updated_at || 0) * 1000);
        document.getElementById('footerInfo').textContent =
            '最後更新：' + d.toLocaleString('zh-TW') + ' ｜ 自動更新中';
    }

    // 2026-09-24 修補：/api/gpu/status 在核心版本更迭中被移除
    //（保丁補丁 GPU帳單API_202609241330 會在 mok_web 重啟後補回）。
    // 先呼叫 API，失敗才退回 cron 產生的靜態快照 /webTools/gpu_status_snapshot.json。
    function fetchJson(url) {
        return fetch(url, { cache: 'no-store' })
            .then(function (r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.text();
            })
            .then(function (t) {
                try { return JSON.parse(t); }
                catch (e) { throw new Error('回應非 JSON：' + t.slice(0, 60)); }
            });
    }

    function load(syncFirst) {
        var url = '/api/gpu/status' + (syncFirst === false ? '?sync=0' : '');
        return fetchJson(url)
            .catch(function () {
                return fetchJson('/webTools/gpu_status_snapshot.json?t=' + Date.now());
            })
            .then(function (d) {
                if (!d.ok) throw new Error(d.error || 'unknown');
                apply(d);
            })
            .catch(function (e) {
                document.getElementById('footerInfo').textContent = '載入失敗：' + e.message;
            });
    }

    document.getElementById('refreshBtn').addEventListener('click', function () {
        document.getElementById('footerInfo').textContent = '同步中…';
        load(true);
    });
    document.getElementById('autoBtn').addEventListener('click', function () {
        autoOn = !autoOn;
        this.textContent = '⏱ 自動更新：' + (autoOn ? '開' : '關');
        if (autoOn) { startTimer(); } else { clearInterval(timer); timer = null; }
    });

    document.querySelectorAll('.tab').forEach(function (t) {
        t.addEventListener('click', function () {
            document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('active'); });
            document.querySelectorAll('.panel').forEach(function (x) { x.classList.remove('active'); });
            t.classList.add('active');
            document.getElementById('panel-' + t.dataset.tab).classList.add('active');
        });
    });

    function startTimer() {
        if (timer) clearInterval(timer);
        timer = setInterval(function () { load(false); }, 60000);
    }

    load(true);
    startTimer();
})();
</script>
</body>
</html>
