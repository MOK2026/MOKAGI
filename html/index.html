<script>
/* admin-only 管制 by 凜 2026-09-23：進化 / admin / 桌面(VNC) / 備份 / 軟重啟 僅 admin 可見可操作 */
(function(){
  function reveal(on, data){
    window.MOK_IS_ADMIN = !!on;
    window.MOK_LOGGED_IN = !!(data && data.logged_in);
    var els=document.querySelectorAll('[data-admin-only]');
    for(var i=0;i<els.length;i++){ els[i].classList.toggle('mok-hidden', !on); }

    /* === 機密閘 v2 by 凜 2026-09-28：非 admin 會員右側工具只留白名單 === */
    /* 2026-09-30 indexPage：會員恢復「房間」、新增「MOKAGI 用量帳單」入口(billing)；[data-member-only] 僅會員可見 */ /* 2026-09-30 API平台工程師：移除重複統計鍵；用量帳單入口鍵改名為 token */
    (function(){
      var _all=document.querySelectorAll('#toolsPanel .tools-header-buttons button, #toolsPanel2 .tools-header-buttons button');
      var _k;
      for(_k=0;_k<_all.length;_k++){ _all[_k].classList.remove('mok-mh'); }
      var _entry=['openToolsPanel2','notebookBtn','toolsMoreBtn'];
      for(_k=0;_k<_entry.length;_k++){ var _e=document.getElementById(_entry[_k]); if(_e) _e.classList.remove('mok-mh'); }
      var _p2=document.getElementById('toolsPanel2'); if(_p2) _p2.classList.remove('mok-mh');
      var _mem=document.querySelectorAll('#toolsPanel [data-member-only], #toolsPanel2 [data-member-only]');
      for(_k=0;_k<_mem.length;_k++){ _mem[_k].classList.add('mok-mh'); }
      if(window.MOK_LOGGED_IN){ for(_k=0;_k<_mem.length;_k++){ _mem[_k].classList.remove('mok-mh'); } }
      if(!on){
        var _allow={room:1,billing:1,bookmark:1,search:1,'頻道清單':1,mokagiWIKI:1,'會員系統說明':1};
        for(_k=0;_k<_all.length;_k++){
          var _b=_all[_k];
          if(_b.id==='agentInfoBtn'||_b.id==='notebookBtn'){ _b.classList.remove('mok-mh'); continue; }
          var _t=_b.getAttribute('data-tool');
          if(_t && _allow[_t]){ _b.classList.remove('mok-mh'); continue; }
          _b.classList.add('mok-mh');
        }
        for(_k=0;_k<_entry.length;_k++){ if(_entry[_k]==='notebookBtn'||_entry[_k]==='toolsMoreBtn') continue; /* indexPage 2026-10-01：非 admin 會員也保留 ⋯ 更多鈕，否則窄版面被折疊的尾端鍵(會員系統說明/筆記)永遠打不開 */ var _e2=document.getElementById(_entry[_k]); if(_e2) _e2.classList.add('mok-mh'); }
        var _p22=document.getElementById('toolsPanel2'); if(_p22) _p22.classList.add('mok-mh');
      }
    })();
    /* indexPage|公開層(免登入) 顯示頻道鍵、createQiBtn 訪客隱藏|20260927_032000 */ /* 免登入公開層：僅登入成員可見（createQiBtn ➕） */
    var _lo=document.querySelectorAll('[data-login-only]');
    for(var k=0;k<_lo.length;k++){ _lo[k].classList.toggle('mok-hidden', !window.MOK_LOGGED_IN); }
    /* 公開層（免登入）顯示：頻道鍵 📡 頻道 */
    var _chg=document.getElementById('mokChannelGroup')||document.getElementById('channelBtn');
    if(_chg){ _chg.classList.remove('mok-hidden'); }
    // 未登入訪客：整個工作區隱藏＋禁用（#toolsPanel / #toolsPanel2）
    var _tp=document.getElementById('toolsPanel');
    if(_tp) _tp.classList.toggle('mok-hidden', !window.MOK_LOGGED_IN);
    var _tp2=document.getElementById('toolsPanel2');
    if(_tp2 && !window.MOK_LOGGED_IN){ _tp2.classList.add('mok-hidden'); _tp2.style.display='none'; } var _ah=document.querySelector('.agent-header');
    if(_ah){
      var _ahb=_ah.querySelectorAll('button');
      for(var n=0;n<_ahb.length;n++){
        var _b=_ahb[n];
        /* 公開層（免登入）：頻道鍵組保留顯示、可點；[data-login-only] 交由登入狀態決定 */
        if(_b.closest('#mokChannelGroup')||_b.hasAttribute('data-login-only')) continue;
        _b.classList.toggle('mok-hidden', !window.MOK_LOGGED_IN);
        _b.disabled=!window.MOK_LOGGED_IN;
        _b.style.pointerEvents=window.MOK_LOGGED_IN?'':'none';
      }
    }
  }
  window.MOK_LOGGED_IN = false;
  reveal(false, null);
  window.MOK_refreshAdmin = function(){
    return fetch('/api/whoami',{credentials:'same-origin'})
      .then(function(r){return r.json();})

<script>/* 頻道清單載入（/static/channels.json，可隨時編輯）by indexPage 2026-09-26 */ (function(){
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

<script>(function(){

      var u = localStorage.getItem('mokagi_user_id') || localStorage.getItem('web_user_id') || '';
      if(!u) return true;
      return u.indexOf('web_guest_')===0 || u.indexOf('guest:')===0;

  }

    try{
      if(!isGuest()) return;
      fetch('/api/anon/state', {credentials:'same-origin'})
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){
          if(!d || !d.sid) return;
          var el = document.getElementById('anonArtifactEntry');
          if(!d.files){ if(el) el.style.display = 'none'; return; }
          if(!el){
            el = document.createElement('a');
            el.id = 'anonArtifactEntry';
            el.target = '_blank';
            el.rel = 'noopener';

            document.body.appendChild(el);
          }
          el.href = d.page || ('/anon/' + d.sid);
          el.textContent = '\u{1F4C1} 我的產物 ' + d.files;
          el.style.display = '';
        })
        .catch(function(){});
    }catch(e){}
  }
  function boot(){ tick(); setInterval(tick, 20000); }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',boot);}else{boot();}
})();</script>
