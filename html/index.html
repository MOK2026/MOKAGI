<script>
/* admin-only 管制 by 凜 2026-09-23：進化 / admin / 桌面(VNC) / 備份 / 緊急重啟 僅 admin 可見可操作 */
(function(){
  function reveal(on, data){
    window.MOK_IS_ADMIN = !!on;
    window.MOK_LOGGED_IN = !!(data && data.logged_in);
    var els=document.querySelectorAll('[data-admin-only]');
    for(var i=0;i<els.length;i++){ els[i].classList.toggle('mok-hidden', !on); }
    // 未登入訪客：整個工作區隱藏＋禁用（#toolsPanel / #toolsPanel2）
    var _tp=document.getElementById('toolsPanel');
    if(_tp) _tp.classList.toggle('mok-hidden', !window.MOK_LOGGED_IN);
    var _tp2=document.getElementById('toolsPanel2');
    if(_tp2 && !window.MOK_LOGGED_IN){ _tp2.classList.add('mok-hidden'); _tp2.style.display='none'; } var _ah=document.querySelector('.agent-header'); if(_ah){ var _ahb=_ah.querySelectorAll('button'); for(var k=0;k<_ahb.length;k++){ var _b=_ahb[k]; _b.classList.toggle('mok-hidden', !window.MOK_LOGGED_IN); _b.disabled=!window.MOK_LOGGED_IN; _b.style.pointerEvents=window.MOK_LOGGED_IN?'':'none'; } }
  }
  window.MOK_LOGGED_IN = false;
  reveal(false, null);
  window.MOK_refreshAdmin = function(){
    return fetch('/api/whoami',{credentials:'same-origin'})
      .then(function(r){return r.json();})
      .then(function(d){ reveal(d && d.is_admin, d); return !!(d&&d.is_admin); })
      .catch(function(){ reveal(false, null); return false; });
  };
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', window.MOK_refreshAdmin); }
  else { window.MOK_refreshAdmin(); }
})();
</script>
<script>/* 頻道下拉水晶盤 by indexPage 2026-09-26 */ (function(){function b(){var g=document.getElementById("mokChannelGroup");if(!g||g.dataset.mokChBound)return;var t=document.getElementById("channelBtn"),d=document.getElementById("channelDropdown");if(!t||!d)return;g.dataset.mokChBound="1";function s(o){d.classList.toggle("open",o);t.classList.toggle("open",o);t.setAttribute("aria-expanded",o?"true":"false");}t.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();s(!d.classList.contains("open"));});d.addEventListener("click",function(e){e.stopPropagation();});document.addEventListener("click",function(e){if(!g.contains(e.target))s(false);});document.addEventListener("keydown",function(e){if(e.key==="Escape")s(false);});}if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",b);}else{b();}})();</script>
<script>/* 頻道清單載入（/static/channels.json，可隨時編輯）by indexPage 2026-09-26 */ (function(){
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function render(list){
    var d=document.getElementById('channelDropdown'); if(!d||!list||!list.length) return;
    var h='';
    for(var i=0;i<list.length;i++){var it=list[i]||{}; if(!it.href) continue;
      var tone=it.tone||'#4ec9b0', icon=it.icon||'', label=it.label||it.href, href=String(it.href);
      h+='<button class="header-dropdown-item" data-ch="'+esc(it.id||label)+'" style="--tone:'+esc(tone)+';" '
        +'onclick="location.href=\''+esc(href).replace(/'/g,"\\'")+'\'">'+esc((icon?icon+' ':'')+label)+'</button>';
    }
    if(h) d.innerHTML=h;
  }
  function boot(){
    if(!document.getElementById('channelDropdown')) return;
    try{
      fetch('/static/channels.json?t='+Date.now(),{cache:'no-store'})
        .then(function(r){return r.ok?r.json():null;})
        .then(function(j){ if(j&&j.channels) render(j.channels); })
        .catch(function(){});
    }catch(e){}
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',boot);}else{boot();}
})();</script>
