<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>會議模式 — mokagi</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
:root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --accent: #58a6ff; --accent2: #3fb950; --text: #e6edf3;
    --dim: #8b949e; --danger: #f85149; --warn: #d2991d;
    --card-spring: #ffb7c5; --card-yue: #b7e4ff; --card-default: #d2a8ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: var(--bg); color: var(--text);
    font-family: 'Cascadia Code', 'Segoe UI', 'Helvetica Neue', sans-serif;
    height: 100vh; height: 100dvh; overflow: hidden;
}

/* ===== 主容器 ===== */
.meeting-container { display: flex; height: 100vh; height: 100dvh; }

/* ===== 左側任務面板 ===== */
.task-panel {
    flex: 0 0 340px; background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
    z-index: 10;
}
.task-panel-header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: #1c2128;
}
.task-panel-header h2 { font-size: 15px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
.task-panel-header .btn-group { display: flex; gap: 6px; }
.task-panel-header button {
    background: var(--border); border: none; color: var(--text);
    padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 14px;
    transition: all 0.2s;
}
.task-panel-header button:hover { background: var(--accent); color: #000; }
.task-panel-header .collapse-btn { background: transparent; font-size: 16px; padding: 4px 6px; cursor: pointer; transition: transform 0.3s; }
.task-panel-header .collapse-btn:hover { background: var(--border); color: var(--text); }
.task-panel.collapsed .task-input-area,
.task-panel.collapsed .task-list,
.task-panel.collapsed .agent-select-area { display: none; }
.task-panel.collapsed { flex: 0 0 44px; min-width: 44px; }
.task-panel.collapsed .task-panel-header { padding: 10px 8px; flex-direction: column; gap: 6px; }
.task-panel.collapsed .task-panel-header h2 { font-size: 18px; }
.task-panel.collapsed .task-panel-header h2 span { display: none; }
.task-panel.collapsed .task-panel-header .btn-group { display: none; }

/* Agent 選擇區 */
.agent-select-area {
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    background: #1a1f27;
}
.agent-select-area label { font-size: 11px; color: var(--dim); display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; user-select: none; }
.agent-select-area label .collapse-arrow { font-size: 12px; transition: transform 0.3s; }
.agent-select-area.collapsed label .collapse-arrow { transform: rotate(-90deg); }
.agent-select-content { overflow: hidden auto; transition: max-height 0.35s ease, opacity 0.3s; max-height: 30vh; opacity: 1; }
.agent-select-area.collapsed .agent-select-content { max-height: 0; opacity: 0; margin-bottom: 0; }
.agent-select-area.collapsed { padding-bottom: 6px; }
.agent-checkboxes {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px;
}
.agent-chip {
    display: flex; align-items: center; gap: 4px;
    padding: 5px 10px; border-radius: 20px; cursor: pointer;
    font-size: 12px; border: 1px solid var(--border);
    background: var(--bg); transition: all 0.2s;
    user-select: none;
}
.agent-chip:hover { border-color: var(--accent); }
.agent-chip.checked { background: var(--accent); color: #000; border-color: var(--accent); font-weight: bold; }
.agent-chip.spring { --chip-color: var(--card-spring); }
.agent-chip.spring.checked { background: #e8537a; border-color: #e8537a; color: #fff; }
.agent-chip.yue { --chip-color: var(--card-yue); }
.agent-chip.yue.checked { background: #4a9fd8; border-color: #4a9fd8; color: #fff; }
.agent-chip .agent-dot { width: 8px; height: 8px; border-radius: 50%; }
.agent-chip.spring .agent-dot { background: var(--card-spring); }
.agent-chip.yue .agent-dot { background: var(--card-yue); }

/* 總LLM選擇 */
.analyzer-select {
    display: flex; align-items: center; gap: 8px;
}
.analyzer-select label { font-size: 11px; color: var(--dim); white-space: nowrap; margin: 0; }
.analyzer-select select {
    flex: 1; padding: 5px 8px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font-size: 12px;
}

/* 輸入區 */
.task-input-area { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.task-input-area textarea {
    width: 100%; height: 120px; min-height: 80px; max-height: 60vh; padding: 10px; background: var(--bg);
    color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    resize: vertical; font-size: 13px; font-family: inherit;
    transition: border-color 0.2s;
}
.task-input-area textarea:focus { outline: none; border-color: var(--accent); }
.btn-row { display: flex; gap: 8px; margin-top: 8px; }
.btn-primary, .btn-secondary {
    flex: 1; padding: 9px 12px; border: none; border-radius: 8px;
    cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s;
}
.btn-primary { background: var(--accent); color: #000; }
.btn-primary:hover { filter: brightness(1.2); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: var(--border); color: var(--text); }
.btn-secondary:hover { background: #484f58; }
.btn-run-all {
    width: 100%; margin-top: 6px; padding: 10px; background: var(--accent2);
    color: #000; border: none; border-radius: 8px; cursor: pointer;
    font-size: 14px; font-weight: 700; transition: all 0.2s;
}
.btn-run-all:hover { filter: brightness(1.2); }
.btn-run-all:disabled { opacity: 0.5; cursor: not-allowed; }
/* 按鈕說明 */
.action-hints {
    margin-top: 8px; padding: 8px 10px;
    background: #1a1f27; border: 1px solid var(--border); border-radius: 8px;
    font-size: 11px; color: var(--dim); line-height: 1.7;
}
.action-hints div { display: flex; align-items: flex-start; gap: 4px; }
.action-hints b { color: var(--text); }

/* 任務列表 */
.task-list {
    flex: 1 1 auto; overflow-y: auto; padding: 8px;
    display: flex; flex-direction: column; gap: 6px;
    min-height: 140px;
}
.task-item {
    padding: 10px 12px; background: var(--bg); border-radius: 8px;
    border: 1px solid var(--border); font-size: 12px;
    transition: all 0.3s;
}
.task-item.running { border-color: var(--warn); animation: pulse 1.5s infinite; }
.task-item.done { border-color: var(--accent2); opacity: 0.7; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(210,153,29,0.3); } 50% { box-shadow: 0 0 12px 2px rgba(210,153,29,0.5); } }
.task-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.task-agent-tag {
    font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: bold;
}
.task-agent-tag.spring { background: #e8537a33; color: var(--card-spring); }
.task-agent-tag.yue { background: #4a9fd833; color: var(--card-yue); }
.task-agent-tag.default { background: #d2a8ff33; color: var(--card-default); }
.task-status { font-size: 10px; color: var(--dim); }
.task-desc { color: var(--text); line-height: 1.4; }
.placeholder-text {
    text-align: center; color: var(--dim); padding: 40px 20px;
}
.placeholder-text .icon { font-size: 48px; display: block; margin-bottom: 12px; }

/* ===== 中央會議室 ===== */
.meeting-room {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg);
}
.meeting-header {
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: #1c2128;
}
.meeting-header .title { font-size: 16px; font-weight: bold; color: var(--accent); }
.meeting-header .collapse-btn { background: transparent; border: none; color: var(--dim); font-size: 16px; padding: 4px 8px; cursor: pointer; transition: transform 0.3s; border-radius: 4px; }
.meeting-header .collapse-btn:hover { color: var(--text); background: var(--border); }
.meeting-room.collapsed .agent-cards-grid { display: none; }
.meeting-room.collapsed .meeting-header { border-bottom: none; }
.meeting-room.collapsed { flex: 0 0 auto; }
.meeting-status { font-size: 12px; color: var(--dim); }
.agent-cards-grid {
    flex: 1; overflow-y: auto; padding: 12px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 10px; align-content: start;
}
.agent-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; display: flex; flex-direction: column;
    min-height: 200px; max-height: 450px; overflow: hidden;
    transition: all 0.3s;
}
.agent-card.running { border-color: var(--warn); }
.agent-card.done { border-color: var(--accent2); }
.agent-card-header {
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: #1c2128; font-size: 12px; font-weight: bold;
}
.agent-card-header .agent-name { display: flex; align-items: center; gap: 6px; }
.agent-card-header .agent-dot-card { width: 10px; height: 10px; border-radius: 50%; }
.agent-card.spring .agent-dot-card { background: var(--card-spring); }
.agent-card.yue .agent-dot-card { background: var(--card-yue); }
.agent-card .agent-status { font-size: 10px; padding: 2px 8px; border-radius: 10px; }
.agent-card .agent-status.idle { background: #30363d; color: var(--dim); }
.agent-card .agent-status.running { background: #d2991d33; color: var(--warn); }
.agent-card .agent-status.done { background: #3fb95033; color: var(--accent2); }
.agent-card-header .card-collapse-btn { cursor: pointer; font-size: 12px; transition: transform 0.3s; margin-left: 6px; user-select: none; opacity: 0.5; padding: 2px 4px; border-radius: 4px; }
.agent-card-header .card-collapse-btn:hover { opacity: 1; background: #30363d; }
.agent-card.collapsed .agent-card-output { display: none; }
.agent-card.collapsed { min-height: unset; max-height: unset; }
.agent-card.collapsed .card-collapse-btn { transform: rotate(-90deg); }
.agent-card-output {
    flex: 1; padding: 10px 12px; overflow-y: auto;
    font-size: 12px; line-height: 1.5; white-space: pre-wrap;
    word-break: break-word; color: var(--text);
}
.agent-card-output .streaming-cursor::after {
    content: '▊'; animation: blink 0.8s infinite; color: var(--accent);
}
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

/* ===== 右下角模式選擇器 ===== */
.mode-selector-btn {
    position: fixed; bottom: 20px; right: 20px; z-index: 1000;
    width: 50px; height: 50px; border-radius: 50%;
    background: var(--accent); color: #000; border: none;
    font-size: 22px; cursor: pointer; box-shadow: 0 4px 20px rgba(88,166,255,0.4);
    transition: all 0.3s; display: flex; align-items: center; justify-content: center;
}
.mode-selector-btn:hover { transform: scale(1.1); box-shadow: 0 6px 28px rgba(88,166,255,0.6); }
.mode-selector-btn.active { background: var(--accent2); }

.mode-panel {
    position: fixed; bottom: 80px; right: 20px; z-index: 999;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 6px; min-width: 200px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    display: none; flex-direction: column; gap: 2px;
}
.mode-panel.show { display: flex; }
.mode-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 10px; cursor: pointer;
    transition: all 0.2s; font-size: 13px; border: none;
    background: transparent; color: var(--text); text-align: left;
    width: 100%;
}
.mode-item:hover { background: #21262d; }
.mode-item.active { background: var(--accent); color: #000; font-weight: bold; }
.mode-item .mode-icon { font-size: 18px; }
.mode-item .mode-badge {
    font-size: 10px; padding: 2px 6px; border-radius: 8px;
    background: #30363d; color: var(--dim); margin-left: auto;
}
.mode-item.active .mode-badge { background: #00000033; color: inherit; }

/* Toast */
.toast {
    position: fixed; bottom: 50%; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #000; padding: 10px 24px;
    border-radius: 20px; font-size: 14px; font-weight: bold;
    z-index: 2000; opacity: 0; transition: opacity 0.3s;
    pointer-events: none;
}
.toast.show { opacity: 1; }

/* 響應式 */
@media (max-width: 768px) {
    .meeting-container { flex-direction: column; }
    .task-panel { flex: 1 1 100%; height: 72vh; max-height: 72vh; display: flex; flex-direction: column; overflow: hidden; }
    .task-panel .task-list { flex: 1 1 auto; min-height: 18vh; overflow-y: auto; }
    .task-input-area { padding: 6px 10px; flex-shrink: 0; overflow: visible; max-height: none; }
    .task-input-area textarea { height: 55px; max-height: 25vh; }
    .action-hints { margin-top: 6px; padding: 6px 8px; font-size: 10px; line-height: 1.6; }
    .agent-select-content { max-height: 20vh; }
    .agent-select-area { padding: 6px 10px; }
    .agent-cards-grid { grid-template-columns: 1fr; }
    .mode-panel { right: 10px; bottom: 75px; }
    .mode-selector-btn { right: 10px; bottom: 15px; }
}
    </style>
</head>
<body>

<div class="meeting-container">
    <!-- ===== 左側任務面板 ===== -->
    <div class="task-panel" id="taskPanel">
        <div class="task-panel-header">
            <h2><button class="collapse-btn" onclick="toggleTaskPanel()" title="摺疊/展開">◀</button> <span>🏛️ 會議控制台</span></h2>
            <div class="btn-group">
                <button onclick="location.href='/'" title="回主控台">🏠</button>
                <button id="btnClearTasks" title="清除全部">🗑</button>
            </div>
        </div>

        <!-- Agent 選擇區 -->
        <div class="agent-select-area" id="agentSelectArea">
            <label onclick="toggleAgentSelect()">📋 參與會議的 Agent <span class="collapse-arrow">▼</span></label>
            <div class="agent-select-content">
                <div class="agent-checkboxes" id="agentCheckboxes">
                    <!-- 動態生成 -->
                </div>
                <div class="analyzer-select">
                    <label>🧠 總指揮：</label>
                    <select id="analyzerSelect">
                        <!-- 動態生成 -->
                    </select>
                </div>
            </div>
        </div>

        <!-- 任務輸入 -->
        <div class="task-input-area">
            <textarea id="meetingInput" placeholder="輸入會議總任務…
例如：建立一個電商網站，包含首頁、商品頁、購物車、結帳流程"></textarea>
            <div class="btn-row">
                <button class="btn-primary" id="btnAnalyze" title="由總AI分析任務，自動拆解並分派給各Agent">🧠 分析分工</button>
                <button class="btn-secondary" id="btnQuickDraft" title="不經分析，直接將任務派發給已選Agent">⚡ 快速啟動</button>
            </div>
            <button class="btn-run-all" id="btnRunAll" disabled title="所有已選Agent同時並行處理任務">🚀 全部並行執行</button>
            <div class="action-hints">
                <div>🧠 <b>分析分工</b>：總AI分析任務，自動拆解分派給各 Agent</div>
                <div>⚡ <b>快速啟動</b>：不經分析，直接派發給已選 Agent</div>
                <div>🚀 <b>全部並行執行</b>：所有已選 Agent 同時並行處理</div>
            </div>
        </div>

        <!-- 分工任務列表 -->
        <div class="task-list" id="taskList">
            <div class="placeholder-text">
                <span class="icon">🏛️</span>
                選擇 Agent → 輸入總體任務<br>讓總 AI 分析並分工<br>各 Agent 並行處理 ✨
            </div>
        </div>
    </div>

    <!-- ===== 中央會議室 ===== -->
    <div class="meeting-room" id="meetingRoom">
        <div class="meeting-header">
            <span class="title">📊 會議室 — 即時輸出</span>
            <button class="collapse-btn" onclick="toggleMeetingRoom()" title="摺疊/展開">▼</button>
            <span class="meeting-status" id="meetingStatus">🟢 待命中</span>
        </div>
        <div class="agent-cards-grid" id="agentCardsGrid">
            <div class="placeholder-text" id="roomPlaceholder">
                <span class="icon">🏢</span>
                選擇左側 Agent 並分析分工<br>各 Agent 的輸出將在此即時顯示
            </div>
        </div>
    </div>
</div>

<!-- ===== 右下角模式選擇器 ===== -->
<button class="mode-selector-btn" id="modeBtn" title="切換模式">⚙</button>
<div class="mode-panel" id="modePanel">
    <button class="mode-item" data-mode="stretch">
        <span class="mode-icon">🧘</span> 伸展思考
        <span class="mode-badge">未上市</span>
    </button>
    <button class="mode-item" data-mode="fast">
        <span class="mode-icon">⚡</span> 快速模式
        <span class="mode-badge">未上市</span>
    </button>
    <button class="mode-item" data-mode="document">
        <span class="mode-icon">📄</span> 文件模式
        <span class="mode-badge">未上市</span>
    </button>
    <button class="mode-item active" data-mode="meeting">
        <span class="mode-icon">🏛️</span> 會議模式
        <span class="mode-badge">當前</span>
    </button>
    <button class="mode-item" data-mode="custom">
        <span class="mode-icon">🔮</span> ...模式
        <span class="mode-badge">敬請期待</span>
    </button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ==================== 全域狀態 ====================
const socket = io();
let agentList = [];
let agentMeta = {};
let selectedAgents = new Set();
let tasks = [];
let taskIdCounter = 0;
let agentCardMap = {};  // agentName → cardId
let agentOutputs = {};  // cardId → accumulated text
let currentMode = 'meeting';

// ==================== DOM ====================
const $agentCheckboxes = document.getElementById('agentCheckboxes');
const $analyzerSelect = document.getElementById('analyzerSelect');
const $meetingInput = document.getElementById('meetingInput');
const $btnAnalyze = document.getElementById('btnAnalyze');
const $btnQuickDraft = document.getElementById('btnQuickDraft');
const $btnRunAll = document.getElementById('btnRunAll');
const $btnClearTasks = document.getElementById('btnClearTasks');
const $taskList = document.getElementById('taskList');
const $agentCardsGrid = document.getElementById('agentCardsGrid');
const $roomPlaceholder = document.getElementById('roomPlaceholder');
const $meetingStatus = document.getElementById('meetingStatus');
const $modeBtn = document.getElementById('modeBtn');
const $modePanel = document.getElementById('modePanel');
const $toast = document.getElementById('toast');
const $agentSelectArea = document.getElementById('agentSelectArea');

// ==================== Agent 選擇區摺疊 ====================
function toggleAgentSelect() {
    $agentSelectArea.classList.toggle('collapsed');
}
// 手機版預設摺疊 Agent 選擇區（節省空間，避免擠壓任務列表）
if (window.innerWidth <= 768) $agentSelectArea.classList.add('collapsed');

// ==================== 面板摺疊 ====================
function toggleTaskPanel() {
    const panel = document.getElementById("taskPanel");
    const room = document.getElementById("meetingRoom");
    const btn = panel.querySelector(".task-panel-header .collapse-btn");
    panel.classList.toggle("collapsed");
    if (panel.classList.contains("collapsed")) {
        btn.textContent = "▶";
        // 收合左側 → 中央會議室填滿
        room.style.flex = "1 1 0%";
    } else {
        btn.textContent = "◀";
        room.style.flex = "";
        // 若會議室已收合 → 左側面板填滿
        if (room.classList.contains("collapsed")) {
            panel.style.flex = "1 1 0%";
        }
    }
}

function toggleMeetingRoom() {
    const room = document.getElementById("meetingRoom");
    const panel = document.getElementById("taskPanel");
    const btn = room.querySelector(".meeting-header .collapse-btn");
    room.classList.toggle("collapsed");
    if (room.classList.contains("collapsed")) {
        btn.textContent = "▲";
        // 收合中央 → 左側面板填滿
        panel.style.flex = "1 1 0%";
    } else {
        btn.textContent = "▼";
        panel.style.flex = "";
        // 若左側面板已收合 → 中央會議室填滿
        if (panel.classList.contains("collapsed")) {
            room.style.flex = "1 1 0%";
        }
    }
}

// ==================== 卡片輸出摺疊 ====================
function toggleCardOutput(cardId) {
    const card = document.getElementById(cardId);
    if (card) card.classList.toggle('collapsed');
}
// ==================== Toast ====================
let toastTimer;
function showToast(msg, duration = 2000) {
    clearTimeout(toastTimer);
    $toast.textContent = msg;
    $toast.classList.add('show');
    toastTimer = setTimeout(() => $toast.classList.remove('show'), duration);
}

// ==================== 模式選擇器 ====================
$modeBtn.addEventListener('click', () => {
    $modePanel.classList.toggle('show');
    $modeBtn.classList.toggle('active');
});

document.querySelectorAll('.mode-item').forEach(item => {
    item.addEventListener('click', function() {
        const mode = this.dataset.mode;
        document.querySelectorAll('.mode-item').forEach(i => i.classList.remove('active'));
        this.classList.add('active');
        currentMode = mode;

        // 更新按鈕圖標
        const icons = { stretch: '🧘', fast: '⚡', document: '📄', meeting: '🏛️', custom: '🔮' };
        $modeBtn.textContent = icons[mode] || '⚙';

        if (mode === 'meeting') {
            showToast('🏛️ 已切換到會議模式');
        } else {
            showToast(`🔒 「${this.querySelector('.mode-icon').textContent} ${this.textContent.trim().split('\\n')[0]}」尚未開放`);
            // 恢復會議模式
            setTimeout(() => {
                document.querySelectorAll('.mode-item').forEach(i => i.classList.remove('active'));
                document.querySelector('.mode-item[data-mode="meeting"]').classList.add('active');
                $modeBtn.textContent = '🏛️';
                currentMode = 'meeting';
            }, 1500);
        }

        $modePanel.classList.remove('show');
        $modeBtn.classList.remove('active');
    });
});

// 點其他處關閉模式面板
document.addEventListener('click', (e) => {
    if (!$modePanel.contains(e.target) && e.target !== $modeBtn) {
        $modePanel.classList.remove('show');
        $modeBtn.classList.remove('active');
    }
});

// ==================== Socket 事件 ====================
socket.on('connect', () => {
    console.log('🔌 已連接');
    loadAgentList();
});

async function loadAgentList() {
    try {
        const res = await fetch('/api/env_files', { credentials: 'same-origin' });
        const data = await res.json();
        agentList = (data.agents || []).map(a => a.name || a);
        agentMeta = {};
        (data.agents || []).forEach(a => { agentMeta[a.name || a] = a; });
        renderAgentSelection();
    } catch(e) {
        console.error('載入 Agent 列表失敗', e);
        showToast('❌ 無法載入 Agent 列表');
    }
}

// 監聽心跳/狀態更新
socket.on('agent_state', (data) => {
    // data: { agent: '汐', state: 'idle'|'running'|... }
    if (data && data.agent && agentCardMap[data.agent]) {
        const cardId = agentCardMap[data.agent];
        const card = document.getElementById(cardId);
        if (card) {
            const statusEl = card.querySelector('.agent-status');
            if (statusEl) {
                if (data.state === 'running') statusEl.textContent = '🟡 運轉中';
                else if (data.state === 'idle') statusEl.textContent = '🟢 待命';
            }
        }
    }
});

// ==================== Agent 選擇 ====================
function renderAgentSelection() {
    // Agent 複選框
    $agentCheckboxes.innerHTML = agentList.map(a => {
        const cls = getAgentColorClass(a);
        const meta = agentMeta[a] || {};
        const postSuffix = meta.post ? ` <span style="font-size:10px;color:var(--dim)">${meta.post}</span>` : '';
        return `<label class="agent-chip ${cls}" data-agent="${a}">
            <span class="agent-dot"></span> ${a}${postSuffix}
        </label>`;
    }).join('');

    // 點擊切換
    $agentCheckboxes.querySelectorAll('.agent-chip').forEach(chip => {
        chip.addEventListener('click', () => {
            const agent = chip.dataset.agent;
            if (selectedAgents.has(agent)) {
                selectedAgents.delete(agent);
                chip.classList.remove('checked');
            } else {
                selectedAgents.add(agent);
                chip.classList.add('checked');
            }
            updateAnalyzerSelect();
            updateAgentCards();
        });
    });

    // 總指揮下拉
    updateAnalyzerSelect();
}

function getAgentColorClass(agent) {
    const lower = agent.toLowerCase();
    if (lower.includes('汐') || lower.includes('xi')) return 'spring';
    if (lower.includes('玥') || lower.includes('yue')) return 'yue';
    return '';
}

function updateAnalyzerSelect() {
    const agents = Array.from(selectedAgents);
    $analyzerSelect.innerHTML = agents.map(a => `<option value="${a}">${a}</option>`).join('');
    if (agents.length === 0) {
        $analyzerSelect.innerHTML = '<option value="">-- 請先選擇 Agent --</option>';
    }
}

function updateAgentCards() {
    const agents = Array.from(selectedAgents);

    if (agents.length === 0) {
        $agentCardsGrid.innerHTML = `
            <div class="placeholder-text" id="roomPlaceholder">
                <span class="icon">🏢</span>
                選擇左側 Agent 並分析分工<br>各 Agent 的輸出將在此即時顯示
            </div>`;
        return;
    }

    // 保留現有卡片（不重建，避免丟失輸出內容）
    const existingCards = {};
    $agentCardsGrid.querySelectorAll('.agent-card').forEach(card => {
        existingCards[card.dataset.agent] = card;
    });

    $agentCardsGrid.innerHTML = '';
    agents.forEach(agent => {
        const cardId = 'card-' + agent.replace(/[^a-zA-Z0-9\u4e00-\u9fff]/g, '_');
        agentCardMap[agent] = cardId;

        if (existingCards[agent]) {
            $agentCardsGrid.appendChild(existingCards[agent]);
        } else {
            const cls = getAgentColorClass(agent);
            const card = document.createElement('div');
            card.className = `agent-card ${cls}`;
            card.id = cardId;
            card.dataset.agent = agent;
            card.innerHTML = `
                <div class="agent-card-header">
                    <span class="agent-name">
                        <span class="agent-dot-card"></span> ${agent}
                    </span>
                    <span style="display:flex;align-items:center;gap:4px;">
                        <span class="agent-status idle">🟢 待命</span>
                        <span class="card-collapse-btn" onclick="event.stopPropagation();toggleCardOutput('${cardId}')" title="摺疊/展開">▼</span>
                    </span>
                </div>
                <div class="agent-card-output" id="${cardId}-output"></div>
            `;
            $agentCardsGrid.appendChild(card);
            agentOutputs[cardId] = '';
        }
    });

    if (agents.length > 0) {
        $meetingStatus.textContent = `🟢 ${agents.length} 位 Agent 待命中`;
    }
}

// ==================== 分析分工 ====================
$btnAnalyze.addEventListener('click', analyzeAndDispatch);
$btnQuickDraft.addEventListener('click', quickDispatch);

async function analyzeAndDispatch() {
    const input = $meetingInput.value.trim();
    if (!input) { showToast('⚠️ 請輸入會議總任務'); return; }
    if (selectedAgents.size === 0) { showToast('⚠️ 請至少選擇一位 Agent'); return; }

    const analyzer = $analyzerSelect.value;
    if (!analyzer) { showToast('⚠️ 請選擇總指揮 Agent'); return; }

    $btnAnalyze.disabled = true;
    $btnAnalyze.textContent = '⏳ 分析中…';
    $meetingStatus.textContent = '🧠 總 AI 分析分工中…';

    const agents = Array.from(selectedAgents);
    const agentsInfo = agents.map(a => { const meta = agentMeta[a] || {}; let info = a; if (meta.post || meta.desc) { info += `（`; if (meta.post) info += meta.post; if (meta.post && meta.desc) info += ` / `; if (meta.desc) info += meta.desc; info += `）`; } return info; }).join(`、`);
    const prompt = `【會議模式 - 總指揮分析分工】

你現在是總指揮 AI，負責分析以下總體任務，並將工作分配給團隊成員。

總體任務：
${input}

團隊成員（可分配）：${agentsInfo}

請分析這個任務，並輸出 JSON 格式的分工列表：
{
    "tasks": [
        {"agent": "${agents[0]}", "task": "具體任務描述", "priority": 1},
        {"agent": "${agents[1] || agents[0]}", "task": "具體任務描述", "priority": 2}
    ]
}

規則：
1. 每個 agent 至少分配一個任務
2. ⚠️ 嚴格根據每位成員的職能（括號內的職位描述）分配任務，任務必須與該成員的專業角色匹配
3. 任務要具體、可執行
4. priority 越小越優先
5. 只輸出 JSON，不要其他文字

請開始分析：`;

    let accumulated = '';
    let resolved = false;

    const handler = (data) => {
        if (resolved) return;
        if (data.type === 'reply') {
            accumulated += data.content;
        } else if (data.type === 'done') {
            resolved = true;
            socket.off('chat_stream', handler);
            parseAndCreateTasks(accumulated);
            $btnAnalyze.disabled = false;
            $btnAnalyze.textContent = '🧠 分析分工';
        }
    };
    socket.on('chat_stream', handler);

    socket.emit('chat_message', {
        agent: analyzer,
        message: prompt,
        user_id: 'web_meeting',
        context_files: ['agent.md', 'user.md']  // 🔧 會議模式：agent.md + user.md（不含 soul.md）
    });

    setTimeout(() => {
        if (!resolved) {
            resolved = true;
            socket.off('chat_stream', handler);
            parseAndCreateTasks(accumulated);
            $btnAnalyze.disabled = false;
            $btnAnalyze.textContent = '🧠 分析分工';
        }
    }, 120000);
}

function quickDispatch() {
    const input = $meetingInput.value.trim();
    if (!input) { showToast('⚠️ 請輸入會議總任務'); return; }
    if (selectedAgents.size === 0) { showToast('⚠️ 請至少選擇一位 Agent'); return; }

    const agents = Array.from(selectedAgents);
    // 快速模式：直接分配，每人做同樣的任務
    tasks = agents.map((agent, i) => ({
        id: ++taskIdCounter,
        agent: agent,
        task: input,
        priority: i + 1,
        status: 'waiting',
        cardId: agentCardMap[agent]
    }));

    renderTaskList();
    $meetingStatus.textContent = `⚡ 快速分工：${tasks.length} 個任務`;
    $btnRunAll.disabled = false;
    showToast(`⚡ 已將任務直接派發給 ${agents.length} 位 Agent（並行執行）`);

    // 🔧 快速啟動：不經分析，直接將 meetingInput 內容派發給已選 Agent 並立即並行執行
    setTimeout(() => runAllTasks(), 100);
}

function parseAndCreateTasks(text) {
    console.log('分析回應:', text.substring(0, 300));

    // 嘗試提取 JSON
    let jsonStr = text;
    const jsonMatch = text.match(/\{[\s\S]*"tasks"[\s\S]*\}/);
    if (jsonMatch) jsonStr = jsonMatch[0];

    // 移除可能的 markdown 代碼塊
    jsonStr = jsonStr.replace(/```json\s*/g, '').replace(/```\s*/g, '').trim();

    try {
        const parsed = JSON.parse(jsonStr);
        if (parsed.tasks && Array.isArray(parsed.tasks)) {
            tasks = parsed.tasks.map((t, i) => ({
                id: ++taskIdCounter,
                agent: t.agent,
                task: t.task,
                priority: t.priority || i + 1,
                status: 'waiting',
                cardId: agentCardMap[t.agent] || null
            }));
        } else {
            throw new Error('無 tasks 陣列');
        }
    } catch (e) {
        console.warn('JSON 解析失敗，使用備用方案', e);
        // 備用：嘗試手動解析
        const agents = Array.from(selectedAgents);
        const agentTaskMap = {};
        agents.forEach(a => { agentTaskMap[a] = []; });

        // 嘗試按行解析
        const lines = text.split('\n');
        let currentAgent = null;
        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) return;
            // 檢測 agent 名稱
            for (const a of agents) {
                if (trimmed.includes(a)) {
                    currentAgent = a;
                    const taskText = trimmed.replace(new RegExp(`.*?${a}[：:]*\\s*`), '').trim();
                    if (taskText) agentTaskMap[a].push(taskText);
                    break;
                }
            }
        });

        tasks = [];
        agents.forEach(a => {
            const agentTasks = agentTaskMap[a];
            if (agentTasks.length > 0) {
                agentTasks.forEach(t => {
                    tasks.push({
                        id: ++taskIdCounter,
                        agent: a,
                        task: t,
                        priority: tasks.length + 1,
                        status: 'waiting',
                        cardId: agentCardMap[a] || null
                    });
                });
            } else {
                // 至少給一個預設任務
                tasks.push({
                    id: ++taskIdCounter,
                    agent: a,
                    task: `處理：${$meetingInput.value.trim().substring(0, 60)}...`,
                    priority: tasks.length + 1,
                    status: 'waiting',
                    cardId: agentCardMap[a] || null
                });
            }
        });
    }

    // 清理無效 cardId
    tasks.forEach(t => {
        if (!t.cardId) t.cardId = agentCardMap[t.agent];
    });

    renderTaskList();
    $meetingStatus.textContent = `📋 分析完成：${tasks.length} 個分工任務`;
    $btnRunAll.disabled = tasks.length === 0;
    $btnAnalyze.textContent = '🧠 分析分工';
    showToast(`✅ 總 AI 分析完成，共 ${tasks.length} 個任務`);
}

function renderTaskList() {
    if (tasks.length === 0) {
        $taskList.innerHTML = `
            <div class="placeholder-text">
                <span class="icon">🏛️</span>
                輸入總體任務<br>讓總 AI 分析並分工
            </div>`;
        $btnRunAll.disabled = true;
        return;
    }

    $taskList.innerHTML = tasks.map(t => {
        const cls = getAgentColorClass(t.agent);
        const statusText = t.status === 'running' ? '🟡 執行中' :
                          t.status === 'done' ? '✅ 完成' : '⏳ 等待';
        return `
            <div class="task-item ${t.status}" id="task-${t.id}">
                <div class="task-item-header">
                    <span class="task-agent-tag ${cls}">${t.agent}</span>
                    <span class="task-status">${statusText}</span>
                </div>
                <div class="task-desc">${escapeHtml(t.task)}</div>
            </div>`;
    }).join('');

    $btnRunAll.disabled = false;
}

// ==================== 全部並行執行（真正多工） ====================
$btnRunAll.addEventListener('click', runAllTasks);

let isExecuting = false;

function runAllTasks() {
    if (tasks.length === 0) { showToast('⚠️ 無任務可執行'); return; }

    // 清除舊輸出
    Object.keys(agentOutputs).forEach(k => { agentOutputs[k] = ''; });
    document.querySelectorAll('.agent-card-output').forEach(el => { el.textContent = ''; el.classList.remove('streaming-cursor'); });
    document.querySelectorAll('.agent-card').forEach(c => {
        c.classList.remove('running', 'done');
        const statusEl = c.querySelector('.agent-status');
        if (statusEl) { statusEl.textContent = '🟢 待命'; statusEl.className = 'agent-status idle'; }
    });

    // 收集所有待執行任務
    const pendingTasks = tasks.filter(t => t.status === 'waiting' || t.status === 'done').map(t => ({...t}));
    tasks.forEach(t => { if (t.status === 'done') t.status = 'waiting'; });
    if (pendingTasks.length === 0) { showToast('⚠️ 無待執行任務'); return; }

    isExecuting = true;
    $btnRunAll.disabled = true;
    $btnQuickDraft.disabled = true;
    $btnAnalyze.disabled = true;
    $meetingStatus.textContent = `🚀 ${pendingTasks.length} 個 Agent 同時並行執行中…`;
    showToast(`🚀 ${pendingTasks.length} 個 Agent 已同時派發（真正並行）`);

    // 🔧 真正並行：同時對所有任務 emit，各自完成即回調
    let completed = 0;
    pendingTasks.forEach(qt => {
        const task = tasks.find(t => t.id === qt.id);
        if (!task) { completed++; checkAllDone(); return; }
        runSingleTask(task, () => {
            completed++;
            checkAllDone();
        });
    });

    function checkAllDone() {
        $meetingStatus.textContent = `🚀 並行執行中… 已完成 ${completed}/${pendingTasks.length}`;
        if (completed >= pendingTasks.length) {
            isExecuting = false;
            $btnRunAll.disabled = false;
            $btnQuickDraft.disabled = false;
            $btnAnalyze.disabled = false;
            $meetingStatus.textContent = `✅ 全部完成 (${tasks.length} 個任務)`;
            showToast('🎉 所有 Agent 任務完成！');
        }
    }
}

// （已移除：原依序隊列執行，改為上方真正並行）

function runSingleTask(task, onComplete) {
    task.status = 'running';
    updateTaskUI(task);

    const card = document.getElementById(task.cardId);
    if (card) {
        card.classList.add('running');
        card.classList.remove('done');
        const statusEl = card.querySelector('.agent-status');
        if (statusEl) { statusEl.textContent = '🟡 執行中…'; statusEl.className = 'agent-status running'; }
        const output = card.querySelector('.agent-card-output');
        if (output) {
            output.textContent = '';
            output.classList.add('streaming-cursor');
        }
        // 滾動到該卡片
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    let accumulated = '';
    let resolved = false;

    const handler = (data) => {
        if (resolved) return;
        // 🔧 並行模式：只接收自己 agent 的 stream 事件（後端事件帶 data.agent）
        if (data.agent && data.agent !== task.agent) return;
        if (data.type === 'reply') {
            accumulated += data.content;
            const out = document.getElementById(task.cardId + '-output');
            if (out) {
                out.textContent = accumulated;
                out.classList.add('streaming-cursor');
                out.scrollTop = out.scrollHeight;
            }
        } else if (data.type === 'done') {
            resolved = true;
            socket.off('chat_stream', handler);
            task.status = 'done';
            updateTaskUI(task);

            const card2 = document.getElementById(task.cardId);
            if (card2) {
                card2.classList.remove('running');
                card2.classList.add('done');
                const statusEl2 = card2.querySelector('.agent-status');
                if (statusEl2) { statusEl2.textContent = '✅ 完成'; statusEl2.className = 'agent-status done'; }
                const out2 = document.getElementById(task.cardId + '-output');
                if (out2) {
                    out2.textContent = accumulated || '(無輸出)';
                    out2.classList.remove('streaming-cursor');
                }
            }

            if (onComplete) onComplete();
        }
    };

    socket.on('chat_stream', handler);

    socket.emit('chat_message', {
        agent: task.agent,
        message: task.task,
        user_id: 'web_meeting',
        context_files: ['agent.md', 'user.md']  // 🔧 會議模式任務：agent.md + user.md
    });

    // 超時處理
    setTimeout(() => {
        if (!resolved) {
            resolved = true;
            socket.off('chat_stream', handler);
            task.status = 'done';
            updateTaskUI(task);
            const card3 = document.getElementById(task.cardId);
            if (card3) {
                card3.classList.remove('running');
                card3.classList.add('done');
                const out3 = document.getElementById(task.cardId + '-output');
                if (out3) {
                    out3.textContent = accumulated || '(超時)';
                    out3.classList.remove('streaming-cursor');
                }
            }
            if (onComplete) onComplete();
        }
    }, 300000);
}

function updateTaskUI(task) {
    const el = document.getElementById('task-' + task.id);
    if (!el) return;
    el.className = 'task-item ' + task.status;
    const statusEl = el.querySelector('.task-status');
    if (statusEl) {
        statusEl.textContent = task.status === 'running' ? '🟡 執行中' :
                               task.status === 'done' ? '✅ 完成' : '⏳ 等待';
    }
}

// ==================== 清除 ====================
$btnClearTasks.addEventListener('click', () => {
    tasks = [];
    renderTaskList();
    $meetingInput.value = '';
    Object.keys(agentOutputs).forEach(k => { agentOutputs[k] = ''; });
    document.querySelectorAll('.agent-card-output').forEach(el => { el.textContent = ''; el.classList.remove('streaming-cursor'); });
    document.querySelectorAll('.agent-card').forEach(c => {
        c.classList.remove('running', 'done');
        const s = c.querySelector('.agent-status');
        if (s) { s.textContent = '🟢 待命'; s.className = 'agent-status idle'; }
    });
    $meetingStatus.textContent = '🟢 待命中';
    $btnRunAll.disabled = true;
    showToast('🗑 已清除全部任務');
});

// ==================== 工具 ====================
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ==================== 鍵盤快捷鍵 ====================
document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'Enter') {
        e.preventDefault();
        analyzeAndDispatch();
    }
    if (e.ctrlKey && e.key === 'r') {
        e.preventDefault();
        runAllTasks();
    }
});
