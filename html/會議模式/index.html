<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>會議模式 — mokagi</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
:root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --accent: #58a6ff; --accent2: #3fb950; --text: #e6edf3;
    --dim: #8b949e; --danger: #f85149; --warn: #d2991d;
    --card-spring: #ffb7c5; --card-yue: #b7e4ff; --card-default: #d2a8ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: var(--bg); color: var(--text);
    font-family: 'Cascadia Code', 'Segoe UI', 'Helvetica Neue', sans-serif;
    height: 100vh; height: 100dvh; overflow: hidden;
}

/* ===== 主容器 ===== */
.meeting-container { display: flex; height: 100vh; height: 100dvh; }

/* ===== 左側面板 ===== */
.task-panel {
    flex: 0 0 380px; min-width: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
    transition: flex 0.3s ease, min-width 0.3s ease;
}
.task-panel.collapsed {
    flex: 0 0 36px; min-width: 36px;
}
.task-panel.collapsed .task-panel-body { display: none; }
.task-panel.collapsed .task-panel-header h2 span { display: none; }
.task-panel.collapsed .task-panel-header .btn-group { display: none; }

.panel-header {
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: #1c2128; min-height: 36px; flex-shrink: 0;
}
.panel-header h2 {
    font-size: 15px; color: var(--accent);
    display: flex; align-items: center; gap: 8px;
}
.panel-header .btn-group { display: flex; gap: 6px; }
.panel-header button {
    background: var(--border); border: none; color: var(--text);
    padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 14px;
    transition: all 0.2s;
}
.panel-header button:hover { background: var(--accent); color: #000; }
.collapse-btn {
    background: transparent !important; font-size: 16px;
    padding: 4px 8px !important; cursor: pointer;
    transition: transform 0.3s; border-radius: 4px;
}
.collapse-btn:hover { background: var(--border) !important; color: var(--text) !important; }

/* 面板內容區（可捲動） */
.task-panel-body {
    flex: 1; overflow-y: auto; display: flex; flex-direction: column;
    min-height: 0;
}

/* Agent 選擇區 */
.agent-select-area { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.agent-select-area > label {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--dim); cursor: pointer;
    user-select: none; margin-bottom: 6px;
}
.agent-select-area > label:hover { color: var(--text); }
.collapse-arrow { font-size: 10px; transition: transform 0.3s; display: inline-block; }
.agent-select-area.folded .collapse-arrow { transform: rotate(-90deg); }
.agent-select-area.folded .agent-select-content { display: none; }

.agent-checkboxes {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px;
}
.agent-chip {
    display: flex; align-items: center; gap: 4px;
    padding: 5px 10px; border-radius: 20px; cursor: pointer;
    font-size: 12px; border: 1px solid var(--border);
    background: var(--bg); transition: all 0.2s;
    user-select: none;
}
.agent-chip:hover { border-color: var(--accent); }
.agent-chip.checked { background: var(--accent); color: #000; border-color: var(--accent); font-weight: bold; }
.agent-chip.spring.checked { background: #e8537a; border-color: #e8537a; color: #fff; }
.agent-chip.yue.checked { background: #4a9fd8; border-color: #4a9fd8; color: #fff; }
.analyzer-select {
    display: flex; align-items: center; gap: 8px;
    padding-top: 4px;
}
.analyzer-select label { font-size: 12px; color: var(--dim); white-space: nowrap; }
.analyzer-select select {
    flex: 1; padding: 5px 8px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font-size: 12px;
}

/* 輸入區 */
.task-input-area { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.task-input-area textarea {
    width: 100%; height: 100px; min-height: 60px; max-height: 50vh; padding: 10px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    resize: vertical; font-size: 13px; font-family: inherit;
    transition: border-color 0.2s;
}
.task-input-area textarea:focus { outline: none; border-color: var(--accent); }
.btn-row { display: flex; gap: 8px; margin-top: 8px; }
.btn-primary, .btn-secondary {
    flex: 1; padding: 9px 12px; border: none; border-radius: 8px;
    cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s;
}
.btn-primary { background: var(--accent); color: #000; }
.btn-primary:hover { filter: brightness(1.15); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: var(--border); color: var(--text); }
.btn-secondary:hover { background: #4a5568; }
.btn-run-all {
    width: 100%; margin-top: 6px; padding: 10px; background: var(--accent2);
    color: #000; border: none; border-radius: 8px; cursor: pointer;
    font-size: 14px; font-weight: 700; transition: all 0.2s;
}
.btn-run-all:hover { filter: brightness(1.2); }
.btn-run-all:disabled { opacity: 0.5; cursor: not-allowed; }

/* 任務列表 */
.task-list {
    flex: 1; overflow-y: auto; padding: 8px;
    display: flex; flex-direction: column; gap: 6px; min-height: 0;
}
.task-item {
    padding: 10px 12px; background: var(--bg); border-radius: 8px;
    border: 1px solid var(--border); font-size: 12px; transition: all 0.3s;
}
.task-item.running { border-color: var(--warn); animation: pulse 1.5s infinite; }
.task-item.done { border-color: var(--accent2); opacity: 0.7; }
@keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(210,153,29,0.3); }
    50% { box-shadow: 0 0 12px 2px rgba(210,153,29,0.5); }
}
.task-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.task-agent-tag {
    font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: bold;
}
.task-agent-tag.spring { background: #e8537a33; color: var(--card-spring); }
.task-agent-tag.yue { background: #4a9fd833; color: var(--card-yue); }
.task-agent-tag.default { background: #d2a8ff33; color: var(--card-default); }
.task-status { font-size: 11px; }
.task-status.idle { color: var(--dim); }
.task-status.running { color: var(--warn); }
.task-status.done { color: var(--accent2); }
.task-desc { color: var(--dim); line-height: 1.4; }

.placeholder-text {
    color: var(--dim); text-align: center; padding: 30px 16px;
    font-size: 13px; line-height: 1.8;
}
.placeholder-text .icon { font-size: 36px; display: block; margin-bottom: 10px; }

/* ===== 右側會議室 ===== */
.meeting-room {
    flex: 1; min-width: 0;
    background: var(--bg);
    display: flex; flex-direction: column; overflow: hidden;
    transition: flex 0.3s ease;
}
.meeting-room.collapsed {
    flex: 0 0 36px; min-width: 36px;
}
.meeting-room.collapsed .meeting-room-body { display: none; }
.meeting-room.collapsed .meeting-header .title { display: none; }
.meeting-room.collapsed .meeting-status { display: none; }

.meeting-header {
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
    background: #1c2128; min-height: 36px; flex-shrink: 0;
}
.meeting-header .title { font-size: 15px; font-weight: bold; color: var(--accent); }
.meeting-status { font-size: 12px; color: var(--dim); margin-left: auto; }

.meeting-room-body {
    flex: 1; overflow: hidden; display: flex; flex-direction: column;
}
.agent-cards-grid {
    flex: 1; overflow-y: auto; padding: 12px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 10px; align-content: start;
}
.agent-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; display: flex; flex-direction: column;
    min-height: 180px; max-height: 400px; overflow: hidden;
}
.agent-card-header {
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: #1c2128; flex-shrink: 0;
}
.agent-card-name { font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 6px; }
.agent-card-name .dot {
    width: 8px; height: 8px; border-radius: 50%; display: inline-block;
}
.dot.spring { background: #e8537a; }
.dot.yue { background: #4a9fd8; }
.dot.default { background: #d2a8ff; }
.agent-status { font-size: 11px; }
.agent-status.idle { color: var(--dim); }
.agent-status.running { color: var(--warn); }
.agent-status.done { color: var(--accent2); }
.agent-card-output {
    flex: 1; overflow-y: auto; padding: 12px 14px;
    font-size: 13px; line-height: 1.6; white-space: pre-wrap;
    font-family: 'Cascadia Code', monospace;
}
.agent-card-output.streaming-cursor::after {
    content: '▊'; animation: blink 0.8s infinite; color: var(--accent);
}
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
.agent-card.collapsed .agent-card-output { display: none; }
.agent-card.collapsed { min-height: auto; max-height: none; }
.card-collapse-btn {
    background: transparent; border: none; color: var(--dim);
    cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 4px;
}
.card-collapse-btn:hover { background: var(--border); color: var(--text); }

/* ===== Toast ===== */
.toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: #21262d; color: var(--text); padding: 10px 24px;
    border-radius: 20px; font-size: 13px; border: 1px solid var(--border);
    opacity: 0; transition: all 0.3s; z-index: 2000; pointer-events: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== 右下角模式選擇器 ===== */
.mode-selector-btn {
    position: fixed; bottom: 20px; right: 20px; z-index: 1000;
    width: 50px; height: 50px; border-radius: 50%;
    background: var(--accent); color: #000; border: none;
    font-size: 22px; cursor: pointer;
    box-shadow: 0 4px 20px rgba(88,166,255,0.4);
    transition: all 0.3s;
    display: flex; align-items: center; justify-content: center;
}
.mode-selector-btn:hover { transform: scale(1.1); box-shadow: 0 6px 28px rgba(88,166,255,0.6); }
.mode-selector-btn.active { background: var(--accent2); }
.mode-panel {
    position: fixed; bottom: 80px; right: 20px; z-index: 999;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 6px; min-width: 200px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    display: none; flex-direction: column; gap: 2px;
}
.mode-panel.show { display: flex; }
.mode-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 10px; cursor: pointer;
    transition: all 0.2s; font-size: 13px; border: none;
    background: transparent; color: var(--text); text-align: left;
    width: 100%;
}
.mode-item:hover { background: #21262d; }
.mode-item.active { background: var(--accent); color: #000; font-weight: bold; }
.mode-item .mode-icon { font-size: 18px; }
.mode-item .mode-badge {
    font-size: 10px; padding: 2px 6px; border-radius: 8px;
    background: var(--border); color: var(--dim); margin-left: auto;
}

/* 響應式 */
@media (max-width: 768px) {
    .meeting-container { flex-direction: column; }
    .task-panel { flex: 1 1 55vh !important; max-height: 55vh; }
    .task-panel.collapsed { flex: 0 0 36px !important; max-height: 36px; }
    .meeting-room { flex: 1 1 auto !important; }
    .meeting-room.collapsed { flex: 0 0 36px !important; }
    .agent-cards-grid { grid-template-columns: 1fr; }
    .task-input-area textarea { height: 65px; }
}
    </style>
</head>
<body>

<div class="meeting-container">
    <!-- ===== 左側：會議控制台 ===== -->
    <div class="task-panel" id="taskPanel">
        <div class="panel-header task-panel-header">
            <h2>
                <button class="collapse-btn" onclick="toggleLeftPanel()" title="摺疊/展開左側面板">◀</button>
                <span>🏛️ 會議控制台</span>
            </h2>
            <div class="btn-group">
                <button onclick="location.href='/'" title="回主控台">🏠</button>
                <button id="btnClearTasks" title="清除全部">🗑</button>
            </div>
        </div>

        <div class="task-panel-body">
            <!-- Agent 選擇區（可摺疊） -->
            <div class="agent-select-area" id="agentSelectArea">
                <label onclick="toggleAgentSelect()">
                    📋 會議成員 <span class="collapse-arrow">▼</span>
                </label>
                <div class="agent-select-content">
                    <div class="agent-checkboxes" id="agentCheckboxes"></div>
                    <div class="analyzer-select">
                        <label>🧠 總指揮：</label>
                        <select id="analyzerSelect"></select>
                    </div>
                </div>
            </div>

            <!-- 輸入區 -->
            <div class="task-input-area">
                <textarea id="meetingInput" placeholder="輸入會議總任務，讓總指揮 AI 分析並自動分工...&#10;例如：撰寫一份關於 AI 倫理的報告、設計一個 RESTful API"></textarea>
                <div class="btn-row">
                    <button class="btn-primary" id="btnAnalyze">🧠 分析分工</button>
                    <button class="btn-secondary" id="btnQuickDraft">⚡ 快速草稿</button>
                </div>
                <button class="btn-run-all" id="btnRunAll">▶ 執行全部任務</button>
            </div>

            <!-- 分工任務列表 -->
            <div class="task-list" id="taskList">
                <div class="placeholder-text">
                    <span class="icon">🏛️</span>
                    選擇 Agent → 輸入總體任務<br>讓總 AI 分析並分工<br>各 Agent 並行處理 ✨
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 右側：會議室 ===== -->
    <div class="meeting-room" id="meetingRoom">
        <div class="meeting-header">
            <button class="collapse-btn" onclick="toggleRightPanel()" title="摺疊/展開右側面板">▶</button>
            <span class="title">📊 會議室 — 即時輸出</span>
            <span class="meeting-status" id="meetingStatus">🟢 待命中</span>
        </div>
        <div class="meeting-room-body">
            <div class="agent-cards-grid" id="agentCardsGrid">
                <div class="placeholder-text" id="roomPlaceholder">
                    <span class="icon">🏢</span>
                    選擇左側 Agent 並分析分工<br>各 Agent 的輸出將在此即時顯示
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 右下角模式選擇器 -->
<button class="mode-selector-btn" id="modeBtn" title="切換模式">⚙</button>
<div class="mode-panel" id="modePanel">
    <button class="mode-item" data-mode="stretch">
        <span class="mode-icon">🧘</span> 伸展思考
        <span class="mode-badge">未上市</span>
    </button>
    <button class="mode-item" data-mode="fast">
        <span class="mode-icon">⚡</span> 快速模式
        <span class="mode-badge">未上市</span>
    </button>
    <button class="mode-item" data-mode="document">
        <span class="mode-icon">📄</span> 文件模式
        <span class="mode-badge">未上市</span>
    </button>
    <button class="mode-item active" data-mode="meeting">
        <span class="mode-icon">🏛️</span> 會議模式
        <span class="mode-badge">當前</span>
    </button>
    <button class="mode-item" data-mode="custom">
        <span class="mode-icon">🔮</span> ...模式
        <span class="mode-badge">敬請期待</span>
    </button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ==================== 全域狀態 ====================
const socket = io();
let agentList = [];
let agentMeta = {};
let selectedAgents = new Set();
let tasks = [];
let agentOutputs = {};
let isExecuting = false;

const $agentCheckboxes = document.getElementById('agentCheckboxes');
const $analyzerSelect = document.getElementById('analyzerSelect');
const $meetingInput = document.getElementById('meetingInput');
const $btnAnalyze = document.getElementById('btnAnalyze');
const $btnQuickDraft = document.getElementById('btnQuickDraft');
const $btnRunAll = document.getElementById('btnRunAll');
const $btnClearTasks = document.getElementById('btnClearTasks');
const $taskList = document.getElementById('taskList');
const $agentCardsGrid = document.getElementById('agentCardsGrid');
const $roomPlaceholder = document.getElementById('roomPlaceholder');
const $meetingStatus = document.getElementById('meetingStatus');
const $modeBtn = document.getElementById('modeBtn');
const $modePanel = document.getElementById('modePanel');
const $toast = document.getElementById('toast');
const $agentSelectArea = document.getElementById('agentSelectArea');

// ==================== 左右面板摺疊 ====================
function toggleLeftPanel() {
    const panel = document.getElementById('taskPanel');
    const room = document.getElementById('meetingRoom');
    const btn = panel.querySelector('.collapse-btn');
    panel.classList.toggle('collapsed');
    if (panel.classList.contains('collapsed')) {
        btn.textContent = '▶';
        room.classList.remove('collapsed');
    } else {
        btn.textContent = '◀';
    }
}

function toggleRightPanel() {
    const room = document.getElementById('meetingRoom');
    const panel = document.getElementById('taskPanel');
    const btn = room.querySelector('.collapse-btn');
    room.classList.toggle('collapsed');
    if (room.classList.contains('collapsed')) {
        btn.textContent = '◀';
        panel.classList.remove('collapsed');
    } else {
        btn.textContent = '▶';
    }
}

// ==================== Agent 選擇區摺疊 ====================
function toggleAgentSelect() {
    $agentSelectArea.classList.toggle('folded');
}

// ==================== Agent 卡片摺疊 ====================
function toggleCardOutput(cardId) {
    const card = document.getElementById(cardId);
    if (card) card.classList.toggle('collapsed');
}

// ==================== Toast ====================
let toastTimer;
function showToast(msg, duration = 2000) {
    clearTimeout(toastTimer);
    $toast.textContent = msg;
    $toast.classList.add('show');
    toastTimer = setTimeout(() => $toast.classList.remove('show'), duration);
}

// ==================== HTML 轉義 ====================
function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// ==================== Socket.IO ====================
socket.on('connect', () => {
    console.log('✅ Socket.IO connected');
    socket.emit('get_agent_list');
});

socket.on('disconnect', () => {
    console.warn('⚠️ Socket.IO disconnected');
    showToast('⚠️ 連線中斷，正在重連…');
});

socket.on('agent_list', (data) => {
    agentList = data.agents || [];
    agentMeta = data.meta || {};
    renderAgentCheckboxes();
});

socket.on('agent_output', (data) => {
    const { agent, text, done } = data;
    if (!agentOutputs[agent]) agentOutputs[agent] = '';
    agentOutputs[agent] += text;
    updateAgentCardOutput(agent);

    if (done) {
        const card = document.querySelector(`.agent-card[data-agent="${agent}"]`);
        if (card) {
            card.classList.add('done');
            card.classList.remove('running');
            const statusEl = card.querySelector('.agent-status');
            if (statusEl) { statusEl.textContent = '✅ 完成'; statusEl.className = 'agent-status done'; }
        }
        checkAllDone();
    }
});

socket.on('task_progress', (data) => {
    const { task_id, status, agent } = data;
    const taskEl = document.querySelector(`.task-item[data-task-id="${task_id}"]`);
    if (taskEl) {
        taskEl.classList.remove('running', 'done');
        if (status === 'running') taskEl.classList.add('running');
        if (status === 'done') taskEl.classList.add('done');
        const statusEl = taskEl.querySelector('.task-status');
        if (statusEl) {
            statusEl.textContent = status === 'running' ? '🟡 執行中' : status === 'done' ? '✅ 完成' : '⚪ 等待';
            statusEl.className = 'task-status ' + status;
        }
    }
});

// ==================== 渲染 Agent 選擇 ====================
function renderAgentCheckboxes() {
    $agentCheckboxes.innerHTML = agentList.map(a => {
        const meta = agentMeta[a] || {};
        let cls = 'agent-chip';
        if (meta.color === 'spring') cls += ' spring';
        else if (meta.color === 'yue') cls += ' yue';
        return `<div class="${cls}" data-agent="${a}" onclick="toggleAgent('${a}', this)">
            ${meta.icon || '🤖'} ${a}
            ${meta.post ? `<span style="font-size:10px;opacity:0.7">${meta.post}</span>` : ''}
        </div>`;
    }).join('');

    $analyzerSelect.innerHTML = agentList.map(a => {
        const meta = agentMeta[a] || {};
        return `<option value="${a}">${meta.icon || '🤖'} ${a}${meta.post ? '（'+meta.post+'）' : ''}</option>`;
    }).join('');
}

function toggleAgent(name, el) {
    if (selectedAgents.has(name)) {
        selectedAgents.delete(name);
        el.classList.remove('checked');
    } else {
        selectedAgents.add(name);
        el.classList.add('checked');
    }
    updateAnalyzerSelect();
}

function updateAnalyzerSelect() {
    const agents = Array.from(selectedAgents);
    const currentVal = $analyzerSelect.value;
    $analyzerSelect.innerHTML = agents.map(a => {
        const meta = agentMeta[a] || {};
        return `<option value="${a}">${meta.icon || '🤖'} ${a}${meta.post ? '（'+meta.post+'）' : ''}</option>`;
    }).join('');
    if (agents.includes(currentVal)) $analyzerSelect.value = currentVal;
}

// ==================== 分析分工 ====================
$btnAnalyze.addEventListener('click', analyzeAndDispatch);
$btnQuickDraft.addEventListener('click', quickDispatch);

async function analyzeAndDispatch() {
    const input = $meetingInput.value.trim();
    if (!input) { showToast('⚠️ 請輸入會議總任務'); return; }
    if (selectedAgents.size === 0) { showToast('⚠️ 請至少選擇一位 Agent'); return; }

    const analyzer = $analyzerSelect.value;
    if (!analyzer) { showToast('⚠️ 請選擇總指揮 Agent'); return; }

    $btnAnalyze.disabled = true;
    $btnAnalyze.textContent = '⏳ 分析中…';
    $meetingStatus.textContent = '🧠 總 AI 分析分工中…';

    const agents = Array.from(selectedAgents);
    const agentsInfo = agents.map(a => {
        const meta = agentMeta[a] || {};
        let info = a;
        if (meta.post || meta.desc) info += '（' + [meta.post, meta.desc].filter(Boolean).join(' / ') + '）';
        return info;
    }).join(', ');

    const prompt = `【會議總任務】${input}\n【參與 Agent】${agentsInfo}\n請分析此任務，為每位 Agent 分配具體的子任務。`;
    const msg = `@${analyzer} ${prompt}`;

    try {
        const resp = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg, agent: analyzer })
        });
        const data = await resp.json();
        const reply = data.reply || data.text || '';
        parseTasks(reply, agents);
    } catch (e) {
        console.error(e);
        showToast('❌ 分析失敗：' + e.message);
    } finally {
        $btnAnalyze.disabled = false;
        $btnAnalyze.textContent = '🧠 分析分工';
        $meetingStatus.textContent = '🟢 待命中';
    }
}

function quickDispatch() {
    const input = $meetingInput.value.trim();
    if (!input) { showToast('⚠️ 請輸入任務'); return; }
    if (selectedAgents.size === 0) { showToast('⚠️ 請至少選擇一位 Agent'); return; }

    const agents = Array.from(selectedAgents);
    tasks = agents.map((a, i) => ({
        id: 't' + Date.now() + '_' + i,
        agent: a,
        task: i === 0 ? input : `協助 ${agents[0]} 完成：${input}`,
        status: 'idle'
    }));
    renderTasks();
    renderAgentCards(agents);
    showToast(`⚡ 已快速分配 ${agents.length} 個任務`);
}

function parseTasks(reply, agents) {
    const lines = reply.split('\n').filter(l => l.trim());
    tasks = [];
    let taskIdx = 0;
    for (const line of lines) {
        for (const agent of agents) {
            if (line.includes(agent) || line.startsWith('###') || line.match(/^\d+[\.\)]/)) {
                const cleaned = line.replace(/^[#\d\.\)\-\s]+/, '').trim();
                if (cleaned.length > 5) {
                    tasks.push({ id: 't' + Date.now() + '_' + taskIdx++, agent, task: cleaned, status: 'idle' });
                }
                break;
            }
        }
    }
    if (tasks.length === 0) {
        tasks = agents.map((a, i) => ({
            id: 't' + Date.now() + '_' + i,
            agent: a,
            task: `處理：${reply.substring(0, 80)}…`,
            status: 'idle'
        }));
    }
    renderTasks();
    renderAgentCards(agents);
    showToast(`✅ 已分配 ${tasks.length} 個子任務`);
}

// ==================== 渲染任務列表 ====================
function renderTasks() {
    if (tasks.length === 0) {
        $taskList.innerHTML = `<div class="placeholder-text"><span class="icon">🏛️</span>選擇 Agent → 輸入總體任務<br>讓總 AI 分析並分工 ✨</div>`;
        return;
    }
    $taskList.innerHTML = tasks.map(t => {
        const meta = agentMeta[t.agent] || {};
        const colorCls = meta.color || 'default';
        return `<div class="task-item" data-task-id="${t.id}" data-agent="${t.agent}">
            <div class="task-item-header">
                <span class="task-agent-tag ${colorCls}">${meta.icon || '🤖'} ${t.agent}</span>
                <span class="task-status idle">⚪ 等待</span>
            </div>
            <div class="task-desc">${escapeHtml(t.task)}</div>
        </div>`;
    }).join('');
    $btnRunAll.disabled = false;
}

// ==================== 渲染 Agent 卡片 ====================
function renderAgentCards(agents) {
    $roomPlaceholder.style.display = 'none';
    const existingIds = new Set();
    $agentCardsGrid.querySelectorAll('.agent-card').forEach(c => {
        existingIds.add(c.dataset.agent);
    });

    agents.forEach(a => {
        if (existingIds.has(a)) return;
        const meta = agentMeta[a] || {};
        const colorCls = meta.color || 'default';
        const cardId = 'card_' + a;
        const card = document.createElement('div');
        card.className = 'agent-card';
        card.id = cardId;
        card.dataset.agent = a;
        card.innerHTML = `
            <div class="agent-card-header">
                <span class="agent-card-name">
                    <span class="dot ${colorCls}"></span> ${meta.icon || '🤖'} ${a}
                    ${meta.post ? `<span style="font-size:11px;color:var(--dim)">${meta.post}</span>` : ''}
                </span>
                <div style="display:flex;align-items:center;gap:8px">
                    <span class="agent-status idle">🟢 待命</span>
                    <button class="card-collapse-btn" onclick="toggleCardOutput('${cardId}')">▼</button>
                </div>
            </div>
            <div class="agent-card-output"></div>`;
        $agentCardsGrid.appendChild(card);
    });

    agentOutputs = {};
    agents.forEach(a => { agentOutputs[a] = ''; });
}

function updateAgentCardOutput(agent) {
    const card = document.querySelector(`.agent-card[data-agent="${agent}"]`);
    if (!card) return;
    const outputEl = card.querySelector('.agent-card-output');
    if (outputEl) {
        outputEl.textContent = agentOutputs[agent] || '';
        outputEl.classList.add('streaming-cursor');
        outputEl.scrollTop = outputEl.scrollHeight;
    }
}

// ==================== 執行全部任務 ====================
$btnRunAll.addEventListener('click', runAllTasks);

function runAllTasks() {
    if (tasks.length === 0) { showToast('⚠️ 無任務可執行'); return; }

    Object.keys(agentOutputs).forEach(k => { agentOutputs[k] = ''; });
    document.querySelectorAll('.agent-card-output').forEach(el => {
        el.textContent = '';
        el.classList.add('streaming-cursor');
    });
    document.querySelectorAll('.agent-card').forEach(c => {
        c.classList.remove('running', 'done');
        const statusEl = c.querySelector('.agent-status');
        if (statusEl) { statusEl.textContent = '🟡 執行中'; statusEl.className = 'agent-status running'; }
    });

    tasks.forEach(t => {
        t.status = 'running';
        const taskEl = document.querySelector(`.task-item[data-task-id="${t.id}"]`);
        if (taskEl) {
            taskEl.classList.add('running');
            const s = taskEl.querySelector('.task-status');
            if (s) { s.textContent = '🟡 執行中'; s.className = 'task-status running'; }
        }
    });

    $btnRunAll.disabled = true;
    $meetingStatus.textContent = '⚡ 執行中…';
    isExecuting = true;

    tasks.forEach(t => {
        const card = document.querySelector(`.agent-card[data-agent="${t.agent}"]`);
        if (card) card.classList.add('running');

        const msg = `@${t.agent} ${t.task}`;
        fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg, agent: t.agent })
        }).then(r => r.json()).then(data => {
            const reply = data.reply || data.text || '';
            agentOutputs[t.agent] = (agentOutputs[t.agent] || '') + reply + '\n\n';
            updateAgentCardOutput(t.agent);

            t.status = 'done';
            const taskEl = document.querySelector(`.task-item[data-task-id="${t.id}"]`);
            if (taskEl) {
                taskEl.classList.add('done');
                taskEl.classList.remove('running');
                const s = taskEl.querySelector('.task-status');
                if (s) { s.textContent = '✅ 完成'; s.className = 'task-status done'; }
            }

            const card2 = document.querySelector(`.agent-card[data-agent="${t.agent}"]`);
            if (card2) {
                card2.classList.add('done');
                card2.classList.remove('running');
                const statusEl = card2.querySelector('.agent-status');
                if (statusEl) { statusEl.textContent = '✅ 完成'; statusEl.className = 'agent-status done'; }
                const outputEl = card2.querySelector('.agent-card-output');
                if (outputEl) outputEl.classList.remove('streaming-cursor');
            }

            checkAllDone();
        }).catch(err => {
            console.error(err);
            agentOutputs[t.agent] = (agentOutputs[t.agent] || '') + '❌ 錯誤：' + err.message + '\n';
            updateAgentCardOutput(t.agent);
            t.status = 'done';
            checkAllDone();
        });
    });
}

function checkAllDone() {
    if (!isExecuting) return;
    const allDone = tasks.every(t => t.status === 'done');
    if (allDone) {
        isExecuting = false;
        $btnRunAll.disabled = false;
        $meetingStatus.textContent = '✅ 全部完成';
        showToast('🎉 全部任務執行完畢！', 3000);
    }
}

// ==================== 清除任務 ====================
$btnClearTasks.addEventListener('click', () => {
    tasks = [];
    agentOutputs = {};
    $taskList.innerHTML = `<div class="placeholder-text"><span class="icon">🏛️</span>選擇 Agent → 輸入總體任務<br>讓總 AI 分析並分工 ✨</div>`;
    $agentCardsGrid.innerHTML = `<div class="placeholder-text" id="roomPlaceholder"><span class="icon">🏢</span>選擇左側 Agent 並分析分工<br>各 Agent 的輸出將在此即時顯示</div>`;
    $btnRunAll.disabled = true;
    $meetingStatus.textContent = '🟢 待命中';
    showToast('🗑 已清除全部');
});

// ==================== 模式選擇器 ====================
$modeBtn.addEventListener('click', () => {
    $modePanel.classList.toggle('show');
    $modeBtn.classList.toggle('active');
});

document.addEventListener('click', (e) => {
    if (!$modePanel.contains(e.target) && e.target !== $modeBtn) {
        $modePanel.classList.remove('show');
        $modeBtn.classList.remove('active');
    }
});

$modePanel.querySelectorAll('.mode-item').forEach(item => {
    item.addEventListener('click', () => {
        const mode = item.dataset.mode;
        if (mode === 'meeting') return;
        showToast('🔮 ' + item.textContent.trim() + ' — 敬請期待');
    });
});
</script>
</body>
</html>
