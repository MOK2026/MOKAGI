    <style>
:root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --accent: #58a6ff; --accent2: #3fb950; --text: #e6edf3;
    --dim: #8b949e; --danger: #f85149; --warn: #d2991d;
    --card-spring: #ffb7c5; --card-yue: #b7e4ff; --card-default: #d2a8ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
    background: var(--bg); color: var(--text);
    font-family: 'Cascadia Code', 'Segoe UI', 'Helvetica Neue', sans-serif;
    height: 100vh; height: 100dvh; overflow: hidden;
    display: flex; flex-direction: column;
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #4b5563; }

/* ===== 頂部導航列（分頁） ===== */
.top-nav {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; background: #161b22; border-bottom: 1px solid var(--border);
    position: relative; z-index: 100;
}
.nav-title { font-size: 13px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.nav-tabs { display: flex; gap: 5px; flex: 1 1 auto; overflow-x: auto; scrollbar-width: none; }
.nav-tabs::-webkit-scrollbar { display: none; }
.nav-tab {
    border: 1px solid var(--border); background: #1c2128; color: var(--dim);
    padding: 6px 13px; border-radius: 999px; font-size: 13px; cursor: pointer;
    white-space: nowrap; transition: all .18s; font-family: inherit;
}
.nav-tab:hover { background: #21262d; color: var(--text); }
.nav-tab.active { background: var(--accent); border-color: var(--accent); color: #08121f; font-weight: 700; }
.nav-right { display: flex; align-items: center; gap: 6px; margin-left: auto; }

/* ===== 頻道下拉（移植自 index.html 的 channelBtn） ===== */
.chan-group { position: relative; display: inline-flex; align-items: center; }
.chan-pill {
    appearance: none; border: 1px solid var(--tone, var(--border));
    background: rgba(255,255,255,.04); color: var(--text);
    padding: 6px 13px; border-radius: 999px; font-size: 13px; cursor: pointer;
    white-space: nowrap; font-family: inherit; transition: all .18s;
}
.chan-pill:hover { border-color: var(--tone, var(--accent)); box-shadow: 0 0 0 3px rgba(88,166,255,.12); }
.header-btns-dropdown {
    position: absolute; top: calc(100% + 8px); right: 0; min-width: 215px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 6px; box-shadow: 0 14px 40px rgba(0,0,0,.6);
    display: none; flex-direction: column; gap: 3px; z-index: 300;
}
.header-btns-dropdown.show { display: flex; }
.header-dropdown-item {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    padding: 9px 12px; border-radius: 8px; border: none; background: transparent;
    color: var(--text); font-size: 13px; cursor: pointer; font-family: inherit; transition: all .15s;
}
.header-dropdown-item:hover { background: #21262d; color: var(--tone, var(--accent)); }
.header-dropdown-gap { height: 1px; background: var(--border); margin: 4px 6px; }

/* ===== 主容器 ===== */
.meeting-container { flex: 1 1 auto; display: flex; min-height: 0; overflow: hidden; }
.splitter { flex: 0 0 5px; cursor: col-resize; position: relative; background: transparent; }
.splitter::after {
    content: ''; position: absolute; top: 0; bottom: 0; left: 2px; width: 1px;
    background: var(--border); transition: background .2s;
}
.splitter:hover::after { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

/* ===== 左側任務面板 ===== */
.task-panel {
    flex: 0 0 var(--pnl-w, 340px); min-width: 0; background: var(--panel);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    overflow: hidden; min-height: 0; z-index: 10;
}
.task-panel-header {
    flex: 0 0 auto; padding: 9px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; background: #1c2128;
}
.task-panel-header h2 { font-size: 14px; color: var(--accent); display: flex; align-items: center; gap: 6px; }
.task-panel-header .btn-group { display: flex; gap: 6px; }
.task-panel-header button, .collapse-btn {
    background: var(--border); border: none; color: var(--text); padding: 5px 9px;
    border-radius: 6px; cursor: pointer; font-size: 13px; transition: all .2s; font-family: inherit;
}
.task-panel-header button:hover { background: var(--accent); color: #000; }
.collapse-btn { background: transparent; font-size: 15px; padding: 3px 6px; }
.collapse-btn:hover { background: var(--border); color: var(--text); }
.task-panel.collapsed .task-input-area,
.task-panel.collapsed .task-list,
.task-panel.collapsed .agent-select-area { display: none; }
.task-panel.collapsed { flex: 0 0 46px; min-width: 46px; }
.task-panel.collapsed .task-panel-header { padding: 10px 8px; flex-direction: column; gap: 6px; }
.task-panel.collapsed .task-panel-header h2 { font-size: 18px; }
.task-panel.collapsed .task-panel-header h2 span { display: none; }
.task-panel.collapsed .task-panel-header .btn-group { display: none; }

/* ===== Agent 選擇區 ===== */
.agent-select-area { flex: 0 0 auto; padding: 8px 12px; border-bottom: 1px solid var(--border); }
.agent-select-area > label {
    font-size: 12px; color: var(--dim); cursor: pointer;
    display: flex; align-items: center; gap: 6px; user-select: none;
}
.agent-select-area.collapsed { padding-bottom: 6px; }
.agent-select-area.collapsed label .collapse-arrow { transform: rotate(-90deg); }
.collapse-arrow { font-size: 10px; transition: transform .25s; }
.agent-select-content {
    display: flex; flex-direction: column; gap: 8px; margin-top: 8px;
    overflow: hidden auto; transition: max-height .35s ease, opacity .3s;
    max-height: 30vh; opacity: 1;
}
.agent-select-area.collapsed .agent-select-content { max-height: 0; opacity: 0; margin-bottom: 0; }
.agent-checkboxes { display: flex; flex-wrap: wrap; gap: 6px; }
.agent-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
    border: 1px solid var(--border); border-radius: 999px; font-size: 12px;
    cursor: pointer; background: #0d1117; color: var(--dim); transition: all .18s; user-select: none;
}
.agent-chip:hover { border-color: var(--accent); }
.agent-chip.checked { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
.agent-chip .agent-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--card-default); flex: 0 0 auto; }
.agent-chip.spring .agent-dot { background: var(--card-spring); }
.agent-chip.yue .agent-dot { background: var(--card-yue); }
.agent-chip.spring.checked { background: #e8537a; border-color: #e8537a; color: #fff; }
.agent-chip.yue.checked { background: #4a9fd8; border-color: #4a9fd8; color: #fff; }
.analyzer-select { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
.analyzer-select select {
    flex: 1 1 auto; background: #0d1117; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px; font-size: 12px; font-family: inherit;
}

/* ===== 任務輸入 ===== */
.task-input-area { flex: 0 0 auto; padding: 8px 12px; border-bottom: 1px solid var(--border); }
.task-input-area textarea {
    width: 100%; height: 66px; resize: vertical; background: #0d1117; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    font-size: 12px; font-family: inherit; line-height: 1.5; outline: none;
}
.task-input-area textarea:focus { border-color: var(--accent); }
.btn-row { display: flex; gap: 6px; margin-top: 6px; }
.btn-primary, .btn-secondary, .btn-run-all {
    flex: 1 1 0; border: none; border-radius: 8px; padding: 8px 10px;
    font-size: 13px; font-weight: 700; cursor: pointer; transition: all .18s; font-family: inherit;
}
.btn-primary { background: var(--accent); color: #08121f; }
.btn-secondary { background: var(--border); color: var(--text); }
.btn-run-all { background: var(--accent2); color: #08121f; width: 100%; margin-top: 6px; }
.btn-primary:hover, .btn-secondary:hover, .btn-run-all:hover { filter: brightness(1.15); }
.btn-run-all:disabled { opacity: .5; cursor: not-allowed; }
.action-hints {
    margin-top: 6px; padding: 7px 9px; background: #1a1f27; border: 1px solid var(--border);
    border-radius: 8px; font-size: 11px; color: var(--dim); line-height: 1.6;
}
.action-hints div { display: flex; align-items: flex-start; gap: 4px; }
.action-hints b { color: var(--text); }

/* ===== 任務列表 ===== */
.task-list {
    flex: 1 1 auto; overflow-y: auto; padding: 10px;
    display: flex; flex-direction: column; gap: 8px; min-height: 0;
}
.task-item {
    padding: 10px 12px; background: var(--bg); border-radius: 8px;
    border: 1px solid var(--border); font-size: 12px; transition: all .3s;
}
.task-item.running { border-color: var(--warn); animation: pulse 1.5s infinite; }
.task-item.done { border-color: var(--accent2); opacity: .85; }
.task-item-header { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
.task-agent-tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #30363d; color: var(--text); }
.task-agent-tag.spring { background: #e8537a33; color: var(--card-spring); }
.task-agent-tag.yue { background: #4a9fd833; color: var(--card-yue); }
.task-agent-tag.default { background: #d2a8ff33; color: var(--card-default); }
.task-desc { color: var(--dim); line-height: 1.5; margin-bottom: 6px; }
.task-status { font-size: 11px; color: var(--dim); margin-left: auto; }

/* ===== 中央會議室 ===== */
.meeting-room {
    flex: 1 1 auto; display: flex; flex-direction: column;
    min-width: 0; min-height: 0; overflow: hidden;
}
.meeting-header {
    flex: 0 0 auto; padding: 9px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; background: #1c2128;
}
.meeting-header .title { font-size: 14px; font-weight: 700; color: var(--accent); }
.meeting-header .collapse-btn {
    background: transparent; border: none; color: var(--dim); font-size: 15px;
    padding: 3px 8px; cursor: pointer; transition: all .2s;
}
.meeting-header .collapse-btn:hover { color: var(--text); background: var(--border); }
.meeting-status {
    margin-left: auto; font-size: 11px; color: var(--dim); background: #0d1117;
    border: 1px solid var(--border); padding: 3px 9px; border-radius: 999px;
}
.meeting-room.collapsed { flex: 0 0 auto; }
.meeting-room.collapsed .agent-cards-grid { display: none; }
.meeting-room.collapsed .meeting-header { border-bottom: none; }
.agent-cards-grid {
    flex: 1 1 auto; overflow-y: auto; padding: 12px; display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); align-content: start;
}
.agent-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    display: flex; flex-direction: column; overflow: hidden; min-height: 120px;
}
.agent-card.running { border-color: var(--warn); }
.agent-card.done { border-color: var(--accent2); }
.agent-card-header {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    background: #1c2128; border-bottom: 1px solid var(--border);
}
.agent-card-header .agent-name { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; }
.agent-card-header .agent-dot-card { width: 10px; height: 10px; border-radius: 50%; background: var(--card-default); }
.agent-card.spring .agent-dot-card { background: var(--card-spring); }
.agent-card.yue .agent-dot-card { background: var(--card-yue); }
.agent-card .agent-status { font-size: 10px; padding: 2px 8px; border-radius: 999px; margin-left: auto; }
.agent-card .agent-status.idle { background: #30363d; color: var(--dim); }
.agent-card .agent-status.running { background: #d2991d33; color: var(--warn); }
.agent-card .agent-status.done { background: #3fb95033; color: var(--accent2); }
.card-collapse-btn { cursor: pointer; font-size: 12px; margin-left: 6px; user-select: none; transition: transform .3s; }
.agent-card-output {
    flex: 1 1 auto; padding: 10px 12px; font-size: 12px; line-height: 1.6;
    overflow-y: auto; max-height: 46vh; word-break: break-word;
}
.agent-card-output pre {
    background: #0d1117; border: 1px solid var(--border); border-radius: 8px;
    padding: 8px; overflow-x: auto; font-size: 11px;
}
.streaming-cursor {
    display: inline-block; width: 7px; height: 13px; background: var(--accent);
    animation: blink .8s infinite; vertical-align: text-bottom;
}
.placeholder-text {
    text-align: center; color: var(--dim); font-size: 13px; line-height: 1.9;
    padding: 32px 16px; grid-column: 1 / -1;
}
.placeholder-text .icon { font-size: 44px; display: block; margin-bottom: 10px; opacity: .7; }

/* ===== 分頁切換 ===== */
body[data-page="tasks"] #meetingRoom { display: none; }
body[data-page="tasks"] .splitter { display: none; }
body[data-page="room"] #taskPanel { display: none; }
body[data-page="room"] .splitter { display: none; }

/* ===== 舊模式選單：保留 DOM 供原 JS 使用，但不顯示 ===== */
.mode-selector-btn, .mode-panel { display: none !important; }

/* ===== Toast ===== */
.toast {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #08121f; padding: 10px 24px; border-radius: 999px;
    font-size: 14px; font-weight: 700; z-index: 2000; opacity: 0;
    transition: opacity .3s; pointer-events: none; max-width: 86vw;
}
.toast.show { opacity: 1; }

@keyframes pulse { 0% { opacity: 1; } 50% { opacity: .6; } 100% { opacity: 1; } }
@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

/* ===== 響應式 ===== */
@media (max-width: 900px) {
    .agent-cards-grid { grid-template-columns: 1fr; padding: 8px; gap: 8px; }
}
@media (max-width: 768px) {
    .top-nav { padding: 5px 8px; gap: 6px; }
    .nav-title { display: none; }
    .nav-tab { padding: 5px 10px; font-size: 12px; }
    .meeting-container { flex-direction: column; }
    .splitter { display: none !important; }
    .task-panel { flex: 1 1 auto; width: 100%; border-right: none; min-height: 0; }
    .task-panel.collapsed { flex: 0 0 auto; }
    .meeting-room { flex: 1 1 auto; min-height: 0; }
    .agent-card-output { max-height: none; }
    .agent-select-content { max-height: 22vh; }
    .task-input-area textarea { height: 58px; }
}


/* ===== 分頁：單欄時置中加寬，充分利用寬螢幕 ===== */
body[data-page="tasks"] .meeting-container { justify-content: center; }
body[data-page="tasks"] .task-panel { flex: 1 1 auto; max-width: 1040px; border-right: none; }
body[data-page="room"] .meeting-room { flex: 1 1 auto; }
.agent-select-content { max-height: 24vh; }

/* ===== 空狀態垂直居中，避免大片空洞 ===== */
.task-list .placeholder-text, .agent-cards-grid .placeholder-text { margin: auto 0; }
.task-panel-header h2 span, .meeting-header .title { white-space: nowrap; }
</style>

</div>

<!-- ===== 右下角模式選擇器 ===== -->
<button class="mode-selector-btn" id="modeBtn" title="切換模式">⚙</button>
<div class="mode-panel" id="modePanel">
    <button class="mode-item" data-mode="stretch">
        <span class="mode-icon">🧘</span> 伸展思考
        <span class="mode-badge">未上市</span>
    </button>
    <button class="mode-item" data-mode="fast">
        <span class="mode-icon">⚡</span> 快速模式
        <span class="mode-badge">未上市</span>
    </button>
    <button class="mode-item" data-mode="document">
        <span class="mode-icon">📄</span> 文件模式
        <span class="mode-badge">未上市</span>
    </button>
    <button class="mode-item active" data-mode="meeting">
        <span class="mode-icon">🏛️</span> 會議模式
        <span class="mode-badge">當前</span>
    </button>
    <button class="mode-item" data-mode="custom">
        <span class="mode-icon">🔮</span> ...模式
        <span class="mode-badge">敬請期待</span>
    </button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ==================== 全域狀態 ====================
const socket = io({ transports: ['polling'] });  // [P1-9 2026-10-04 稚] 只走 polling
let agentList = [];
let agentMeta = {};
let selectedAgents = new Set();
let tasks = [];
let taskIdCounter = 0;
let agentCardMap = {};  // agentName → cardId
let agentOutputs = {};  // cardId → accumulated text
let currentMode = 'meeting';

// ==================== DOM ====================
const $agentCheckboxes = document.getElementById('agentCheckboxes');
const $analyzerSelect = document.getElementById('analyzerSelect');
const $meetingInput = document.getElementById('meetingInput');
const $btnAnalyze = document.getElementById('btnAnalyze');
const $btnQuickDraft = document.getElementById('btnQuickDraft');
const $btnRunAll = document.getElementById('btnRunAll');
const $btnClearTasks = document.getElementById('btnClearTasks');
const $taskList = document.getElementById('taskList');
const $agentCardsGrid = document.getElementById('agentCardsGrid');
const $roomPlaceholder = document.getElementById('roomPlaceholder');
const $meetingStatus = document.getElementById('meetingStatus');
const $modeBtn = document.getElementById('modeBtn');
const $modePanel = document.getElementById('modePanel');
const $toast = document.getElementById('toast');
const $agentSelectArea = document.getElementById('agentSelectArea');

// ==================== Agent 選擇區摺疊 ====================
function toggleAgentSelect() {
    $agentSelectArea.classList.toggle('collapsed');
}
// 手機版預設摺疊 Agent 選擇區（節省空間，避免擠壓任務列表）
if (window.innerWidth <= 768) $agentSelectArea.classList.add('collapsed');

// ==================== 面板摺疊 ====================
function toggleTaskPanel() {
    const panel = document.getElementById("taskPanel");
    const room = document.getElementById("meetingRoom");
    const btn = panel.querySelector(".task-panel-header .collapse-btn");
    panel.classList.toggle("collapsed");
    if (panel.classList.contains("collapsed")) {
        btn.textContent = "▶";
        // 收合左側 → 中央會議室填滿
        room.style.flex = "1 1 0%";
    } else {
        btn.textContent = "◀";
        room.style.flex = "";
        // 若會議室已收合 → 左側面板填滿
        if (room.classList.contains("collapsed")) {
            panel.style.flex = "1 1 0%";
        }
    }
}

function toggleMeetingRoom() {
    const room = document.getElementById("meetingRoom");
    const panel = document.getElementById("taskPanel");
    const btn = room.querySelector(".meeting-header .collapse-btn");
    room.classList.toggle("collapsed");
    if (room.classList.contains("collapsed")) {
        btn.textContent = "▲";
        // 收合中央 → 左側面板填滿
        panel.style.flex = "1 1 0%";
    } else {
        btn.textContent = "▼";
        panel.style.flex = "";
        // 若左側面板已收合 → 中央會議室填滿
        if (panel.classList.contains("collapsed")) {
            room.style.flex = "1 1 0%";
        }
    }
}

// ==================== 卡片輸出摺疊 ====================
function toggleCardOutput(cardId) {
    const card = document.getElementById(cardId);
    if (card) card.classList.toggle('collapsed');
}
// ==================== Toast ====================
let toastTimer;
function showToast(msg, duration = 2000) {
    clearTimeout(toastTimer);
    $toast.textContent = msg;
    $toast.classList.add('show');
    toastTimer = setTimeout(() => $toast.classList.remove('show'), duration);
}

// ==================== 模式選擇器 ====================
$modeBtn.addEventListener('click', () => {
    $modePanel.classList.toggle('show');
    $modeBtn.classList.toggle('active');
});

document.querySelectorAll('.mode-item').forEach(item => {
    item.addEventListener('click', function() {
        const mode = this.dataset.mode;
        document.querySelectorAll('.mode-item').forEach(i => i.classList.remove('active'));
        this.classList.add('active');
        currentMode = mode;

        // 更新按鈕圖標
        const icons = { stretch: '🧘', fast: '⚡', document: '📄', meeting: '🏛️', custom: '🔮' };
        $modeBtn.textContent = icons[mode] || '⚙';

        if (mode === 'meeting') {
            showToast('🏛️ 已切換到會議模式');
        } else {
            showToast(`🔒 「${this.querySelector('.mode-icon').textContent} ${this.textContent.trim().split('\\n')[0]}」尚未開放`);
            // 恢復會議模式
            setTimeout(() => {
                document.querySelectorAll('.mode-item').forEach(i => i.classList.remove('active'));
                document.querySelector('.mode-item[data-mode="meeting"]').classList.add('active');
                $modeBtn.textContent = '🏛️';
                currentMode = 'meeting';
            }, 1500);
        }

        $modePanel.classList.remove('show');
        $modeBtn.classList.remove('active');
    });
});

// 點其他處關閉模式面板
document.addEventListener('click', (e) => {
    if (!$modePanel.contains(e.target) && e.target !== $modeBtn) {
        $modePanel.classList.remove('show');
        $modeBtn.classList.remove('active');
    }
});

// ==================== Socket 事件 ====================
socket.on('connect', () => {
    console.log('🔌 已連接');
    loadAgentList();
});

async function loadAgentList() {
    try {
        const res = await fetch('/api/env_files', { credentials: 'same-origin' });
        const data = await res.json();
        agentList = (data.agents || []).map(a => a.name || a);
        agentMeta = {};
        (data.agents || []).forEach(a => { agentMeta[a.name || a] = a; });
        renderAgentSelection();
    } catch(e) {
        console.error('載入 Agent 列表失敗', e);
        showToast('❌ 無法載入 Agent 列表');
    }
}

// 監聽心跳/狀態更新
socket.on('agent_state', (data) => {
    // data: { agent: '汐', state: 'idle'|'running'|... }
    if (data && data.agent && agentCardMap[data.agent]) {
        const cardId = agentCardMap[data.agent];
        const card = document.getElementById(cardId);
        if (card) {
            const statusEl = card.querySelector('.agent-status');
            if (statusEl) {
                if (data.state === 'running') statusEl.textContent = '🟡 運轉中';
                else if (data.state === 'idle') statusEl.textContent = '🟢 待命';
            }
        }
    }
});

// ==================== Agent 選擇 ====================
function renderAgentSelection() {
    // Agent 複選框
    $agentCheckboxes.innerHTML = agentList.map(a => {
        const cls = getAgentColorClass(a);
        const meta = agentMeta[a] || {};
        const postSuffix = meta.post ? ` <span style="font-size:10px;color:var(--dim)">${meta.post}</span>` : '';
        return `<label class="agent-chip ${cls}" data-agent="${a}">
            <span class="agent-dot"></span> ${a}${postSuffix}
        </label>`;
    }).join('');

    // 點擊切換
    $agentCheckboxes.querySelectorAll('.agent-chip').forEach(chip => {
        chip.addEventListener('click', () => {
            const agent = chip.dataset.agent;
            if (selectedAgents.has(agent)) {
                selectedAgents.delete(agent);
                chip.classList.remove('checked');
            } else {
                selectedAgents.add(agent);
                chip.classList.add('checked');
            }
            updateAnalyzerSelect();
            updateAgentCards();
        });
    });

    // 總指揮下拉
    updateAnalyzerSelect();
}

function getAgentColorClass(agent) {
    const lower = agent.toLowerCase();
    if (lower.includes('汐') || lower.includes('xi')) return 'spring';
    if (lower.includes('玥') || lower.includes('yue')) return 'yue';
    return '';
}

function updateAnalyzerSelect() {
    const agents = Array.from(selectedAgents);
    $analyzerSelect.innerHTML = agents.map(a => `<option value="${a}">${a}</option>`).join('');
    if (agents.length === 0) {
        $analyzerSelect.innerHTML = '<option value="">-- 請先選擇 Agent --</option>';
    }
}

function updateAgentCards() {
    const agents = Array.from(selectedAgents);

    if (agents.length === 0) {
        $agentCardsGrid.innerHTML = `
            <div class="placeholder-text" id="roomPlaceholder">
                <span class="icon">🏢</span>
                選擇左側 Agent 並分析分工<br>各 Agent 的輸出將在此即時顯示
            </div>`;
        return;
    }

    // 保留現有卡片（不重建，避免丟失輸出內容）
    const existingCards = {};
    $agentCardsGrid.querySelectorAll('.agent-card').forEach(card => {
        existingCards[card.dataset.agent] = card;
    });

    $agentCardsGrid.innerHTML = '';
    agents.forEach(agent => {
        const cardId = 'card-' + agent.replace(/[^a-zA-Z0-9\u4e00-\u9fff]/g, '_');
        agentCardMap[agent] = cardId;

        if (existingCards[agent]) {
            $agentCardsGrid.appendChild(existingCards[agent]);
        } else {
            const cls = getAgentColorClass(agent);
            const card = document.createElement('div');
            card.className = `agent-card ${cls}`;
            card.id = cardId;
            card.dataset.agent = agent;
            card.innerHTML = `
                <div class="agent-card-header">
                    <span class="agent-name">
                        <span class="agent-dot-card"></span> ${agent}
                    </span>
                    <span style="display:flex;align-items:center;gap:4px;">
                        <span class="agent-status idle">🟢 待命</span>
                        <span class="card-collapse-btn" onclick="event.stopPropagation();toggleCardOutput('${cardId}')" title="摺疊/展開">▼</span>
                    </span>
                </div>
                <div class="agent-card-output" id="${cardId}-output"></div>
            `;
            $agentCardsGrid.appendChild(card);
            agentOutputs[cardId] = '';
        }
    });

    if (agents.length > 0) {
        $meetingStatus.textContent = `🟢 ${agents.length} 位 Agent 待命中`;
    }
}

// ==================== 分析分工 ====================
$btnAnalyze.addEventListener('click', analyzeAndDispatch);
$btnQuickDraft.addEventListener('click', quickDispatch);

async function analyzeAndDispatch() {
    const input = $meetingInput.value.trim();
    if (!input) { showToast('⚠️ 請輸入會議總任務'); return; }
    if (selectedAgents.size === 0) { showToast('⚠️ 請至少選擇一位 Agent'); return; }

    const analyzer = $analyzerSelect.value;
    if (!analyzer) { showToast('⚠️ 請選擇總指揮 Agent'); return; }

    $btnAnalyze.disabled = true;
    $btnAnalyze.textContent = '⏳ 分析中…';
    $meetingStatus.textContent = '🧠 總 AI 分析分工中…';

    const agents = Array.from(selectedAgents);
    const agentsInfo = agents.map(a => { const meta = agentMeta[a] || {}; let info = a; if (meta.post || meta.desc) { info += `（`; if (meta.post) info += meta.post; if (meta.post && meta.desc) info += ` / `; if (meta.desc) info += meta.desc; info += `）`; } return info; }).join(`、`);
    const prompt = `【會議模式 - 總指揮分析分工】

你現在是總指揮 AI，負責分析以下總體任務，並將工作分配給團隊成員。

總體任務：
${input}

團隊成員（可分配）：${agentsInfo}

請分析這個任務，並輸出 JSON 格式的分工列表：
{
    "tasks": [
        {"agent": "${agents[0]}", "task": "具體任務描述", "priority": 1},
        {"agent": "${agents[1] || agents[0]}", "task": "具體任務描述", "priority": 2}
    ]
}

規則：
1. 每個 agent 至少分配一個任務
2. ⚠️ 嚴格根據每位成員的職能（括號內的職位描述）分配任務，任務必須與該成員的專業角色匹配
3. 任務要具體、可執行
4. priority 越小越優先
5. 只輸出 JSON，不要其他文字

請開始分析：`;

    let accumulated = '';
    let resolved = false;

    const handler = (data) => {
        if (resolved) return;
        if (data.type === 'reply') {
            accumulated += data.content;
        } else if (data.type === 'done') {
            resolved = true;
            socket.off('chat_stream', handler);
            parseAndCreateTasks(accumulated);
            $btnAnalyze.disabled = false;
            $btnAnalyze.textContent = '🧠 分析分工';
        }
    };
    socket.on('chat_stream', handler);

    socket.emit('chat_message', {
        agent: analyzer,
        message: prompt,
        user_id: (window.mokIdentity && window.mokIdentity()) || 'web_meeting',
        context_files: ['agent.md', 'user.md']  // 🔧 會議模式：agent.md + user.md（不含 soul.md）
    });

    setTimeout(() => {
        if (!resolved) {
            resolved = true;
            socket.off('chat_stream', handler);
            parseAndCreateTasks(accumulated);
            $btnAnalyze.disabled = false;
            $btnAnalyze.textContent = '🧠 分析分工';
        }
    }, 120000);
}

function quickDispatch() {
    const input = $meetingInput.value.trim();
    if (!input) { showToast('⚠️ 請輸入會議總任務'); return; }
    if (selectedAgents.size === 0) { showToast('⚠️ 請至少選擇一位 Agent'); return; }

    const agents = Array.from(selectedAgents);
    // 快速模式：直接分配，每人做同樣的任務
    tasks = agents.map((agent, i) => ({
        id: ++taskIdCounter,
        agent: agent,
        task: input,
        priority: i + 1,
        status: 'waiting',
        cardId: agentCardMap[agent]
    }));

    renderTaskList();
    $meetingStatus.textContent = `⚡ 快速分工：${tasks.length} 個任務`;
    $btnRunAll.disabled = false;
    showToast(`⚡ 已將任務直接派發給 ${agents.length} 位 Agent（並行執行）`);

    // 🔧 快速啟動：不經分析，直接將 meetingInput 內容派發給已選 Agent 並立即並行執行
    setTimeout(() => runAllTasks(), 100);
}

function parseAndCreateTasks(text) {
    console.log('分析回應:', text.substring(0, 300));

    // 嘗試提取 JSON
    let jsonStr = text;
    const jsonMatch = text.match(/\{[\s\S]*"tasks"[\s\S]*\}/);
    if (jsonMatch) jsonStr = jsonMatch[0];

    // 移除可能的 markdown 代碼塊
    jsonStr = jsonStr.replace(/```json\s*/g, '').replace(/```\s*/g, '').trim();

    try {
        const parsed = JSON.parse(jsonStr);
        if (parsed.tasks && Array.isArray(parsed.tasks)) {
            tasks = parsed.tasks.map((t, i) => ({
                id: ++taskIdCounter,
                agent: t.agent,
                task: t.task,
                priority: t.priority || i + 1,
                status: 'waiting',
                cardId: agentCardMap[t.agent] || null
            }));
        } else {
            throw new Error('無 tasks 陣列');
        }
    } catch (e) {
        console.warn('JSON 解析失敗，使用備用方案', e);
        // 備用：嘗試手動解析
        const agents = Array.from(selectedAgents);
        const agentTaskMap = {};
        agents.forEach(a => { agentTaskMap[a] = []; });

        // 嘗試按行解析
        const lines = text.split('\n');
        let currentAgent = null;
        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) return;
            // 檢測 agent 名稱
            for (const a of agents) {
                if (trimmed.includes(a)) {
                    currentAgent = a;
                    const taskText = trimmed.replace(new RegExp(`.*?${a}[：:]*\\s*`), '').trim();
                    if (taskText) agentTaskMap[a].push(taskText);
                    break;
                }
            }
        });

        tasks = [];
        agents.forEach(a => {
            const agentTasks = agentTaskMap[a];
            if (agentTasks.length > 0) {
                agentTasks.forEach(t => {
                    tasks.push({
                        id: ++taskIdCounter,
                        agent: a,
                        task: t,
                        priority: tasks.length + 1,
                        status: 'waiting',
                        cardId: agentCardMap[a] || null
                    });
                });
            } else {
                // 至少給一個預設任務
                tasks.push({
                    id: ++taskIdCounter,
                    agent: a,
                    task: `處理：${$meetingInput.value.trim().substring(0, 60)}...`,
                    priority: tasks.length + 1,
                    status: 'waiting',
                    cardId: agentCardMap[a] || null
                });
            }
        });
    }

    // 清理無效 cardId
    tasks.forEach(t => {
        if (!t.cardId) t.cardId = agentCardMap[t.agent];
    });

    renderTaskList();
    $meetingStatus.textContent = `📋 分析完成：${tasks.length} 個分工任務`;
    $btnRunAll.disabled = tasks.length === 0;
    $btnAnalyze.textContent = '🧠 分析分工';
    showToast(`✅ 總 AI 分析完成，共 ${tasks.length} 個任務`);
}

function renderTaskList() {
    if (tasks.length === 0) {
        $taskList.innerHTML = `
            <div class="placeholder-text">
                <span class="icon">🏛️</span>
                輸入總體任務<br>讓總 AI 分析並分工
            </div>`;
        $btnRunAll.disabled = true;
        return;
    }

    $taskList.innerHTML = tasks.map(t => {
        const cls = getAgentColorClass(t.agent);
        const statusText = t.status === 'running' ? '🟡 執行中' :
                          t.status === 'done' ? '✅ 完成' : '⏳ 等待';
        return `
            <div class="task-item ${t.status}" id="task-${t.id}">
                <div class="task-item-header">
                    <span class="task-agent-tag ${cls}">${t.agent}</span>
                    <span class="task-status">${statusText}</span>
                </div>
                <div class="task-desc">${escapeHtml(t.task)}</div>
            </div>`;
    }).join('');

    $btnRunAll.disabled = false;
}

// ==================== 全部並行執行（真正多工） ====================
$btnRunAll.addEventListener('click', runAllTasks);

let isExecuting = false;

function runAllTasks() {
    if (tasks.length === 0) { showToast('⚠️ 無任務可執行'); return; }

    // 清除舊輸出
    Object.keys(agentOutputs).forEach(k => { agentOutputs[k] = ''; });
    document.querySelectorAll('.agent-card-output').forEach(el => { el.textContent = ''; el.classList.remove('streaming-cursor'); });
    document.querySelectorAll('.agent-card').forEach(c => {
        c.classList.remove('running', 'done');
        const statusEl = c.querySelector('.agent-status');
        if (statusEl) { statusEl.textContent = '🟢 待命'; statusEl.className = 'agent-status idle'; }
    });

    // 收集所有待執行任務
    const pendingTasks = tasks.filter(t => t.status === 'waiting' || t.status === 'done').map(t => ({...t}));
    tasks.forEach(t => { if (t.status === 'done') t.status = 'waiting'; });
    if (pendingTasks.length === 0) { showToast('⚠️ 無待執行任務'); return; }

    isExecuting = true;
    $btnRunAll.disabled = true;
    $btnQuickDraft.disabled = true;
    $btnAnalyze.disabled = true;
    $meetingStatus.textContent = `🚀 ${pendingTasks.length} 個 Agent 同時並行執行中…`;
    showToast(`🚀 ${pendingTasks.length} 個 Agent 已同時派發（真正並行）`);

    // 🔧 真正並行：同時對所有任務 emit，各自完成即回調
    let completed = 0;
    pendingTasks.forEach(qt => {
        const task = tasks.find(t => t.id === qt.id);
        if (!task) { completed++; checkAllDone(); return; }
        runSingleTask(task, () => {
            completed++;
            checkAllDone();
        });
    });

    function checkAllDone() {
        $meetingStatus.textContent = `🚀 並行執行中… 已完成 ${completed}/${pendingTasks.length}`;
        if (completed >= pendingTasks.length) {
            isExecuting = false;
            $btnRunAll.disabled = false;
            $btnQuickDraft.disabled = false;
            $btnAnalyze.disabled = false;
            $meetingStatus.textContent = `✅ 全部完成 (${tasks.length} 個任務)`;
            showToast('🎉 所有 Agent 任務完成！');
        }
    }
}

// （已移除：原依序隊列執行，改為上方真正並行）

function runSingleTask(task, onComplete) {
    task.status = 'running';
    updateTaskUI(task);

    const card = document.getElementById(task.cardId);
    if (card) {
        card.classList.add('running');
        card.classList.remove('done');
        const statusEl = card.querySelector('.agent-status');
        if (statusEl) { statusEl.textContent = '🟡 執行中…'; statusEl.className = 'agent-status running'; }
        const output = card.querySelector('.agent-card-output');
        if (output) {
            output.textContent = '';
            output.classList.add('streaming-cursor');
        }
        // 滾動到該卡片
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    let accumulated = '';
    let resolved = false;

    const handler = (data) => {
        if (resolved) return;
        // 🔧 並行模式：只接收自己 agent 的 stream 事件（後端事件帶 data.agent）
        if (data.agent && data.agent !== task.agent) return;
        if (data.type === 'reply') {
            accumulated += data.content;
            const out = document.getElementById(task.cardId + '-output');
            if (out) {
                out.textContent = accumulated;
                out.classList.add('streaming-cursor');
                out.scrollTop = out.scrollHeight;
            }
        } else if (data.type === 'done') {
            resolved = true;
            socket.off('chat_stream', handler);
            task.status = 'done';
            updateTaskUI(task);

            const card2 = document.getElementById(task.cardId);
            if (card2) {
                card2.classList.remove('running');
                card2.classList.add('done');
                const statusEl2 = card2.querySelector('.agent-status');
                if (statusEl2) { statusEl2.textContent = '✅ 完成'; statusEl2.className = 'agent-status done'; }
                const out2 = document.getElementById(task.cardId + '-output');
                if (out2) {
                    out2.textContent = accumulated || '(無輸出)';
                    out2.classList.remove('streaming-cursor');
                }
            }

            if (onComplete) onComplete();
        }
    };

    socket.on('chat_stream', handler);

    socket.emit('chat_message', {
        agent: task.agent,
        message: task.task,
        user_id: (window.mokIdentity && window.mokIdentity()) || 'web_meeting',
        context_files: ['agent.md', 'user.md']  // 🔧 會議模式任務：agent.md + user.md
    });

    // 超時處理
    setTimeout(() => {
        if (!resolved) {
            resolved = true;
            socket.off('chat_stream', handler);
            task.status = 'done';
            updateTaskUI(task);
            const card3 = document.getElementById(task.cardId);
            if (card3) {
                card3.classList.remove('running');
                card3.classList.add('done');
                const out3 = document.getElementById(task.cardId + '-output');
                if (out3) {
                    out3.textContent = accumulated || '(超時)';
                    out3.classList.remove('streaming-cursor');
                }
            }
            if (onComplete) onComplete();
        }
    }, 300000);
}

function updateTaskUI(task) {
    const el = document.getElementById('task-' + task.id);
    if (!el) return;
    el.className = 'task-item ' + task.status;
    const statusEl = el.querySelector('.task-status');
    if (statusEl) {
        statusEl.textContent = task.status === 'running' ? '🟡 執行中' :
                               task.status === 'done' ? '✅ 完成' : '⏳ 等待';
    }
}

// ==================== 清除 ====================
$btnClearTasks.addEventListener('click', () => {
    tasks = [];
    renderTaskList();
    $meetingInput.value = '';
    Object.keys(agentOutputs).forEach(k => { agentOutputs[k] = ''; });
    document.querySelectorAll('.agent-card-output').forEach(el => { el.textContent = ''; el.classList.remove('streaming-cursor'); });
    document.querySelectorAll('.agent-card').forEach(c => {
        c.classList.remove('running', 'done');
        const s = c.querySelector('.agent-status');
        if (s) { s.textContent = '🟢 待命'; s.className = 'agent-status idle'; }
    });
    $meetingStatus.textContent = '🟢 待命中';
    $btnRunAll.disabled = true;
    showToast('🗑 已清除全部任務');
});

// ==================== 工具 ====================
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ==================== 鍵盤快捷鍵 ====================
document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'Enter') {
        e.preventDefault();
        analyzeAndDispatch();
    }
    if (e.ctrlKey && e.key === 'r') {
        e.preventDefault();
        runAllTasks();
    }
});

// ==================== 初始化 ====================
console.log('🏛️ 會議模式已就緒');
console.log('  Ctrl+Enter → 分析分工');
console.log('  Ctrl+R → 全部執行');
console.log('  右下角 ⚙ → 切換模式');
</script>

<script>
/* ===== 會議模式：分頁導航 + 頻道下拉 + 可拖曳分隔線 ===== */
(function () {
    var body = document.body;
    var tabs = Array.prototype.slice.call(document.querySelectorAll('.nav-tab'));
    var isMobile = function () { return window.matchMedia('(max-width: 768px)').matches; };

    function apply(page) {
        if (!page) { page = isMobile() ? 'tasks' : 'both'; }
        if (page === 'both' && isMobile()) { page = 'tasks'; }
        body.setAttribute('data-page', page);
        tabs.forEach(function (t) {
            t.classList.toggle('active', t.getAttribute('data-page') === page);
        });
        try { localStorage.setItem('meeting_page', page); } catch (e) {}
    }
    window.meetingSetPage = apply;
    tabs.forEach(function (t) {
        t.addEventListener('click', function () { apply(t.getAttribute('data-page')); });
    });
    var init = null;
    try { init = localStorage.getItem('meeting_page'); } catch (e) {}
    apply(init);
    window.addEventListener('resize', function () { apply(body.getAttribute('data-page')); });

    /* ---- 頻道下拉 ---- */
    var cBtn = document.getElementById('channelBtn');
    var cDd = document.getElementById('channelDropdown');
    if (cBtn && cDd) {
        cBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            var open = cDd.classList.toggle('show');
            cBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
        document.addEventListener('click', function (e) {
            if (!cDd.classList.contains('show')) { return; }
            if (cDd.contains(e.target) || cBtn.contains(e.target)) { return; }
            cDd.classList.remove('show');
            cBtn.setAttribute('aria-expanded', 'false');
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                cDd.classList.remove('show');
                cBtn.setAttribute('aria-expanded', 'false');
            }
        });
    }

    /* ---- 分隔線拖曳調整寬度 ---- */
    var sp = document.getElementById('splitter');
    var wrap = document.querySelector('.meeting-container');
    if (sp && wrap) {
        var dragging = false;
        function resize(clientX) {
            var r = wrap.getBoundingClientRect();
            var w = clientX - r.left;
            w = Math.max(220, Math.min(w, r.width * 0.75));
            wrap.style.setProperty('--pnl-w', w + 'px');
        }
        sp.addEventListener('mousedown', function (e) {
            dragging = true; e.preventDefault(); document.body.style.cursor = 'col-resize';
        });
        window.addEventListener('mousemove', function (e) { if (dragging) { resize(e.clientX); } });
        window.addEventListener('mouseup', function () { dragging = false; document.body.style.cursor = ''; });
        sp.addEventListener('touchstart', function () { dragging = true; }, { passive: true });
        window.addEventListener('touchmove', function (e) {
            if (dragging && e.touches[0]) { resize(e.touches[0].clientX); }
        }, { passive: true });
        window.addEventListener('touchend', function () { dragging = false; });
    }
})();

</script>
<script src="/static/p0_meeting.js"></script>
