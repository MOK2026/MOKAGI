<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>會議模式 — mokagi</title>
<script src="/static/vendor/socket.io.min.js"></script>
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<link rel="stylesheet" href="/static/vendor/github-dark.min.css">
<script src="/static/vendor/highlight.min.js"></script>
<script src="/static/header_member.js" defer></script>
<style>
:root {
  --bg: #0d1117; --panel: #161b22; --panel2: #1c2128; --border: #30363d;
  --accent: #58a6ff; --accent2: #3fb950; --accent3: #d2991d; --danger: #f85149;
  --text: #e6edf3; --dim: #8b949e; --pink: #ff7b9c; --violet: #d2a8ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text); overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  display: flex; flex-direction: column; height: 100vh; height: 100dvh;
}
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #30363d; border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: #484f58; }

/* ============ 頂欄 ============ */
.topbar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
  padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
  z-index: 50;
}
.topbar .logo { font-size: 15px; font-weight: 800; color: var(--accent); white-space: nowrap; }
.topbar .member { font-size: 12px; color: var(--dim); }
.topbar .spacer { flex: 1; }
.topbar .stat {
  font-size: 12px; color: var(--dim); background: #0d1117; border: 1px solid var(--border);
  padding: 4px 11px; border-radius: 999px; white-space: nowrap;
}
.topbar .stat b { color: var(--text); }
.topbar .icon-btn {
  background: var(--border); border: none; color: var(--text); padding: 6px 12px;
  border-radius: 8px; cursor: pointer; font-size: 13px; transition: all .18s; font-family: inherit;
}
.topbar .icon-btn:hover { background: var(--accent); color: #08121f; }

/* ============ 三欄佈局 ============ */
.layout { flex: 1 1 auto; display: flex; min-height: 0; overflow: hidden; }
.panel { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.panel-left { flex: 0 0 var(--w-left, 322px); border-right: 1px solid var(--border); }
.panel-center { flex: 1 1 auto; background: var(--bg); min-width: 0; }
.panel-right { flex: 0 0 var(--w-right, 340px); border-left: 1px solid var(--border); }
.splitter { flex: 0 0 5px; cursor: col-resize; background: transparent; position: relative; }
.splitter::after {
  content: ''; position: absolute; top: 0; bottom: 0; left: 2px; width: 1px; background: var(--border);
}
.splitter:hover::after, .splitter.active::after { background: var(--accent); width: 2px; }

.panel-head {
  flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--panel2);
}
.panel-head h2 { font-size: 13.5px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.panel-head .hint { font-size: 11px; color: var(--dim); margin-left: auto; }

/* ============ 左欄：agent 名片 ============ */
.agent-search { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.agent-search input {
  width: 100%; background: #0d1117; border: 1px solid var(--border); color: var(--text);
  padding: 8px 12px; border-radius: 8px; font-size: 13px; outline: none; font-family: inherit;
}
.agent-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,.12); }

.agent-list { flex: 1 1 auto; overflow-y: auto; padding: 10px; }
.agent-card {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; margin-bottom: 7px;
  background: var(--panel2); border: 1px solid var(--border); border-radius: 10px;
  cursor: pointer; transition: all .15s; position: relative;
}
.agent-card:hover { border-color: #484f58; background: #21262d; }
.agent-card.selected { border-color: var(--accent); background: rgba(88,166,255,.08); box-shadow: 0 0 0 2px rgba(88,166,255,.15); }
.agent-avatar {
  flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 20px; background: var(--avatar-bg, #30363d);
  border: 1px solid var(--border);
}
.agent-info { flex: 1 1 auto; min-width: 0; }
.agent-info .name { font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.agent-info .name .name-text { overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
.agent-info .name .post { flex: 0 0 auto; }
.agent-info .name .post {
  font-size: 10.5px; font-weight: 500; color: var(--accent2); background: rgba(63,185,80,.12);
  padding: 1px 7px; border-radius: 999px; white-space: nowrap;
}
.agent-info .desc { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.agent-status-dot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: #484f58; margin-right: 2px; }
.agent-status-dot.running { background: var(--accent3); box-shadow: 0 0 6px var(--accent3); animation: pulse 1.2s infinite; }
.agent-status-dot.idle { background: #484f58; }
.agent-card .check {
  flex: 0 0 auto; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center; font-size: 12px; color: transparent; transition: all .15s;
}
.agent-card.selected .check { background: var(--accent); border-color: var(--accent); color: #08121f; }

.agent-footer { flex: 0 0 auto; padding: 10px 12px; border-top: 1px solid var(--border); background: var(--panel2); }
.agent-footer .sel-count { font-size: 12px; color: var(--dim); margin-bottom: 8px; }
.agent-footer .sel-count b { color: var(--accent); }
.agent-footer label { font-size: 12px; color: var(--dim); display: block; margin-bottom: 4px; }
.agent-footer select {
  width: 100%; background: #0d1117; border: 1px solid var(--border); color: var(--text);
  padding: 8px 10px; border-radius: 8px; font-size: 13px; outline: none; font-family: inherit;
}
.agent-footer select:focus { border-color: var(--accent); }

/* ============ 中欄：對話框 ============ */
.chat-head {
  flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--panel);
}
.chat-head .title { font-size: 14px; font-weight: 700; }
.chat-head .status { font-size: 12px; color: var(--dim); background: #0d1117; border: 1px solid var(--border); padding: 3px 10px; border-radius: 999px; }
.chat-head .participants { display: flex; gap: -6px; margin-left: auto; align-items: center; }
.chat-head .participants .p-avatar {
  width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 13px; border: 2px solid var(--panel); margin-left: -7px;
  background: var(--avatar-bg, #30363d);
}
.chat-head .participants .p-avatar:first-child { margin-left: 0; }

.chat-body { flex: 1 1 auto; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.chat-empty {
  margin: auto; text-align: center; color: var(--dim); font-size: 14px; line-height: 2.2; max-width: 460px;
}
.chat-empty .icon { font-size: 52px; display: block; margin-bottom: 12px; opacity: .8; }

.msg { display: flex; flex-direction: column; max-width: 78%; animation: fadeUp .25s ease; }
.msg.sys { align-self: center; max-width: 90%; text-align: center; }
.msg.sys .sys-pill {
  display: inline-block; background: var(--panel); border: 1px solid var(--border); color: var(--dim);
  padding: 4px 14px; border-radius: 999px; font-size: 11.5px; margin: 0 auto;
}
.msg .msg-head { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; }
.msg .msg-head .who { font-size: 12px; font-weight: 700; }
.msg .msg-head .when { font-size: 10.5px; color: var(--dim); }
.msg .bubble {
  padding: 10px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.65;
  word-break: break-word; white-space: pre-wrap;
}
.msg.agent { align-self: flex-start; }
.msg.agent .bubble { background: var(--panel2); border: 1px solid var(--border); border-top-left-radius: 4px; }
.msg.agent .msg-head { flex-direction: row; }
.msg.user { align-self: flex-end; }
.msg.user .msg-head { flex-direction: row-reverse; }
.msg.user .bubble { background: var(--accent); color: #08121f; border-top-right-radius: 4px; }
.msg .bubble.markdown { background: var(--panel2); border: 1px solid var(--border); }
.msg .bubble.markdown pre { background: #0d1117; border: 1px solid var(--border); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 11.5px; }
.msg .bubble.markdown code { font-family: 'Cascadia Code', monospace; font-size: 12px; }
.msg .bubble.markdown h1,.msg .bubble.markdown h2,.msg .bubble.markdown h3 { margin: 8px 0 4px; font-size: 14px; }
.msg .bubble.markdown ul,.msg .bubble.markdown ol { padding-left: 20px; margin: 4px 0; }
.msg .bubble.markdown p { margin: 4px 0; }
.msg .bubble.markdown table { border-collapse: collapse; margin: 6px 0; }
.msg .bubble.markdown th,.msg .bubble.markdown td { border: 1px solid var(--border); padding: 4px 8px; font-size: 12px; }
.stream-cursor { display: inline-block; width: 7px; height: 14px; background: var(--accent); animation: blink .8s infinite; vertical-align: text-bottom; }

/* ============ 輸入區 ============ */
.chat-input { flex: 0 0 auto; padding: 10px 14px 14px; background: var(--panel); border-top: 1px solid var(--border); }
.action-row { display: flex; gap: 8px; margin-bottom: 10px; }
.action-btn {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); cursor: pointer;
  font-size: 13.5px; font-weight: 700; font-family: inherit; transition: all .18s; color: var(--text); background: var(--panel2);
}
.action-btn:hover { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,.1); }
.action-btn.primary { background: var(--accent); border-color: var(--accent); color: #08121f; }
.action-btn.primary:hover { filter: brightness(1.08); }
.action-btn.secondary { background: rgba(210,168,255,.1); border-color: var(--violet); color: var(--violet); }
.action-btn.secondary:hover { background: rgba(210,168,255,.2); }
.action-btn:disabled { opacity: .45; cursor: not-allowed; }
.action-btn .sub { font-size: 10px; font-weight: 400; opacity: .75; display: block; }
.input-row { display: flex; gap: 8px; align-items: flex-end; }
.input-row textarea {
  flex: 1; background: #0d1117; border: 1px solid var(--border); color: var(--text);
  padding: 11px 13px; border-radius: 12px; font-size: 13.5px; resize: none; min-height: 46px;
  max-height: 140px; outline: none; font-family: inherit; line-height: 1.5;
}
.input-row textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,.12); }
.input-row .send-btn {
  flex: 0 0 auto; background: var(--accent); border: none; color: #08121f; font-size: 18px;
  width: 46px; height: 46px; border-radius: 12px; cursor: pointer; transition: all .18s;
}
.input-row .send-btn:hover { filter: brightness(1.1); }
.input-row .send-btn:disabled { opacity: .4; cursor: not-allowed; }

/* ============ 右欄：報告 ============ */
.report-list { flex: 1 1 auto; overflow-y: auto; padding: 10px; }
.report-empty { margin: auto; text-align: center; color: var(--dim); font-size: 13px; line-height: 2; padding: 30px 16px; }
.report-empty .icon { font-size: 44px; display: block; margin-bottom: 10px; opacity: .7; }
.report-card { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; background: var(--panel2); overflow: hidden; }
.report-card .rc-head {
  display: flex; align-items: center; gap: 9px; padding: 9px 11px; cursor: pointer; transition: background .15s;
}
.report-card .rc-head:hover { background: #21262d; }
.report-card .rc-head .avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; background: var(--avatar-bg, #30363d); }
.report-card .rc-head .meta { flex: 1; min-width: 0; }
.report-card .rc-head .meta .name { font-size: 12.5px; font-weight: 700; }
.report-card .rc-head .meta .when { font-size: 10.5px; color: var(--dim); }
.report-card .rc-head .arrow { color: var(--dim); font-size: 11px; transition: transform .2s; }
.report-card.open .rc-head .arrow { transform: rotate(90deg); }
.report-card .rc-body { display: none; padding: 10px 12px; border-top: 1px solid var(--border); max-height: 52vh; overflow-y: auto; font-size: 12.5px; line-height: 1.6; }
.report-card.open .rc-body { display: block; }
.report-card .rc-body pre { background: #0d1117; border: 1px solid var(--border); border-radius: 8px; padding: 9px; overflow-x: auto; font-size: 11px; }
.report-card .rc-body code { font-family: 'Cascadia Code', monospace; font-size: 11.5px; }
.report-card .rc-body h1,.report-card .rc-body h2,.report-card .rc-body h3 { margin: 8px 0 4px; font-size: 13px; }
.report-card .rc-body ul,.report-card .rc-body ol { padding-left: 18px; margin: 4px 0; }
.report-card .rc-body p { margin: 4px 0; }

/* ============ Toast ============ */
.toast {
  position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%);
  background: var(--accent); color: #08121f; padding: 11px 26px; border-radius: 999px;
  font-size: 14px; font-weight: 700; z-index: 999; opacity: 0; transition: opacity .3s;
  pointer-events: none; max-width: 86vw; box-shadow: 0 8px 30px rgba(0,0,0,.5);
}
.toast.show { opacity: 1; }

@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ============ 響應式 ============ */
@media (max-width: 900px) {
  .layout { flex-direction: column; }
  .panel-left { flex: 0 0 34vh; border-right: none; border-bottom: 1px solid var(--border); }
  .panel-right { flex: 0 0 32vh; border-left: none; border-top: 1px solid var(--border); }
  .splitter { display: none; }
  .msg { max-width: 92%; }
}
</style>
</head>
<body>
<!-- ===== 頂欄 ===== -->
<header class="topbar">
  <span class="logo">🏛️ 會議模式</span>
  <span class="member" id="headerMemberName">載入中…</span>
  <span class="spacer"></span>
  <span class="stat">👥 已選 <b id="statSel">0</b> 位</span>
  <span class="stat" id="statStatus">🟢 待命</span>
  <button class="icon-btn" onclick="location.href='/'" title="回主控台">🏠 主控台</button>
  <button class="icon-btn" onclick="clearAll()" title="清空會議">🗑 清空</button>
</header>

<!-- ===== 三欄佈局 ===== -->
<main class="layout">

  <!-- 左欄：Agent 名片 -->
  <aside class="panel panel-left" id="panelLeft">
    <div class="panel-head"><h2>👥 參與會議的 Agent</h2><span class="hint" id="agentCount"></span></div>
    <div class="agent-search"><input id="agentSearch" type="text" placeholder="🔍 搜尋 Agent（名稱／職位／描述）…"></div>
    <div class="agent-list" id="agentList"></div>
    <div class="agent-footer">
      <div class="sel-count">已勾選 <b id="selCount">0</b> 位參與者</div>
      <label>🧠 總指揮（分析並指派）</label>
      <select id="commanderSelect"><option value="">-- 選擇總指揮 --</option></select>
    </div>
  </aside>

  <div class="splitter" id="splitL"></div>

  <!-- 中欄：對話框 -->
  <section class="panel panel-center" id="panelCenter">
    <div class="chat-head">
      <span class="title">📋 會議進行中</span>
      <span class="status" id="chatStatus">🟢 待命</span>
      <div class="participants" id="participants"></div>
    </div>
    <div class="chat-body" id="chatBody">
      <div class="chat-empty" id="chatEmpty">
        <span class="icon">🏛️</span>
        <b>開始一場多 Agent 會議</b><br>
        ① 在左側勾選參與的 Agent（可搜尋）<br>
        ② 選擇「總指揮」或直接並行<br>
        ③ 在下方輸入總任務，點擊派發
      </div>
    </div>
    <div class="chat-input">
      <div class="action-row">
        <button class="action-btn secondary" id="btnParallel" title="所有已選 Agent 直接做同一件事，同時並行">
          ⚡ 並行同一工作 <span class="sub">全部 Agent 一起做</span>
        </button>
        <button class="action-btn primary" id="btnCommander" title="由總指揮分析任務，自動拆解並指派給各 Agent">
          🧠 總指揮分析並指派 <span class="sub">先分析、再分工</span>
        </button>
      </div>
      <div class="input-row">
        <textarea id="taskInput" rows="1" placeholder="輸入會議總任務…&#10;例：建立一個電商網站，包含首頁、商品頁、購物車、結帳流程"></textarea>
        <button class="send-btn" id="btnSend" title="送出（Shift+Enter）">➤</button>
      </div>
    </div>
  </section>

  <div class="splitter" id="splitR"></div>

  <!-- 右欄：報告 -->
  <aside class="panel panel-right" id="panelRight">
    <div class="panel-head">
      <h2>📑 各 Agent 報告</h2>
      <span class="hint" id="reportHint"></span>
      <button class="icon-btn" onclick="exportReports()" title="匯出全部報告為 Markdown" style="margin-left:auto;">⬇ 匯出</button>
    </div>
    <div class="report-list" id="reportList">
      <div class="report-empty"><span class="icon">📄</span>暫無報告<br>執行會議後，各 Agent 產出將歸檔於此</div>
    </div>
  </aside>

</main>

<div class="toast" id="toast"></div>

<script>
'use strict';
// ==================== 全域狀態 ====================
const socket = io({ transports: ['polling'] });
let agentList = [];            // [{name, icon, post, desc, tags, is_running}]
let selectedAgents = new Set();
let tasks = [];                // [{id, agent, task, status}]
let reports = {};              // agent -> {output, ts}
let activeStreams = {};        // agent -> {bubble, acc}
let taskIdCounter = 0;
let isBusy = false;

// ==================== DOM ====================
const $ = id => document.getElementById(id);
const $agentList = $('agentList'), $agentSearch = $('agentSearch'),
      $commander = $('commanderSelect'), $chatBody = $('chatBody'),
      $taskInput = $('taskInput'), $reportList = $('reportList'),
      $participants = $('participants'), $chatStatus = $('chatStatus'),
      $statStatus = $('statStatus'), $toast = $('toast');

// ==================== 工具 ====================
function esc(t) { const d = document.createElement('div'); d.textContent = (t == null ? '' : String(t)); return d.innerHTML; }
function hashHue(str) { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0; return h % 360; }
function avatarBg(name) { return `hsl(${hashHue(name)}, 62%, 42%)`; }
function nowTime() { const d = new Date(); return d.toTimeString().slice(0,5); }
function showToast(msg) { $toast.textContent = msg; $toast.classList.add('show'); setTimeout(() => $toast.classList.remove('show'), 2600); }

function mdRender(text) {
  if (window.marked && window.DOMPurify) {
    try { return window.DOMPurify.sanitize(window.marked.parse(String(text||''), {gfm:true, breaks:true}), {USE_PROFILES:{html:true}}); }
    catch(e) { /* fallthrough */ }
  }
  return esc(text).replace(/\n/g, '<br>');
}

// ==================== Socket ====================
socket.on('connect', () => { loadAgents(); });
socket.on('agent_state', (data) => {
  if (data && data.agent) {
    const card = document.querySelector(`.agent-card[data-agent="${CSS.escape(data.agent)}"]`);
    if (card) {
      const dot = card.querySelector('.agent-status-dot');
      if (dot) dot.className = 'agent-status-dot ' + (data.state === 'running' ? 'running' : 'idle');
    }
  }
});

// ==================== 載入 Agent ====================
async function loadAgents() {
  try {
    const res = await fetch('/api/env_files', { credentials: 'same-origin' });
    const data = await res.json();
    agentList = (data.agents || []).map(a => ({ name: a.name, icon: a.icon || '🌸', post: a.post || '', desc: a.desc || '', tags: a.tags || '', is_running: a.is_running || false }));
    renderAgentList();
  } catch(e) {
    console.error('載入 Agent 失敗', e);
    showToast('❌ 無法載入 Agent 列表');
  }
}

// ==================== 渲染左欄名片 ====================
function renderAgentList() {
  const q = $agentSearch.value.trim().toLowerCase();
  const filtered = agentList.filter(a => {
    if (!q) return true;
    return (a.name + ' ' + a.post + ' ' + a.desc + ' ' + a.tags).toLowerCase().includes(q);
  });
  $('agentCount').textContent = `${filtered.length}/${agentList.length}`;

  $agentList.innerHTML = filtered.map(a => {
    const sel = selectedAgents.has(a.name) ? 'selected' : '';
    const dot = a.is_running ? 'running' : 'idle';
    return `<div class="agent-card ${sel}" data-agent="${esc(a.name)}">
      <div class="agent-avatar" style="--avatar-bg:${avatarBg(a.name)}">${esc(a.icon)}</div>
      <div class="agent-info">
        <div class="name"><span class="name-text">${esc(a.name)}</span>${a.post ? `<span class="post">${esc(a.post)}</span>` : ''}</div>
        <div class="desc">${esc(a.desc)}</div>
      </div>
      <span class="agent-status-dot ${dot}" title="${a.is_running ? '執行中' : '待命'}"></span>
      <span class="check">✓</span>
    </div>`;
  }).join('') || '<div class="report-empty">沒有符合條件的 Agent</div>';

  $agentList.querySelectorAll('.agent-card').forEach(card => {
    card.addEventListener('click', () => toggleAgent(card.dataset.agent));
  });
}

function toggleAgent(name) {
  if (selectedAgents.has(name)) selectedAgents.delete(name);
  else selectedAgents.add(name);
  renderAgentList();
  updateParticipants();
  updateCommander();
  updateStats();
}

function updateParticipants() {
  const arr = Array.from(selectedAgents);
  $participants.innerHTML = arr.slice(0, 12).map(n => {
    const a = agentList.find(x => x.name === n);
    return `<span class="p-avatar" style="--avatar-bg:${avatarBg(n)}" title="${esc(n)}">${esc(a ? a.icon : '🌸')}</span>`;
  }).join('') + (arr.length > 12 ? `<span class="p-avatar" style="background:var(--panel2)">+${arr.length-12}</span>` : '');
}

function updateCommander() {
  const arr = Array.from(selectedAgents);
  const prev = $commander.value;
  $commander.innerHTML = '<option value="">-- 選擇總指揮 --</option>' + arr.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
  if (arr.includes(prev)) $commander.value = prev;
}

function updateStats() {
  $('statSel').textContent = selectedAgents.size;
  $('selCount').textContent = selectedAgents.size;
}

// ==================== 搜尋 ====================
$agentSearch.addEventListener('input', renderAgentList);

// ==================== 對話框訊息 ====================
function addSysMsg(text) {
  const el = document.createElement('div');
  el.className = 'msg sys';
  el.innerHTML = `<span class="sys-pill">${esc(text)}</span>`;
  $chatBody.appendChild(el);
  scrollChat();
}
function addUserMsg(text) {
  const el = document.createElement('div');
  el.className = 'msg user';
  el.innerHTML = `<div class="msg-head"><span class="who">你</span><span class="when">${nowTime()}</span></div><div class="bubble">${esc(text)}</div>`;
  $chatBody.appendChild(el);
  scrollChat();
}
function addAgentMsg(agent, text, opts) {
  opts = opts || {};
  const a = agentList.find(x => x.name === agent);
  const el = document.createElement('div');
  el.className = 'msg agent';
  el.dataset.agent = agent;
  const renderText = opts.markdown ? mdRender(text) : esc(text);
  el.innerHTML = `<div class="msg-head"><span class="who" style="color:${avatarBg(agent)}">${esc(a ? a.icon : '🌸')} ${esc(agent)}</span><span class="when">${nowTime()}</span></div><div class="bubble ${opts.markdown ? 'markdown' : ''}">${renderText}</div>`;
  $chatBody.appendChild(el);
  scrollChat();
  return el.querySelector('.bubble');
}

function scrollChat() {
  $chatBody.scrollTop = $chatBody.scrollHeight;
}

// ==================== 派發：並行同一工作 ====================
function parallelDispatch() {
  const input = $taskInput.value.trim();
  if (!input) { showToast('⚠️ 請輸入會議任務'); return; }
  if (selectedAgents.size === 0) { showToast('⚠️ 請先在左側勾選 Agent'); return; }
  if (isBusy) { showToast('⏳ 會議進行中，請稍候'); return; }

  const agents = Array.from(selectedAgents);
  tasks = agents.map((agent, i) => ({ id: ++taskIdCounter, agent, task: input, priority: i + 1, status: 'waiting' }));

  hideEmpty();
  addSysMsg(`⚡ 並行模式：將同一任務派發給 ${agents.length} 位 Agent 同時執行`);
  addUserMsg(input);
  setBusy(true, `🚀 ${agents.length} 位 Agent 並行執行中…`);
  runAllTasks();
}

// ==================== 派發：總指揮分析並指派 ====================
async function commanderDispatch() {
  const input = $taskInput.value.trim();
  if (!input) { showToast('⚠️ 請輸入會議任務'); return; }
  if (selectedAgents.size === 0) { showToast('⚠️ 請先在左側勾選 Agent'); return; }
  const commander = $commander.value;
  if (!commander) { showToast('⚠️ 請選擇總指揮 Agent'); return; }
  if (isBusy) { showToast('⏳ 會議進行中，請稍候'); return; }

  const agents = Array.from(selectedAgents);
  const agentsInfo = agents.map(a => {
    const meta = agentList.find(x => x.name === a) || {};
    let info = a;
    if (meta.post || meta.desc) info += `（${[meta.post, meta.desc].filter(Boolean).join(' / ')}）`;
    return info;
  }).join('、');

  const prompt = `【會議模式 - 總指揮分析分工】\n\n你現在是總指揮 AI，負責分析以下總體任務，並將工作分配給團隊成員。\n\n總體任務：\n${input}\n\n團隊成員（可分配）：${agentsInfo}\n\n請分析這個任務，並輸出 JSON 格式的分工列表：\n{\n    "tasks": [\n        {"agent": "${agents[0]}", "task": "具體任務描述", "priority": 1},\n        {"agent": "${agents[1] || agents[0]}", "task": "具體任務描述", "priority": 2}\n    ]\n}\n\n規則：\n1. 每個 agent 至少分配一個任務\n2. ⚠️ 嚴格根據每位成員的職能（括號內的職位描述）分配任務，任務必須與該成員的專業角色匹配\n3. 任務要具體、可執行\n4. priority 越小越優先\n5. 只輸出 JSON，不要其他文字\n\n請開始分析：`;

  hideEmpty();
  addSysMsg(`🧠 總指揮 ${commander} 分析分工中…`);
  addUserMsg(input);
  setBusy(true, '🧠 總指揮分析中…');

  const acc = await requestAgent(commander, prompt, null, 120000);
  parseAndCreateTasks(acc);
}

function parseAndCreateTasks(text) {
  let jsonStr = String(text || '');
  jsonStr = jsonStr.replace(/```json\s*/g, '').replace(/```\s*/g, '').trim();
  try {
    const parsed = JSON.parse(jsonStr);
    if (parsed.tasks && Array.isArray(parsed.tasks)) {
      tasks = parsed.tasks.map((t, i) => ({ id: ++taskIdCounter, agent: t.agent, task: t.task, priority: t.priority || i + 1, status: 'waiting' }));
    } else throw new Error('no tasks');
  } catch(e) {
    console.warn('JSON 解析失敗，改用並行備援', e);
    const agents = Array.from(selectedAgents);
    tasks = agents.map((a, i) => ({ id: ++taskIdCounter, agent: a, task: $taskInput.value.trim(), priority: i + 1, status: 'waiting' }));
    addSysMsg('⚠️ 分工解析失敗，改為全部並行同一任務');
  }
  // 過濾未選中/無效 agent
  tasks = tasks.filter(t => selectedAgents.has(t.agent));
  if (tasks.length === 0) { setBusy(false, '🟢 待命'); showToast('⚠️ 分工結果無有效 Agent'); return; }

  addSysMsg(`📋 分析完成，共 ${tasks.length} 個分工任務：`);
  tasks.forEach(t => addSysMsg(`　→ ${t.agent}：${t.task.slice(0, 50)}${t.task.length > 50 ? '…' : ''}`));
  setBusy(true, `🚀 ${tasks.length} 個任務並行執行中…`);
  runAllTasks();
}

// ==================== 請求單個 Agent（Promise 化） ====================
function requestAgent(agent, message, bubble, timeoutMs) {
  return new Promise((resolve) => {
    let acc = '';
    let resolved = false;
    const handler = (data) => {
      if (resolved) return;
      if (data.agent && data.agent !== agent) return;
      if (data.type === 'reply') {
        acc += data.content || '';
        if (bubble) { bubble.innerHTML = mdRender(acc) + '<span class="stream-cursor"></span>'; scrollChat(); }
      } else if (data.type === 'done') {
        resolved = true; socket.off('chat_stream', handler);
        if (bubble) { bubble.innerHTML = mdRender(acc); }
        resolve(acc);
      }
    };
    socket.on('chat_stream', handler);
    socket.emit('chat_message', {
      agent, message, user_id: (window.mokIdentity && window.mokIdentity()) || 'web_meeting',
      context_files: ['agent.md', 'user.md']
    });
    setTimeout(() => { if (!resolved) { resolved = true; socket.off('chat_stream', handler); if (bubble) bubble.innerHTML = mdRender(acc) + ' <i style="color:var(--dim)">(逾時)</i>'; resolve(acc); } }, timeoutMs || 300000);
  });
}

// ==================== 並行執行全部任務 ====================
// [2026-10-18 靜｜真並行修正] engineio 對「同一個 polling payload」有寫死的
// max_decode_packets = 16（engineio/payload.py），超過就整批 raise
// ValueError: Too many packets in payload → 19 位同時 emit 會被「全部丟棄」，
// 症狀就是「只有第一個女有輸出、其他都在等閃爍游標」。
// 解法：送出時分批（每批 6 個，間隔 120ms），讓每批落在不同的 polling POST，
// 後端仍然是同時在跑（各 agent 各自 gate），只是不再撞 16 上限。
const SEND_BATCH = 6;
const SEND_GAP_MS = 120;

function runAllTasks() {
  if (tasks.length === 0) { showToast('⚠️ 無任務'); setBusy(false, '🟢 待命'); return; }
  let completed = 0;
  (async () => {
    for (let i = 0; i < tasks.length; i++) {
      runSingleTask(tasks[i], () => {
        completed++;
        $statStatus.textContent = `🚀 執行中 ${completed}/${tasks.length}`;
        $chatStatus.textContent = `🚀 執行中 ${completed}/${tasks.length}`;
        if (completed >= tasks.length) {
          setBusy(false, '✅ 全部完成');
          $statStatus.textContent = '✅ 全部完成';
          addSysMsg('🎉 所有 Agent 任務完成，報告已歸檔至右側');
          renderReports();
        }
      });
      if ((i + 1) % SEND_BATCH === 0 && i + 1 < tasks.length) {
        await new Promise(r => setTimeout(r, SEND_GAP_MS));
      }
    }
  })();
}

function runSingleTask(task, onComplete) {
  task.status = 'running';
  const bubble = addAgentMsg(task.agent, '…');
  activeStreams[task.agent] = { bubble, acc: '' };

  requestAgent(task.agent, task.task, bubble).then((acc) => {
    task.status = 'done';
    reports[task.agent] = { output: acc, ts: Date.now() };
    if (onComplete) onComplete();
  });
}

// ==================== 忙碌狀態 ====================
function setBusy(busy, statusText) {
  isBusy = busy;
  $('btnParallel').disabled = busy;
  $('btnCommander').disabled = busy;
  $('btnSend').disabled = busy;
  if (statusText) { $statStatus.textContent = statusText; $chatStatus.textContent = statusText; }
}

function hideEmpty() {
  const e = $('chatEmpty');
  if (e) e.remove();
}

// ==================== 報告 ====================
function renderReports() {
  const keys = Object.keys(reports);
  $('reportHint').textContent = keys.length ? `${keys.length} 份` : '';
  if (keys.length === 0) {
    $reportList.innerHTML = '<div class="report-empty"><span class="icon">📄</span>暫無報告<br>執行會議後，各 Agent 產出將歸檔於此</div>';
    return;
  }
  $reportList.innerHTML = keys.map(agent => {
    const a = agentList.find(x => x.name === agent);
    const r = reports[agent];
    const when = new Date(r.ts).toTimeString().slice(0,5);
    const preview = (r.output || '').replace(/[#*`>\-\[\]]/g, '').slice(0, 60);
    return `<div class="report-card" data-agent="${esc(agent)}">
      <div class="rc-head" onclick="this.parentNode.classList.toggle('open')">
        <span class="avatar" style="--avatar-bg:${avatarBg(agent)}">${esc(a ? a.icon : '🌸')}</span>
        <div class="meta"><div class="name">${esc(agent)}</div><div class="when">${when} · ${(r.output || '').length} 字</div></div>
        <span class="arrow">▶</span>
      </div>
      <div class="rc-body">${mdRender(r.output || '(無輸出)')}</div>
    </div>`;
  }).join('');
}

function exportReports() {
  const keys = Object.keys(reports);
  if (keys.length === 0) { showToast('⚠️ 暫無報告可匯出'); return; }
  let md = '# 會議報告\n\n生成時間：' + new Date().toLocaleString() + '\n\n';
  keys.forEach(agent => {
    md += `\n---\n\n## ${agent}\n\n${reports[agent].output || '(無輸出)'}\n`;
  });
  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '會議報告_' + new Date().toISOString().slice(0,10) + '.md';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('⬇ 報告已匯出');
}

// ==================== 清除 ====================
function clearAll() {
  tasks = [];
  reports = {};
  activeStreams = {};
  $chatBody.innerHTML = '';
  const empty = document.createElement('div');
  empty.className = 'chat-empty';
  empty.id = 'chatEmpty';
  empty.innerHTML = '<span class="icon">🏛️</span><b>開始一場多 Agent 會議</b><br>① 在左側勾選參與的 Agent（可搜尋）<br>② 選擇「總指揮」或直接並行<br>③ 在下方輸入總任務，點擊派發';
  $chatBody.appendChild(empty);
  $taskInput.value = '';
  renderReports();
  setBusy(false, '🟢 待命');
  $statStatus.textContent = '🟢 待命';
  showToast('🗑 已清空會議');
}

// ==================== 事件綁定 ====================
$('btnParallel').addEventListener('click', parallelDispatch);
$('btnCommander').addEventListener('click', commanderDispatch);
$('btnSend').addEventListener('click', () => {
  if (selectedAgents.size === 0) { showToast('⚠️ 請先勾選 Agent'); return; }
  if ($commander.value) commanderDispatch(); else parallelDispatch();
});
$taskInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('btnSend').click(); }
  else if (e.key === 'Enter' && e.shiftKey) { /* newline */ }
});
$taskInput.addEventListener('input', () => {
  $taskInput.style.height = 'auto';
  $taskInput.style.height = Math.min($taskInput.scrollHeight, 140) + 'px';
});

// ==================== 分隔條拖曳 ====================
function initSplitter(el, panel, side) {
  let startX = 0, startW = 0;
  el.addEventListener('mousedown', (e) => {
    e.preventDefault();
    startX = e.clientX;
    startW = panel.getBoundingClientRect().width;
    el.classList.add('active');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    const move = (ev) => {
      const dx = ev.clientX - startX;
      let w = side === 'left' ? startW + dx : startW - dx;
      w = Math.max(200, Math.min(560, w));
      panel.style.flexBasis = w + 'px';
    };
    const up = () => {
      el.classList.remove('active');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
}
initSplitter($('splitL'), $('panelLeft'), 'left');
initSplitter($('splitR'), $('panelRight'), 'right');

// ==================== 儲存/載入會議狀態 ====================
async function saveState() {
  try {
    await fetch('/api/meeting/save', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ v:1, ts: Date.now(), input: $taskInput.value, selected: Array.from(selectedAgents), tasks, reports }) });
  } catch(e) {}
}
window.addEventListener('beforeunload', saveState);
</script>
