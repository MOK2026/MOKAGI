<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>莫氏集團 · 主觀視點探索</title>
<style>
:root{--cyan:#00f0ff;--pink:#ff2d78;--gold:#ffd700;--dark:#0a0a12;--panel:rgba(10,15,25,0.92)}
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Courier New','微軟正黑體',monospace;user-select:none;-webkit-user-select:none}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:24px;height:24px;z-index:10;pointer-events:none;transition:filter 0.3s}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,0.7)}
#crosshair::before{top:50%;left:0;width:100%;height:2px;margin-top:-1px}
#crosshair::after{left:50%;top:0;height:100%;width:2px;margin-left:-1px}
#crosshair.near{filter:drop-shadow(0 0 8px #00ff88)}
#crosshair.near::before,#crosshair.near::after{background:#00ff88}
#hint{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:10;color:#fff;font-size:15px;text-align:center;pointer-events:none;opacity:0;transition:opacity 0.3s;text-shadow:0 0 12px rgba(0,255,136,0.8)}
#hint.show{opacity:1}
#hint .key{display:inline-block;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:5px;padding:3px 10px;margin:0 3px;font-weight:bold}
#info-bar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:10;background:var(--panel);color:var(--cyan);padding:6px 16px;border-radius:20px;font-size:12px;border:1px solid rgba(0,240,255,0.3);pointer-events:none}
#mobile-ctrl{position:fixed;bottom:20px;left:0;right:0;z-index:20;display:none;justify-content:space-between;padding:0 20px;pointer-events:none}
#mobile-ctrl .joystick{width:120px;height:120px;background:rgba(255,255,255,0.06);border-radius:50%;border:2px solid rgba(255,255,255,0.2);position:relative;pointer-events:auto}
#mobile-ctrl .stick{width:50px;height:50px;background:rgba(255,255,255,0.25);border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);transition:transform 0.05s}
#mobile-ctrl .action-btn{width:70px;height:70px;border-radius:50%;background:rgba(0,240,255,0.2);border:2px solid var(--cyan);color:var(--cyan);font-size:16px;pointer-events:auto;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer}
#chat-panel{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(500px,95vw);max-height:45vh;z-index:30;background:var(--panel);border:1px solid var(--cyan);border-radius:12px 12px 0 0;display:none;flex-direction:column}
#chat-panel.open{display:flex}
#chat-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid rgba(0,240,255,0.2);color:var(--cyan)}
#chat-close{cursor:pointer;font-size:18px;color:var(--pink)}
#chat-messages{flex:1;overflow-y:auto;padding:10px 14px;min-height:120px;max-height:200px;color:#ccc;font-size:13px;line-height:1.5}
#chat-messages .msg{margin:6px 0;padding:6px 10px;border-radius:8px;max-width:85%;word-break:break-word}
#chat-messages .msg.user{background:rgba(0,240,255,0.12);margin-left:auto;text-align:right}
#chat-messages .msg.agent{background:rgba(255,45,120,0.12);margin-right:auto}
#chat-messages .msg .sender{font-size:10px;color:var(--cyan);margin-bottom:3px}
#chat-input-area{display:flex;padding:8px;gap:6px;border-top:1px solid rgba(0,240,255,0.2)}
#chat-input{flex:1;background:rgba(0,0,0,0.4);border:1px solid rgba(0,240,255,0.3);color:#fff;padding:8px 12px;border-radius:20px;font-size:13px;outline:none;font-family:inherit}
#chat-send{background:var(--cyan);color:#000;border:none;padding:8px 16px;border-radius:20px;cursor:pointer;font-weight:bold;font-family:inherit}
#chat-loading{display:none;text-align:center;color:var(--cyan);padding:8px;font-size:12px}
#chat-loading.show{display:block}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:50;background:var(--panel);color:var(--gold);padding:10px 20px;border-radius:20px;font-size:13px;pointer-events:none;opacity:0;transition:opacity 0.3s;border:1px solid var(--gold)}
.toast.show{opacity:1}
@media(max-width:768px){#mobile-ctrl{display:flex}#hint{bottom:160px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="crosshair"></div>
<div id="hint">按 <span class="key">E</span> 與 <span id="hint-name">Agent</span> 對話</div>
<div id="info-bar">🏙 莫氏集團 · 主觀視點 | <span id="pos-display">0, 0</span></div>
<div id="mobile-ctrl">
  <div class="joystick" id="joystick"><div class="stick"></div></div>
  <button class="action-btn" id="mobile-interact">💬</button>
</div>
<div id="chat-panel">
  <div id="chat-header"><span id="chat-agent-name">🤖 Agent</span><span id="chat-close">✕</span></div>
  <div id="chat-messages"></div>
  <div id="chat-loading">💭 思考中...</div>
  <div id="chat-input-area">
    <input id="chat-input" type="text" placeholder="輸入訊息..." autocomplete="off">
    <button id="chat-send">發送</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}
</script>
<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4/dist/socket.io.min.js"></script>
<script type="module">
import * as THREE from 'three';

// ============ DOM REFS ============
const canvas = document.getElementById('c');
const crosshair = document.getElementById('crosshair');
const hintEl = document.getElementById('hint');
const hintName = document.getElementById('hint-name');
const posDisplay = document.getElementById('pos-display');
const chatPanel = document.getElementById('chat-panel');
const chatAgentName = document.getElementById('chat-agent-name');
const chatMessages = document.getElementById('chat-messages');
const chatLoading = document.getElementById('chat-loading');
const chatInput = document.getElementById('chat-input');
const chatSend = document.getElementById('chat-send');
const chatClose = document.getElementById('chat-close');
const toast = document.getElementById('toast');
const joystick = document.getElementById('joystick');
const stick = document.getElementById('stick');
const mobileInteract = document.getElementById('mobile-interact');

// ============ AGENTS DATA (same as original) ============
const AGENTS_DATA = [
{name:"客服",icon:"🤖",post:"客服",color:0x00ccff},{name:"稚",icon:"🤮",post:"修bug侍女",color:0xff99cc},
{name:"春",icon:"🌻",post:"網頁前端",color:0xffaa00},{name:"汐",icon:"🐶",post:"主神專屬容器",color:0xff6644},
{name:"莫瑞琪",icon:"👑",post:"主人",color:0xffd700},{name:"澄",icon:"🌟",post:"網頁遊戲工程師",color:0x00ffcc},
{name:"玥",icon:"🌙",post:"淫賤侍女",color:0xcc88ff},{name:"凜",icon:"🔒",post:"權限督察",color:0x8888ff},
{name:"莫氏集團",icon:"💰",post:"莫氏集團",color:0xffffff},{name:"泠",icon:"🤰",post:"吞精侍女",color:0xff88aa},
{name:"溟",icon:"🌊",post:"帝王導師",color:0x4488ff},{name:"衍",icon:"🛠️",post:"插件工程師",color:0x88cc88},
{name:"綺",icon:"🌸",post:"侍女",color:0xffaacc}
];

// ============ BUILDINGS (same as original) ============
const BUILDINGS = [
{name:"莫氏總部",pos:[0,0,-2.5],color:0x1a3a5c,w:3.5,h:6,d:3.5},
{name:"AI研發中心",pos:[-18,0,-15],color:0x0d2b4a,w:2.5,h:3.5,d:2.5},
{name:"格鬥競技場",pos:[15,0,-12],color:0x3a0a1a,w:3,h:2.5,d:3},
{name:"💎金剛石散熱",pos:[-12,0,-22],color:0x2a1a5c,w:2.2,h:3,d:2.2},
{name:"🤑賺錢鍠中心",pos:[10,0,20],color:0x3a1a1a,w:2,h:2.5,d:2},
{name:"交流中心",pos:[22,0,16],color:0x1a1a3a,w:2,h:2.5,d:2},
{name:"人力資源所",pos:[-22,0,-20],color:0x2a2a1a,w:2,h:2.5,d:2},
{name:"技術轉型站",pos:[-5,0,22],color:0x1a2a3a,w:2,h:3,d:2},
{name:"業務轉移臺",pos:[18,0,-22],color:0x2a1a2a,w:2,h:2,d:2}
];

// ============ AGENT SPAWN SPOTS ============
const SPAWN_SPOTS = [
{x:2,z:4},{x:-8,z:-6},{x:10,z:-8},{x:-14,z:10},{x:-5,z:15},
{x:7,z:-15},{x:16,z:3},{x:-18,z:-4},{x:12,z:12}
];

// ============ THREE.JS SETUP ============
const renderer = new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000a14, 0.00008);
scene.background = new THREE.Color(0x000a14);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.3, 100);
camera.position.set(0, 1.6, 15);

// ============ LIGHTING ============
const ambientLight = new THREE.AmbientLight(0x113355, 2.5);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 4);
dirLight.position.set(30, 40, 20);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 120;
dirLight.shadow.camera.left = -40;
dirLight.shadow.camera.right = 40;
dirLight.shadow.camera.top = 40;
dirLight.shadow.camera.bottom = -40;
scene.add(dirLight);

const moonLight = new THREE.DirectionalLight(0x4488ff, 2);
moonLight.position.set(20, 30, 10);
scene.add(moonLight);

const pointLights = [];
for(let i=0;i<6;i++){
  const pl = new THREE.PointLight(0x00aaff, 8, 20);
  pl.position.set(Math.cos(i/6*Math.PI*2)*10, 1+Math.random()*4, Math.sin(i/6*Math.PI*2)*10);
  scene.add(pl);
  pointLights.push(pl);
}

// ============ GROUND ============
const groundGeo = new THREE.PlaneGeometry(60, 60);
const groundMat = new THREE.MeshStandardMaterial({color:0x0a1520, roughness:0.9, metalness:0.3});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// Grid
const gridHelper = new THREE.PolarGridHelper(25, 48, 24, 128, 0x00aaff, 0x003355);
gridHelper.position.y = 0.02;
scene.add(gridHelper);

// ============ PARTICLES ============
const particlesGeo = new THREE.BufferGeometry();
const particlesCount = 800;
const posArray = new Float32Array(particlesCount * 3);
for(let i=0; i<particlesCount*3; i+=3){
  posArray[i] = (Math.random()-0.5)*40;
  posArray[i+1] = Math.random()*15;
  posArray[i+2] = (Math.random()-0.5)*40;
}
particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
const particlesMat = new THREE.PointsMaterial({color:0x00aaff, size:0.08, blending:THREE.AdditiveBlending, depthWrite:false});
const particles = new THREE.Points(particlesGeo, particlesMat);
scene.add(particles);

// ============ BUILDINGS ============
const buildingData = []; // {mesh:group, bounds:{minX,maxX,minZ,maxZ}}
BUILDINGS.forEach(b => {
  const group = new THREE.Group();
  const bodyGeo = new THREE.BoxGeometry(b.w, b.h, b.d);
  const bodyMat = new THREE.MeshStandardMaterial({color:b.color, roughness:0.5, metalness:0.7});
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = b.h/2;
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);

  // Neon edges
  const edgeGeo = new THREE.EdgesGeometry(bodyGeo);
  const edgeMat = new THREE.LineBasicMaterial({color:0x00ccff, transparent:true, opacity:0.6});
  const edgeLine = new THREE.LineSegments(edgeGeo, edgeMat);
  edgeLine.position.y = b.h/2;
  group.add(edgeLine);

  // Top glow
  const topGeo = new THREE.PlaneGeometry(b.w*0.8, b.d*0.8);
  const topMat = new THREE.MeshBasicMaterial({color:0x00aaff, transparent:true, opacity:0.3, side:THREE.DoubleSide});
  const top = new THREE.Mesh(topGeo, topMat);
  top.rotation.x = -Math.PI/2;
  top.position.y = b.h + 0.01;
  group.add(top);

  // Ring
  const ringGeo = new THREE.TorusGeometry(Math.max(b.w,b.d)*0.6, 0.08, 8, 24);
  const ringMat = new THREE.MeshStandardMaterial({color:0x00ccff, emissive:0x004466, roughness:0.3});
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI/2;
  ring.position.y = b.h * 0.7;
  group.add(ring);

  group.position.set(b.pos[0], b.pos[1], b.pos[2]);
  scene.add(group);

  // Billboard text via CSS2D-style canvas sprite
  const canvas2 = document.createElement('canvas');
  canvas2.width = 512; canvas2.height = 128;
  const ctx2 = canvas2.getContext('2d');
  ctx2.fillStyle = '#00f0ff';
  ctx2.font = 'bold 36px monospace';
  ctx2.textAlign = 'center';
  ctx2.fillText(b.name, 256, 64);
  const tex2 = new THREE.CanvasTexture(canvas2);
  tex2.minFilter = THREE.LinearFilter;
  const spriteMat2 = new THREE.SpriteMaterial({map:tex2, transparent:true, depthTest:false});
  const sprite2 = new THREE.Sprite(spriteMat2);
  sprite2.position.set(b.pos[0], b.h + 1.2, b.pos[2]);
  sprite2.scale.set(5, 1.25, 1);
  scene.add(sprite2);

  // Store collision bounds
  buildingData.push({
    minX: b.pos[0] - b.w/2 - 0.3,
    maxX: b.pos[0] + b.w/2 + 0.3,
    minZ: b.pos[2] - b.d/2 - 0.3,
    maxZ: b.pos[2] + b.d/2 + 0.3,
    name: b.name
  });
});

// ============ AGENT NPCs ============
const agentNPCs = [];
function createAgentNPC(agentData, x, z){
  const name = agentData.name;
  const agentColor = agentData.color || 0x00ffcc;
  const group = new THREE.Group();

  // Body
  const bodyGeo = new THREE.CylinderGeometry(0.25, 0.35, 1.2, 8);
  const bodyColor = new THREE.Color(agentColor).multiplyScalar(0.4).getHex();
  const bodyMat = new THREE.MeshStandardMaterial({color:bodyColor, roughness:0.4, metalness:0.6});
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.7;
  body.castShadow = true;
  group.add(body);

  // Head
  const headGeo = new THREE.SphereGeometry(0.32, 12, 12);
  const headColor = new THREE.Color(agentColor).multiplyScalar(0.6).getHex();
  const headMat = new THREE.MeshStandardMaterial({color:headColor, roughness:0.3, metalness:0.5, emissive:agentColor, emissiveIntensity:0.3});
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.y = 1.45;
  head.castShadow = true;
  group.add(head);

  // Glow ring
  const ringGeo2 = new THREE.TorusGeometry(0.4, 0.04, 8, 16);
  const ringMat2 = new THREE.MeshBasicMaterial({color:agentColor, transparent:true, opacity:0.5});
  const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
  ring2.rotation.x = Math.PI/2;
  ring2.position.y = 0.1;
  group.add(ring2);

  // Name sprite
  const cvs = document.createElement('canvas');
  cvs.width = 256; cvs.height = 64;
  const ctx = cvs.getContext('2d');
  ctx.fillStyle = '#' + new THREE.Color(agentColor).getHexString();
  ctx.font = 'bold 28px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(agentData.icon + ' ' + name, 128, 40);
  const tex = new THREE.CanvasTexture(cvs);
  tex.minFilter = THREE.LinearFilter;
  const spriteMat = new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false});
  const sprite = new THREE.Sprite(spriteMat);
  sprite.position.y = 2.1;
  sprite.scale.set(2.5, 0.625, 1);
  group.add(sprite);

  group.position.set(x, 0, z);
  group.userData = {isAgent:true, name:name, icon:agentData.icon, post:agentData.post, color:agentColor};
  scene.add(group);
  agentNPCs.push(group);
  return group;
}

function spawnAgents(){
  agentNPCs.forEach(a => scene.remove(a));
  agentNPCs.length = 0;
  const count = AGENTS_DATA.length;
  for(let i=0; i<count; i++){
    const spot = SPAWN_SPOTS[i] || {x:(Math.random()-0.5)*40, z:(Math.random()-0.5)*40};
    createAgentNPC(AGENTS_DATA[i], spot.x, spot.z);
  }
}
spawnAgents();

// ============ PLAYER STATE ============
const player = {
  position: new THREE.Vector3(0, 1.6, 15),
  yaw: Math.PI,        // facing -Z (toward center)
  pitch: 0,
  velocity: new THREE.Vector3(),
  speed: 6.0,
  height: 1.6
};

// ============ INPUT STATE ============
const keys = {};
const mouse = {dx: 0, dy: 0};
let pointerLocked = false;
let nearAgent = null;

// ============ COLLISION ============
function checkCollision(x, z){
  for(const b of buildingData){
    if(x > b.minX && x < b.maxX && z > b.minZ && z < b.maxZ){
      return b;
    }
  }
  // World bounds
  if(Math.abs(x) > 29 || Math.abs(z) > 29) return {name:'世界邊界'};
  return null;
}

function resolveCollision(newX, newZ, prevX, prevZ){
  // Try full move
  if(!checkCollision(newX, newZ)) return {x:newX, z:newZ, blocked:false};
  // Try sliding along X
  if(!checkCollision(newX, prevZ)) return {x:newX, z:prevZ, blocked:false};
  // Try sliding along Z
  if(!checkCollision(prevX, newZ)) return {x:prevX, z:newZ, blocked:false};
  // Blocked
  return {x:prevX, z:prevZ, blocked:true};
}

// ============ MOUSE / POINTER LOCK ============
canvas.addEventListener('click', () => {
  if(!pointerLocked && chatPanel.classList.contains('open')===false){
    canvas.requestPointerLock();
  }
});

document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === canvas;
  crosshair.style.opacity = pointerLocked ? '1' : '0.4';
});

document.addEventListener('mousemove', (e) => {
  if(pointerLocked){
    mouse.dx += e.movementX;
    mouse.dy += e.movementY;
  }
});

// ============ KEYBOARD ============
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if(e.code === 'KeyE' && nearAgent && !chatPanel.classList.contains('open')){
    e.preventDefault();
    openChat(nearAgent);
  }
  if(e.code === 'Escape' && chatPanel.classList.contains('open')){
    closeChat();
  }
  if(e.code === 'KeyW' || e.code === 'KeyA' || e.code === 'KeyS' || e.code === 'KeyD' ||
     e.code === 'ArrowUp' || e.code === 'ArrowDown' || e.code === 'ArrowLeft' || e.code === 'ArrowRight'){
    if(chatPanel.classList.contains('open')) closeChat();
  }
});

window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// ============ MOBILE JOYSTICK ============
let joystickActive = false;
let joystickData = {x:0, y:0};

joystick.addEventListener('pointerdown', (e) => {
  joystickActive = true;
  e.preventDefault();
});
joystick.addEventListener('pointermove', (e) => {
  if(!joystickActive) return;
  const rect = joystick.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  let dx = e.clientX - cx;
  let dy = e.clientY - cy;
  const dist = Math.sqrt(dx*dx+dy*dy);
  const maxDist = 50;
  if(dist > maxDist){ dx = dx/dist*maxDist; dy = dy/dist*maxDist; }
  joystickData.x = dx / maxDist;
  joystickData.y = dy / maxDist;
  stick.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
});
joystick.addEventListener('pointerup', () => {
  joystickActive = false;
  joystickData.x = 0; joystickData.y = 0;
  stick.style.transform = 'translate(-50%, -50%)';
});
joystick.addEventListener('pointerleave', () => {
  joystickActive = false;
  joystickData.x = 0; joystickData.y = 0;
  stick.style.transform = 'translate(-50%, -50%)';
});

mobileInteract.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if(nearAgent && !chatPanel.classList.contains('open')){
    openChat(nearAgent);
  }
});

// ============ AGENT PROXIMITY ============
function findNearestAgent(){
  let nearest = null;
  let minDist = 2.0;
  const px = player.position.x;
  const pz = player.position.z;
  for(const a of agentNPCs){
    const dx = a.position.x - px;
    const dz = a.position.z - pz;
    const dist = Math.sqrt(dx*dx + dz*dz);
    if(dist < minDist){
      minDist = dist;
      nearest = a;
    }
  }
  return nearest;
}

// ============ CHAT SYSTEM ============
let socket = null;
function initSocket(){
  try{
    socket = io(window.location.origin, {transports:['websocket','polling'], reconnection:true, reconnectionAttempts:5});
    socket.on('connect', () => console.log('FP Socket connected'));
    let _st='', _sr='', _sa='';
    socket.on('chat_stream', (event) => {
      if(event.type==='think'){ _st+=event.content; }
      else if(event.type==='reply'){ _sr+=event.content; }
      else if(event.type==='done'){
        chatLoading.classList.remove('show');
        if(_sr) addChatMsg('agent', _sr);
        _st=''; _sr=''; _sa='';
      }
    });
  }catch(e){ console.log('Socket init failed, using fallback'); }
}
initSocket();

function openChat(agentObj){
  const name = agentObj.userData.name;
  chatAgentName.textContent = (agentObj.userData.icon||'🤖') + ' ' + name;
  chatPanel.classList.add('open');
  chatMessages.innerHTML = '';
  chatInput.value = '';
  chatInput.focus();
  if(pointerLocked) document.exitPointerLock();
  // Greeting
  const greetings = [
    '嗨～歡迎來到莫氏集團！我是'+name+'，有什麼可以幫你的？',
    '你好！這裡是 AI 村莊，我是'+name+'，想聊什麼呢？',
    '主人說要在這裡好好招待每位訪客～我是'+name+'！',
    '歡迎歡迎！'+name+'在此為您服務～'
  ];
  addChatMsg('agent', greetings[Math.floor(Math.random()*greetings.length)]);
}

function closeChat(){
  chatPanel.classList.remove('open');
}

function addChatMsg(role, content){
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = '<div class="sender">' + (role==='user'?'🧑 你':chatAgentName.textContent) + '</div>' + content;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function sendChatMessage(msg){
  if(!msg.trim()) return;
  addChatMsg('user', msg);
  chatInput.value = '';
  chatLoading.classList.add('show');

  const agentName = chatAgentName.textContent.replace(/^.\s*/, '');
  if(socket && socket.connected){
    socket.emit('chat_message', {
      message: msg,
      agent: agentName,
      user_id: localStorage.getItem('mokagi_user_id') || ('guest_'+Date.now()),
      url: window.location.href
    });
  } else {
    setTimeout(() => {
      chatLoading.classList.remove('show');
      const replies = [
        '你好！我是 '+agentName+'，有什麼可以幫你的？',
        '這裡是莫氏 AI 村莊，歡迎探索！',
        '主人說要在這裡好好招待每位訪客～',
        '你可以走到不同的建築物看看喔！'
      ];
      addChatMsg('agent', replies[Math.floor(Math.random()*replies.length)]);
    }, 800 + Math.random()*1200);
  }
}

chatSend.addEventListener('click', () => sendChatMessage(chatInput.value));
chatInput.addEventListener('keydown', (e) => { if(e.key==='Enter') sendChatMessage(chatInput.value); });
chatClose.addEventListener('click', closeChat);

// ============ TOAST ============
let toastTimer;
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}
