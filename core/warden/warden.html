<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warden · 緊急守衛</title>
<style>
  :root{--bg:#12131a;--card:#1c1e29;--fg:#e9ecf5;--mut:#8b90a8;--red:#ff3b47;--grn:#2ecc71;--amber:#ffb020;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,"Noto Sans TC",system-ui,sans-serif;padding:18px;}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:16px}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin-bottom:18px}
  .card{background:var(--card);border-radius:14px;padding:14px 16px;}
  .card .n{font-weight:700;font-size:15px}
  .card .p{color:var(--mut);font-size:12px;word-break:break-all}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .up{background:var(--grn)} .down{background:var(--red)}
  .btns{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px}
  button{border:0;border-radius:14px;padding:16px 22px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;background:#3a3f55;transition:.15s}
  button:hover{filter:brightness(1.12)}
  button.panic{background:linear-gradient(135deg,#ff3b47,#c1121f);font-size:19px;padding:20px 30px;box-shadow:0 0 0 rgba(255,59,71,.6);animation:pulse 1.8s infinite}
  button.resume{background:#1f7a4d}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,71,.55)}70%{box-shadow:0 0 0 16px rgba(255,59,71,0)}100%{box-shadow:0 0 0 0 rgba(255,59,71,0)}}
  pre{background:#0d0e14;border-radius:12px;padding:12px;max-height:320px;overflow:auto;font-size:12.5px;color:#c9cde0}
  .badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .locked{background:rgba(255,59,71,.18);color:var(--red);border:1px solid rgba(255,59,71,.5)}
  .unlocked{background:rgba(46,204,113,.15);color:var(--grn);border:1px solid rgba(46,204,113,.4)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#232636;border:1px solid #3a3f55;padding:12px 18px;border-radius:12px;display:none;max-width:90vw;white-space:pre-wrap;font-size:13px}
</style>
</head>
<body>
  <h1>🛡️ Warden · MOKAGI 緊急守衛</h1>
  <div class="sub">獨立於 mokagi。緊急停止 = pm2 stop + 擊殺殘留 + 上鎖。<span id="lockbadge"></span></div>

  <div class="btns">
    <button class="panic" onclick="panic()">🚨 緊急停止</button>
    <button class="resume" onclick="resume()">▶️ 解除並恢復</button>
    <button onclick="loadStatus()">🔄 重新整理</button>
  </div>

  <div class="grid" id="svcs"></div>

  <h3 style="margin:6px 0">日誌</h3>
  <pre id="logbox">載入中…</pre>

  <div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',4200);}
async function call(path, method){
  const r = await fetch(path, {method: method||'GET'});
  const j = await r.json().catch(()=>({ok:false,error:'bad json'}));
  toast(JSON.stringify(j, null, 2));
  return j;
}
async function loadStatus(){
  try{
    const r = await fetch('/api/status'); const j = await r.json();
    $('#lockbadge').innerHTML = j.locked
      ? ' <span class="badge locked">已上鎖 LOCKED</span>'
      : ' <span class="badge unlocked">解鎖中</span>';
    $('#svcs').innerHTML = j.services.map(s=>`
      <div class="card">
        <div class="n"><span class="dot ${s.alive?'up':'down'}"></span>${s.name} ${s.critical?'🔑':''}</div>
        <div class="p">PID: ${s.pids.length? s.pids.join(', ') : '—（未運行）'}</div>
        <div class="p">${(s.cmds[0]||'').slice(0,80)}</div>
        <button style="margin-top:8px;padding:8px 14px;font-size:13px" onclick="restart('${s.name}')">安全重啟</button>
      </div>`).join('');
  }catch(e){ toast('status 失敗: '+e); }
}
async function loadLog(){
  try{ const r = await fetch('/api/log?n=120'); const j = await r.json();
    $('#logbox').textContent = (j.lines||[]).join('\n') || '（無日誌）';
  }catch(e){}
}
function panic(){ if(confirm('確定要「緊急停止」所有 mokagi 進程並上鎖嗎？')) call('/api/panic?reason=ui','POST').then(()=>{loadStatus();loadLog();}); }
function resume(){ call('/api/resume','POST').then(()=>{loadStatus();loadLog();}); }
function restart(n){ if(confirm('安全重啟 '+n+' ？（pm2 stop + start）')) call('/api/restart?name='+encodeURIComponent(n),'POST').then(()=>{loadStatus();loadLog();}); }
loadStatus(); loadLog(); setInterval(loadStatus, 8000); setInterval(loadLog, 8000);
</script>
</body>
</html>
